.card,.speech-panel,.v5-panel{background:var(--panel)!important;border:1px solid var(--border)!important;color:var(--text)!important;border-radius:16px;padding:18px;box-shadow:none}.card{margin:14px 0}.card b{display:block;color:var(--muted);font-size:12px;letter-spacing:1px;margin-bottom:8px}.card.mine{border-left:4px solid var(--yellow)!important;background:#173348!important}.card.mine b{color:var(--yellow)}.card div{font-size:18px}.note{background:#0b2734;color:var(--muted);border:1px solid var(--border);margin:15px 0}.progress{background:#17384c;height:6px}#bar{background:var(--green)}#status{color:var(--muted);font-size:14px}small,.v5-help{color:var(--muted)!important}.speech-live{color:var(--text)!important}.speech-score{color:var(--green)}.v5-button{background:#102b40;color:var(--text);border-color:var(--border)}.v5-button.selected{background:var(--yellow);color:#142132}.v5-direction{background:#152b3b!important;color:#b4c7d4!important;border-color:#4c6a7d}.speech-panel.unsupported{background:#33291b!important}.speech-panel p{line-height:1.5}

<body><div style="text-align:center;padding:7px;background:#eef2f7;border-bottom:1px solid #d8dee8;font-weight:800">Cue! · LEERAPP · VERSIE 5</div><header><b>Cue! – Toneeltekst Leerapp</b><div>Met de gesproken teksten van alle tegenspelers</div></header>
<main>
<div class="note">Bij oefenen wordt de volledige gesproken tekst van de tegenspelers vóór jouw repliek getoond. Alleen jouw eigen repliek wordt verborgen.</div>
<div class="grid">
<label>Mijn rol<br><select id="role"></select></label>
<label>Scène<br><select id="scene"></select></label>
</div>
<div class="toolbar">
<button id="read" class="primary">Lees hele scène</button>
<button id="start">Start oefenen</button>
<button id="prev">← Vorige repliek</button>
<button id="reveal">Toon mijn tekst</button>
<button id="next">Volgende repliek →</button>
</div>
<div class="progress"><div id="bar"></div></div><p id="status"></p><section id="out"></section>
</main>
<script>
const CUE_LIBRARY={"scripts":[{"id":"unaniem","title":"Unaniem","data":{"roles":["Bewaker","Jurylid 1","Jurylid 10","Jurylid 11","Jurylid 12","Jurylid 2","Jurylid 3","Jurylid 4","Jurylid 5","Jurylid 6","Jurylid 7","Jurylid 8","Jurylid 9","Stem Rechter","Voorzitter"],"scenes":[{"title":"SCENE 1          Hitte, ongemak, irritatie.","cards":[{"role":"Jurylid 9","text":"(gaat naar het toilet.)"},{"role":"Jurylid 4","text":"(begint een krant te lezen.)"},{"role":"Jurylid 3","text":"(gaat snel zitten neemt haalt wat aantekeningen tevoorschijn en bestudeert ze.)"},{"role":"Jurylid 2","text":"(loopt naar de waterkoeler en haalt een beker water.)"},{"role":"Jurylid 1","text":"(scheurt een vel uit het notitieblok en scheurt kleine stukjes papier voor stembiljetten De bewaker loopt naar de 12e jurylid en controleert zijn naam Anderen lopen onhandig door de kamer. Er wordt even niet gepraat..)"},{"role":"Jurylid 7","text":"Kauwgum?"},{"role":"Jurylid 4","text":"schudt zijn hoofd."},{"role":"Jurylid 6","text":".)"},{"role":"Jurylid 7","text":"(veegt zijn voorhoofd af) ik heb gehoord dat dit de warmste dag van het jaar tot nu toe is. (de 6e jurylid knikt en staart uit het raam) Je zou denken dat ze op zijn minst airconditioning zouden hebben. Ik viel bijna dood neer in de rechtbank."},{"role":"Bewaker","text":"Oké, beste jury. Iedereen is er. Als jullie iets nodig hebben, ik ben hier. Klop maar op de deur. (De bewaker vertrekt en in de stilte klinkt het geluid van de deur die op slot gaat.)"},{"role":"Jurylid 5","text":"Ik wist niet dat ze de deur op slot deden."},{"role":"Jurylid 10","text":"Natuurlijk sluiten ze de deur. Wat dacht je dan?"},{"role":"Jurylid 5","text":"Ik wist het niet. Nooit over nagedacht eigenlijk. Ik wil dat ook niet! (De 10e jurylid loopt naar de voorzitter, blijft naast hem staan en wijst naar de papiertjes.)"},{"role":"Jurylid 10","text":"Hé, waar zijn die voor?"},{"role":"Voorzitter","text":"Nou, ik dacht dat we misschien wel zouden willen stemmen met stembiljetten."},{"role":"Jurylid 10","text":"(Sarcastisch) Geweldig idee! Misschien kunnen we hem meteen als senator kiezen. (Hij lacht totdat hij begint te hoesten. De voorzitter kijkt op zijn horloge en vergelijkt het met de klok. De derde jurylid neemt een beker water uit de waterkoeler, loopt naar de tweede jurylid en kijkt de kamer rond terwijl hij van het water nipt.)"},{"role":"Jurylid 3","text":"(tegen de tweede jurylid) Wat vond je ervan?"},{"role":"Jurylid 2","text":"(mild) Ik weet het niet, het was best interessant."},{"role":"Jurylid 3","text":"Ja? Ik viel bijna in slaap."},{"role":"Jurylid 2","text":"Ik bedoel, ik heb nog nooit in een jury gezeten."},{"role":"Jurylid 3","text":"Echt waar? Ik heb weleens in jury's gezeten en het verbaast me altijd hoe advocaten kunnen praten en praten en praten, zelfs als de zaak zo duidelijk is als deze. Ik bedoel, heb je ooit zoveel gepraat over niets gehoord?"},{"role":"Jurylid 2","text":"Nou, ik denk dat ze daar recht op hebben."},{"role":"Jurylid 3","text":"Natuurlijk hebben ze dat. Iedereen verdient een eerlijk proces. Zo werkt het systeem. Luister, ik ben de laatste die er iets tegen zou hebben, maar ik zeg je dat ik soms denk dat we beter af zouden zijn als we deze lastige kinderen eens flink zouden aanpakken voordat ze problemen veroorzaken, snap je? Dat zou ons veel tijd en geld besparen. (De tweede jurylid kijkt nerveus naar de derde jurylid, knikt, staat op, loopt naar de waterkoeler, vult zijn beker en staat alleen te nippen.)"},{"role":"Jurylid 7","text":"(tegen de voorzitter) Hé, zullen we maar beginnen?"},{"role":"Jurylid 3","text":"Ja, laten we dit maar zo snel mogelijk achter de rug zien te krijgen. We hebben waarschijnlijk allemaal nog dingen te doen."},{"role":"Voorzitter","text":"Nou, ik dacht dat we een vijf minuten pauze zouden nemen. Ik bedoel, één man is naar het toilet..."},{"role":"Jurylid 5","text":"(aarzelend tegen de voorzitter) Gaan we op volgorde zitten?"},{"role":"Voorzitter","text":"Wat? Ik weet het niet. Ik denk het wel."},{"role":"Jurylid 12","text":"(Het 8e jurylid kijkt uit het raam. Tegen de 8e jurylid., wil interessant doen) Niet slecht uitzicht. (het 8e jurylid knikt) Wat vind je van de zaak? (het 8e jurylid geeft geen antwoord) Ik vond het erg interessant. Geen saaie momenten, snap je wat ik bedoel? Ik moet zeggen dat we geluk hebben gehad met deze moordzaak. Ik had meer een inbraak of een mishandeling verwacht. Dat zijn vaak de saaiste zaken. (Hij kijkt uit het raam.) Zeg, is dat niet het Woolworth Building?"},{"role":"Jurylid 8","text":"Dat klopt."},{"role":"Jurylid 12","text":"Grappig, ik woon hier al mijn hele leven en ik ben er nog nooit binnen geweest. (Het 8e jurylid staart uit het raam. De 12e jurylid kijkt hem even aan en loopt dan weg. De 7e jurylid, in gesprek met de 10e jurylid, lacht)"},{"role":"Jurylid 10","text":"Ja, kun je je voorstellen dat je daar drie dagen lang zit, alleen maar voor dit?"},{"role":"Jurylid 7","text":"En hoe zit het dan met dat mes? Ik bedoel, volwassen mensen vragen om dat soort onzin te geloven."},{"role":"Jurylid 10","text":"Nou, kijk, dat moet je verwachten. Je weet waar je mee te maken hebt."},{"role":"Jurylid 7","text":"Ja, ik denk het wel. (De tiende jurylid snuit zijn neus, jurylid staat vlak bij hen) Wat is er aan de hand, ben je verkouden?"},{"role":"Jurylid 10","text":"Nee, Allergisch."},{"role":"Jurylid 7","text":"(het 7e jurylid klimt op de bank en probeert de ventilator) Oh, dat is prachtig, de ventilator werkt niet. Kan iemand een brief schrijven naar de burgemeester. \"Beste gierigaard...\" (De derde jurylid loopt naar de vierde jurylid, buigt zich voorover en bekijkt de krant van de vierde jurylid. De voorzitter klimt op de bank en bekijkt de ventilator)"},{"role":"Jurylid 3","text":"(tegen de vierde jurylid) Ik heb vandaag geen kans gehad om de kranten te lezen. Is er nog nieuws?"},{"role":"Jurylid 4","text":"Ik vroeg me af hoe de beurs is gesloten."},{"role":"Jurylid 3","text":"Dat weet ik niet. Zeg, zit je op de beurs of zo?"},{"role":"Jurylid 4","text":"Ik ben makelaar."},{"role":"Jurylid 3","text":"Echt waar? Ik heb een koeriersdienst. \"The Beck and Call Company.\" De naam is bedacht door mijn vrouw. Ik heb zevenendertig mensen in dienst... ben met niets begonnen..."},{"role":"Jurylid 7","text":"(kijkt op zijn horloge) Hé, meneer de voorzitter, laten we beginnen. Vind je niet?."},{"role":"Voorzitter","text":"Oké, heren. Laten we gaan zitten"},{"role":"Jurylid 7","text":"(tegen de 2e jurylid) Dit moet snel gaan. Ik heb kaartjes voor een honkbalwedstrijd vanavond. Yankees tegen Cleveland. We hebben een nieuwe werper, CC Sabathia, of hoe hij ook heet. Die jongen is een beest. (Hij steekt zijn hand naar voren en naar buiten om de baan van een curveball aan te geven) Shhooooooom. Een echte jug handle. (Geen enkele reactie van de tweede jurylid) Je bent nogal een honkbalfan, hè? (Hij wendt zich tot de voorzitter) Waar wilt u dat we gaan zitten?"},{"role":"Voorzitter","text":"Nou, ik dacht dat we op volgorde zouden gaan zitten, op basis van onze jurynummers. (Hij wijst met elk nummer) Twee, drie, vier, enzovoort, als u dat allemaal goed vindt."},{"role":"Jurylid 10","text":"Wat maakt dat uit?"},{"role":"Jurylid 4","text":"Ik denk dat het redelijk is om op nummer te zitten."},{"role":"Jurylid 10","text":"(staat op) Het zal wel. (Hij gaat naar stoel 10 en gaat zitten. De juryleden nemen plaats. De 8e jurylid blijft uit het raam staren. De 9e jurylid is nog steeds in het toilet.)"},{"role":"Jurylid 12","text":"(tegen de 11e jurylid) Wat was uw indruk van de officier van justitie?"},{"role":"Jurylid 11","text":"Pardon?"},{"role":"Jurylid 12","text":"Ik vond hem erg scherpzinnig. Ik bedoel, de manier waarop hij zijn argumenten één voor één in logische volgorde naar voren bracht. Daar is een goed stel hersens voor nodig. Ik was erg onder de indruk."},{"role":"Jurylid 11","text":"Ja, ik vind dat hij het uitstekend heeft gedaan."},{"role":"Jurylid 12","text":"Ik bedoel, hij had ook veel drive. Echte drive."},{"role":"Jurylid 7","text":"Oké, laten we beginnen."},{"role":"Voorzitter","text":"(tegen de 8e jurylid) Wilt u gaan zitten? (de 8e jurylid hoort de voorzitter niet) De heer bij het raam. (De 8e jurylid draait zich geschrokken om) Wilt u gaan zitten?"},{"role":"Jurylid 8","text":"Oh, sorry. (Hij verplaatst zijn stoel en gaat zitten.)"},{"role":"Jurylid 10","text":"(over de tafel naar de 4e jurylid) Het is best moeilijk te begrijpen, nietwaar? Een kind vermoordt zijn vader. BAM! Zo simpel is het."},{"role":"Jurylid 12","text":"Nou, als je de cijfers analyseert..."},{"role":"Jurylid 10","text":"Welke cijfers, het zijn dat soort mensen. Ik zeg je, ze laten die kinderen maar doen wat ze willen. Nou ja, misschien hebben ze het ook wel verdiend. Begrijp je wat ik bedoel?"},{"role":"Voorzitter","text":"Is iedereen aanwezig?"},{"role":"Jurylid 6","text":"(met een gebaar naar de wc) De oude man is binnen."},{"role":"Voorzitter","text":"Wilt u even op de deur kloppen? (De 6e jurylid staat op en loopt naar de deur van de wc. )"},{"role":"Jurylid 7","text":"(tegen de 6e jurylid) Hé, ben je een fan van de Yankees?"},{"role":"Jurylid 6","text":"Nee. Milwaukee."},{"role":"Jurylid 7","text":"Milwaukee! Dat is alsof je elke dag één keer met een koevoet op je hoofd wordt geslagen. Luister, wie hebben ze... (De zesde jurylid klopt op de deur van het toilet) ...Ik vraag je, wie hebben ze, behalve geweldige terreinbeheerders? (Het"},{"role":"Jurylid 9","text":"komt uit de wc.)"},{"role":"Voorzitter","text":"(tegen de 7e jurylid) We willen graag beginnen"},{"role":"Jurylid 9","text":"O, sorry. (hij loopt naar zijn stoel)"},{"role":"Jurylid 7","text":"Milwaukee!"},{"role":"Jurylid 9","text":"Ik wilde u niet laten wachten."}]},{"title":"SCENE 2       Eerste stemming: 11–1 schuldig.","cards":[{"role":"Voorzitter","text":"Oké. Nu kunnen jullie heren dit aanpakken zoals jullie willen. Ik bedoel, ik ga geen regels opleggen. Als we het eerst willen bespreken en dan stemmen, is dat een mogelijkheid. Of we kunnen nu meteen stemmen om te zien hoe we ervoor staan. (Hij pauzeert en kijkt rond.) Nou, dat is alles wat ik te zeggen heb."},{"role":"Jurylid 4","text":"Ik denk dat het gebruikelijk is om een voorlopige stemming te houden."},{"role":"Jurylid 7","text":"Ja, laten we stemmen. Wie weet kunnen we dan allemaal naar huis."},{"role":"Voorzitter","text":"Het is aan jullie. Laten we niet vergeten dat we hier te maken hebben met een aanklacht voor moord met voorbedachten rade. Als we 'schuldig' stemmen, sturen we de verdachte naar de elektrische stoel. Dat is verplicht."},{"role":"Jurylid 4","text":"Ik denk dat we dat allemaal weten."},{"role":"Jurylid 3","text":"Kom op, laten we stemmen."},{"role":"Jurylid 10","text":"Ja, laten we eens kijken wie waar staat."},{"role":"Voorzitter","text":"Is er iemand die niet wil stemmen? (Hij kijkt rond, de anderen zwijgen) Oké. Dit moet een twaalf-tegen-nul stemming worden, hoe dan ook. Dat is de wet. Oké, zijn we klaar? Iedereen die voor 'schuldig' stemt, steek je hand op. (Zeven of acht handen gaan onmiddellijk omhoog. Verschillende andere gaan langzamer omhoog. Iedereen kijkt rond de tafel terwijl de voorzitter opstaat en begint te tellen. De hand van de negende jurylid gaat nu omhoog en alle handen zijn omhoog, behalve die van het achtste jurylid.) Negen, tien, elf. Dat is elf voor 'schuldig'. Oké, 'niet schuldig'. (De achtste jurylid steekt langzaam zijn hand op.) Voorzitter Eén. Juist. Oké, elf tegen één -- \"Schuldig\". Nu weten we waar we staan. (Hij gaat weer zitten.)"},{"role":"Jurylid 10","text":"Echt! Er is er altijd wel één."},{"role":"Jurylid 7","text":"(na een pauze) Wat doen we nu?"},{"role":"Jurylid 8","text":"Nou, ik denk dat we gaan praten."},{"role":"Jurylid 10","text":"Ach Jezus"},{"role":"Jurylid 3","text":"(leunt naar de 8e jurylid toe) Nou, luister, denk je echt dat hij onschuldig is?"},{"role":"Jurylid 8","text":"Ik weet het niet."},{"role":"Jurylid 3","text":"Laten we redelijk zijn. Je hebt in de rechtbank gezeten en hetzelfde gehoord als wij. Die man is een gevaarlijke moordenaar. Dat kon je zien."},{"role":"Jurylid 8","text":"Die man! Hij is zestien jaar oud. Het is nog maar een kind."},{"role":"Jurylid 3","text":"Nou, dat is oud genoeg. Hij heeft zijn eigen vader neergestoken. Tien centimeter diep in de borst."},{"role":"Jurylid 6","text":"(tegen de 8e jurylid) Het is vrij duidelijk. Ik bedoel, ik was vanaf de eerste moment overtuigd."},{"role":"Jurylid 3","text":"Nou, wie was dat niet? (tegen de 8e jurylid) Ik denk echt dat dit een uitgemaakte zaak is. Ze hebben het op talloze manieren bewezen. Wilt u dat ik ze voor u opsom?"},{"role":"Jurylid 8","text":"Nee."},{"role":"Jurylid 10","text":"Wat wil je dan?"},{"role":"Jurylid 8","text":"Niets. Ik wil gewoon praten."},{"role":"Jurylid 7","text":"Nou, wat valt er nog te bespreken? Elf mensen zijn het hierover eens. Niemand hoefde er lang over na te denken, behalve jij."},{"role":"Jurylid 10","text":"Ik wil je iets vragen. Geloof je zijn verhaal?"},{"role":"Jurylid 8","text":"Ik weet niet of ik het geloof of niet. Misschien geloof ik het niet."},{"role":"Jurylid 7","text":"Waarom heb je dan voor 'niet schuldig' gestemd?"},{"role":"Jurylid 8","text":"Er waren elf stemmen voor 'schuldig'. Ik vind het niet makkelijk om mijn hand op te steken en een jongen ter dood te veroordelen zonder er eerst over te praten."},{"role":"Jurylid 6","text":"Wie zegt dat het makkelijk voor mij is?"},{"role":"Jurylid 8","text":"Niemand."},{"role":"Jurylid 7","text":"Ik denk dat die man schuldig is. Je zou mijn mening niet kunnen veranderen, al zou je honderd jaar lang praten."},{"role":"Jurylid 8","text":"Ik probeer je niet op andere gedachten te brengen. Het gaat hier alleen om iemands leven. We kunnen niet binnen vijf minuten een beslissing nemen. Stel dat we het mis hebben?"},{"role":"Jurylid 7","text":"Stel dat we het mis hebben! Stel dat dit hele gebouw op mijn hoofd valt. Je kunt van alles stellen."},{"role":"Jurylid 8","text":"Dat klopt."},{"role":"Jurylid 7","text":"(na een pauze) Wat maakt het uit hoe lang het duurt? We denken echt dat hij schuldig is. Stel dat we binnen vijf minuten klaar zijn? Wat dan nog?"},{"role":"Jurylid 8","text":"Laten we er een uur over doen. De wedstrijd begint pas om acht uur."},{"role":"Jurylid 7","text":"(glimlachend) Oké, makker, ga je gang. (Er valt een stilte.)"}]},{"title":"SCENE 3       Conflict start.","cards":[{"role":"Voorzitter","text":"(aarzelend) Nou, wie heeft er iets te zeggen? (Hij kijkt naar de tweede jurylid.)"},{"role":"Jurylid 2","text":"Niet ik."},{"role":"Jurylid 9","text":"Ik ben bereid om een uur te investeren."},{"role":"Jurylid 10","text":"Geweldig. Ik heb gisteravond een heel leuk verhaal gehoord. Er komt een vrouw de spreekkamer van de dokter binnenrennen, naakt en met haar tieten …...."},{"role":"Jurylid 5","text":"Daar zitten we hier niet voor."},{"role":"Jurylid 10","text":"Oké, vertel het me dan. Waarom zitten we hier dan?"},{"role":"Jurylid 8","text":"Misschien zonder reden. Ik weet het niet. Kijk, deze jongen is zijn hele leven al heen en weer geslingerd. Hij woont in een sloppenwijk, zijn moeder is overleden toen hij negen was. Hij heeft anderhalf jaar in een weeshuis doorgebracht terwijl zijn vader een gevangenisstraf uitzat voor valsheid in geschrifte. Dat is geen erg goede start. Hij heeft een behoorlijk vreselijke zestien jaar achter de rug. Ik denk dat we hem misschien een paar woorden verschuldigd zijn. Dat is alles."},{"role":"Jurylid 10","text":"Ik vind het niet erg om u dit te vertellen, meneer. We zijn hem niets verschuldigd. Hij heeft een eerlijk proces gekregen, toch? Wat denkt u dat dat proces gekost heeft? Hij mag van geluk spreken dat hij dat gekregen heeft. Begrijpt u wat ik bedoel? (Hij staat op en kijkt rond naar de anderen.) Luister, we zijn hier allemaal volwassenen. We hebben de feiten gehoord, nietwaar? Je gaat ons nu toch niet vertellen dat we dat joch moeten geloven, terwijl we weten wat hij is. Luister, ik heb mijn hele leven tussen dat volk geleefd. Je kunt geen woord geloven van wat ze zeggen. Dat weet je. Ik bedoel, het zijn geboren leugenaars."},{"role":"Jurylid 9","text":"Het dringt plotseling tot me door dat je een onwetende man moet zijn."},{"role":"Jurylid 10","text":"Wat bedoel je? Waar heeft hij het over?"},{"role":"Jurylid 9","text":"Denk je dat jij het alleenrecht op de waarheid hebt?"},{"role":"Jurylid 10","text":"Waarom maak je er zo'n punt van? (tegen de anderen) Wat vinden jullie van deze man?"},{"role":"Jurylid 9","text":"(tegen de anderen) Ik denk dat we deze man een en ander moeten uitleggen."},{"role":"Jurylid 3","text":"Oké. Het is geen zondag. We hebben hier geen preek nodig."},{"role":"Jurylid 10","text":"Alleenrecht! In godsnaam. (De 9e jurylid staat half op, maar voelt dan de hand van de 8e jurylid op zijn arm, die hem zachtjes naar beneden trekt. De"},{"role":"Jurylid 12","text":"krabbelt wat in zijn notitieblok.)"},{"role":"Jurylid 4","text":"Ik zie geen reden om zo te discussiëren. Ik vind dat we ons netjes moeten gedragen. Als we deze zaak gaan bespreken, laten we ons dan beperken tot de feiten."},{"role":"Voorzitter","text":"Dat is een goed punt. We hebben werk te doen. Laten we dat dan ook doen. Misschien kan degene die het niet met ons eens is, ons vertellen waarom. Vertel ons wat hij denkt, dan kunnen we hem laten zien waar hij zich waarschijnlijk vergist."},{"role":"Jurylid 11","text":"(kijkt naar de krabbel van de 12e jurylid) Wat is dat?"},{"role":"Jurylid 12","text":"Mmm? (hij houdt de krabbel omhoog) Het is een van de producten waar ik aan werk bij het reclamebureau. \"FitStart ontbijtgranen – Voor mensen die nog niet praten vóór het ontbijt.” Die slogan heb ik bedacht."},{"role":"Jurylid 11","text":"(glimlacht ondanks zichzelf) Het is erg pakkend."},{"role":"Voorzitter","text":"Als u het niet erg vindt! (De tweede jurylid haalt een pakje hoestbonbons uit zijn jaszak.)"},{"role":"Jurylid 12","text":"Het spijt me. Ik heb de gewoonte om te krabbelen. Dat helpt me om helder te blijven denken."},{"role":"Voorzitter","text":"We proberen hier iets te bereiken. We kunnen hier natuurlijk eindeloos blijven zitten…"},{"role":"Jurylid 12","text":"Nou, kijk, misschien is dit een idee. Ik denk gewoon hardop, maar het lijkt me dat het aan ons is om deze heer te overtuigen... (hij wijst naar de 8e jurylid) dat wij gelijk hebben en hij ongelijk. Misschien als we elk een minuut of twee nemen om onze kant van het verhaal te vertellen. Ik bedoel, het is maar een vluchtige gedachte…"},{"role":"Voorzitter","text":"Nee, ik vind het een goede. Laten we eens rond de tafel gaan."},{"role":"Jurylid 7","text":"Prima, laten we beginnen."},{"role":"Voorzitter","text":"Oké. (tegen de 7e jurylid) Wil jij als eerste beginnen?"},{"role":"Jurylid 7","text":"Ik niet."},{"role":"Jurylid 6","text":"Laten we gewoon op volgorde gaan."},{"role":"Voorzitter","text":"Dat klinkt redelijk. Oké, in volgorde... een paar minuten per persoon. (Tegen de"},{"role":"Jurylid 2","text":") Ik denk dat jij als eerste bent."},{"role":"Jurylid 2","text":"Oh. Nou... (Hij pauzeert nerveus.) Nou, het is moeilijk onder woorden te brengen. Ik denk gewoon dat hij schuldig is. Ik vond het vanaf het begin al duidelijk. Niemand heeft het tegendeel bewezen."},{"role":"Jurylid 8","text":"Niemand hoeft het tegendeel te bewijzen. De bewijslast ligt bij de aanklager. De verdachte hoeft zijn mond niet open te doen. Dat staat in de grondwet. Je hebt er vast wel eens van gehoord. Iedereen is onschuldig totdat het tegendeel bewezen is."},{"role":"Jurylid 2","text":"(verward) Nou, natuurlijk heb ik ervan gehoord. Ik weet wat het is. Ik... wat ik bedoelde... nou, die man is schuldig. Ik bedoel, iemand heeft hem het zien doen. (Hij kijkt hulpeloos om zich heen.)"},{"role":"Jurylid 3","text":"Oke (verwijst naar zijn aantekeningen) Dit is wat ik denk, en ik heb hier geen persoonlijke gevoelens over. Ik heb het over feiten. Nummer één. Laten we eens kijken naar de oude man die op de tweede verdieping woonde, precies onder de kamer waar de moord plaatsvond. Om tien minuten over twaalf 's nachts van de moord hoorde hij luide geluiden in het appartement boven hem. Hij zei: \"Het klonk als een ruzie.\" Toen hoorde hij het kind roepen: \"Ik maak je dood.\" Een seconde later hoorde hij een lichaam vallen en rende hij naar de deur van zijn appartement, keek naar buiten en zag het kind de trap af rennen en het huis uit rennen. Toen belde hij de politie. Ze vonden de vader met een mes in zijn borst."},{"role":"Jurylid 6","text":"En de lijkschouwer stelde het tijdstip van overlijden vast op rond middernacht."},{"role":"Jurylid 3","text":"Juist. Ik bedoel, dit zijn de feiten. Feiten kun je niet weerleggen. Deze jongen is schuldig. Kijk, ik ben net zo sentimenteel als ieder ander. Ik weet dat hij pas zestien is, maar hij moet toch boeten voor wat hij heeft gedaan."},{"role":"Jurylid 7","text":"Ik ben het met je eens."},{"role":"Jurylid 4","text":"(zijn bril afnemend) Het was voor mij in ieder geval duidelijk dat het hele verhaal van de jongen ongeloofwaardig was. Hij beweerde dat hij tijdens de moord in de bioscoop was, maar een uur later kon hij zich niet herinneren welke films hij had gezien of wie erin speelde."},{"role":"Jurylid 3","text":"Dat klopt. Heb je dat gehoord? (tegen de 4e jurylid) Je hebt helemaal gelijk."},{"role":"Jurylid 4","text":"Niemand heeft hem de zaal zien binnenkomen of verlaten."},{"role":"Jurylid 10","text":"Luister, hoe zit het met die vrouw aan de overkant van de straat? Als haar getuigenis het niet bewijst, dan doet niets dat."},{"role":"Jurylid 11","text":"Dat klopt. Zij was degene die de moord daadwerkelijk heeft gezien."},{"role":"Voorzitter","text":"(half opstaand) Laten we de volgorde aanhouden."},{"role":"Jurylid 10","text":"(staat op, zakdoek in de hand) Wacht even. Hier is een vrouw... (hij snuit zijn neus) Hier is een vrouw die in bed ligt en niet kan slapen. Ze gaat dood van de hitte. Begrijp je wat ik bedoel? Hoe dan ook, ze kijkt uit het raam en ziet aan de overkant van de straat hoe de jongen het mes in zijn vader steekt. Het is precies twaalf uur tien. Alles klopt. Kijk, ze kent het kind al zijn hele leven. Zijn raam ligt recht tegenover dat van haar, aan de overkant van de spoorlijn, en ze zweert dat ze hem het heeft zien doen."},{"role":"Jurylid 8","text":"Door de ramen van een voorbijrijdende trein."},{"role":"Jurylid 10","text":"Juist. Er waren geen passagiers in deze trein. Hij werd alleen maar naar het centrum verplaatst. De lichten waren uit, weet je nog? En in de rechtbank werd bewezen dat je 's nachts door de ramen van een trein kunt kijken als de lichten uit zijn en zien wat er gebeurt aan de andere kant. Dat hebben ze bewezen."},{"role":"Jurylid 8","text":"(tegen de 10e jurylid) Ik wil je iets vragen."},{"role":"Jurylid 10","text":"Graag."},{"role":"Jurylid 8","text":"Je gelooft de jongen niet. Waarom geloof je dan de vrouw wel? Zij is toch ook een van 'hen'?"},{"role":"Jurylid 10","text":"(plotseling boos) Je bent een behoorlijk slimme kerel, nietwaar? (Hij loopt naar de 8e jurylid toe. Verschillende juryleden staan op alsof ze de 10e jurylid willen tegenhouden.)"},{"role":"Voorzitter","text":"Hé, rustig aan."},{"role":"Jurylid 10","text":"(boos) Wat weet hij nou zo goed? kom op zeg.."},{"role":"Jurylid 3","text":"Kom op. Ga zitten. Waarom laat je je door hem zo van streek maken? (Het tiende jurylid neemt plaats.)"},{"role":"Voorzitter","text":"Laten we nu even kalmeren. Laten we proberen het hier rustig te houden. Wie is er aan de beurt?"},{"role":"Jurylid 12","text":"(wijst naar de 5e jurylid) Zij."},{"role":"Voorzitter","text":"Oké. (tegen het 5de jurylid) Je hebt twee minuten."},{"role":"Jurylid 5","text":"(kijkt nerveus om zich heen) Ik sla het over."},{"role":"Voorzitter","text":"Dat is uw goed recht. En de volgende?"},{"role":"Jurylid 6","text":"Ik weet het niet. Ik begon overtuigd te raken, eh... weet je, al heel vroeg in de zaak. Nou, ik was op zoek naar het motief. Dat is heel belangrijk. Als er geen motief is, waar is dan de zaak? Hoe dan ook, die getuigenis van die mensen aan de overkant van de gang van het appartement van de jongen was erg krachtig. Zeiden ze niet iets over een ruzie tussen de vader en de jongen rond zeven uur die avond? Ik kan me vergissen."},{"role":"Jurylid 11","text":"Het was acht uur. Niet zeven."},{"role":"Jurylid 8","text":"Dat klopt. Om acht uur. Ze hoorden ruzie, maar konden niet verstaan waar het over ging. Toen hoorden ze de vader de jongen twee keer slaan en uiteindelijk zagen ze de jongen boos het huis uit lopen. Wat bewijst dat?"},{"role":"Jurylid 6","text":"Nou, het bewijst niet echt iets. Het is slechts een deel van het plaatje. Ik heb niet gezegd dat het iets bewijst."},{"role":"Jurylid 8","text":"Je zei dat het een motief voor de moord onthulde. De officier van justitie zei hetzelfde. Nou, ik vind het geen erg sterk motief. Deze jongen is in zijn leven zo vaak geslagen dat geweld voor hem bijna normaal is geworden. Ik kan me niet voorstellen dat twee klappen in zijn gezicht hem ertoe hebben aangezet om moord te plegen."},{"role":"Jurylid 4","text":"(zachtjes) Misschien waren het wel twee klappen te veel. Iedereen heeft een breekpunt."},{"role":"Voorzitter","text":"(tegen de 6e jurylid) Nog iets anders?"},{"role":"Jurylid 6","text":"Nee"},{"role":"Voorzitter","text":"Oké. (tegen de 7e jurylid) Hoe zit het met de volgende?"},{"role":"Jurylid 7","text":"Ik? (hij pauzeert, kijkt om zich heen, haalt zijn schouders op) Ik weet het niet, het is eigenlijk al gezegd. We kunnen er eindeloos over praten. Ik bedoel, deze jongen heeft vijf keer gefaald. Kijk maar naar zijn strafblad. Toen hij tien was, kwam hij voor de kinderrechter omdat hij een steen naar zijn leraar had gegooid. Op zijn veertiende zat hij in een heropvoedingsinstituut. Hij had een auto gestolen. Hij is gearresteerd voor beroving. Hij is twee keer opgepakt omdat hij een andere tiener met een mes had willen neersteken. Ze zeggen dat hij erg snel is met zakmessen. Dit is echt geen fijne jongen."},{"role":"Jurylid 8","text":"Sinds hij vijf jaar oud was, sloeg zijn vader hem regelmatig. Hij gebruikte zijn vuisten."},{"role":"Jurylid 7","text":"Dat zou ik ook doen."},{"role":"Jurylid 4","text":"Zijn die mishandelingen niet een motief om zijn vader te vermoorden?"},{"role":"Jurylid 8","text":"(na een pauze) Ik weet het niet. Het is een motief voor hem om een boos kind te zijn. Dat zou ik zeggen."},{"role":"Jurylid 3","text":"Het zijn de kinderen, hoe ze tegenwoordig zijn. Boos! Vijandig! Je kunt niets met ze beginnen. Alleen al hoe ze tegen je praten. Luister, toen ik zo oud was als hij, noemde ik mijn vader 'meneer'. Inderdaad. Meneer! Hoor je nog weleens een jongen zijn vader zo noemen?"},{"role":"Jurylid 8","text":"Vaders lijken het niet meer belangrijk te vinden."},{"role":"Jurylid 3","text":"Nee? Heb je zelf kinderen?"},{"role":"Jurylid 8","text":"Twee."},{"role":"Jurylid 3","text":"Ja, nou, ik heb er een. Hij is twintig. We hebben alles voor die jongen gedaan en wat is er gebeurd? Toen hij negen was, rende hij weg tijdens een ruzie. Ik zag het. Ik schaamde me zo dat ik bijna moest overgeven. Dus ik heb hem duidelijk gezegd: \"Ik maak een man van je, of ik breek je in tweeën terwijl ik dat probeer.\" Nou, ik heb er wel een man van gemaakt. Toen hij zestien was, hadden we ruzie. Hij sloeg me in mijn gezicht. Hij is groot, weet je. Ik heb hem al twee jaar niet meer gezien. Rotjoch. Je werkt je uit de naad... (Hij breekt af. Hij heeft meer gezegd dan hij van plan was. Hij schaamt zich.)"},{"role":"Jurylid 3","text":"Oké. Laten we verdergaan."},{"role":"Jurylid 4","text":"(staat op) Ik denk dat we hier iets over het hoofd zien. Deze jongen, laten we zeggen dat hij het product is van een smerige buurt en een gebroken gezin. Daar kunnen we niets aan doen. We zijn hier om te beslissen of hij schuldig of onschuldig is aan moord, niet om in te gaan op de redenen waarom hij zo is opgegroeid. Hij is geboren in een sloppenwijk. Sloppenwijken zijn broedplaatsen voor criminelen. Dat weet ik. Jullie ook. Dat is geen geheim. Kinderen uit sloppenwijken zijn potentiële bedreigingen voor de samenleving. Nu denk ik..."},{"role":"Jurylid 10","text":"(onderbreekt) Makker, dat kun je wel zeggen. De kinderen uit die achterbuurten, is echt uitschot. Ik wil niets met hen te maken hebben."},{"role":"Jurylid 5","text":"(staat op) Ik heb mijn hele leven in een sloppenwijk gewoond... Ik verzorg dat uitschot zes nachten per week in het Harlem Hospital."},{"role":"Jurylid 10","text":"Oh, wacht even..."},{"role":"Jurylid 5","text":"Ik speelde vroeger in een achtertuin die vol lag met afval. Misschien ruik ik nog steeds naar die stank."},{"role":"Jurylid 10","text":"(zijn woede neemt toe) Luister eens, meisje..."},{"role":"Voorzitter","text":"(tegen de 5de-jurylid) Laten we nu eens redelijk zijn. Het is niets persoonlijks..."},{"role":"Jurylid 5","text":"(luid) Er is wel degelijk iets persoonlijks! (De derde jurylid loopt naar het 5de jurylid en klopt hem op de schouder. het 5de jurylid kijkt niet op.)"},{"role":"Jurylid 3","text":"Kom op, zeg. Hij bedoelde jou niet. Laten we niet zo gevoelig zijn."},{"role":"Jurylid 11","text":"Deze gevoeligheid begrijp ik wel."},{"role":"Voorzitter","text":"Oké, laten we ophouden met ruziën. We verspillen hier onze tijd. (Hij wijst naar de 8e jurylid) Het is jouw beurt. Kom op."},{"role":"Jurylid 8","text":"Nou, ik had geen beurt verwacht. Ik dacht dat jullie mij allemaal moesten overtuigen. Is dat niet het idee?"},{"role":"Voorzitter","text":"Klopt. Dat was ik vergeten."},{"role":"Jurylid 10","text":"Nou, wat maakt dat uit? Hij is degene die ons hier houdt. Laten we eens luisteren wat hij te zeggen heeft."},{"role":"Voorzitter","text":"Nee, wacht even. We hebben besloten om het op een bepaalde manier te doen. Laten we ons aan wat we hebben afgesproken houden."},{"role":"Jurylid 10","text":"(walgend) Ach, doe eens niet zo kinderachtig, wil je?"},{"role":"Voorzitter","text":"Kinderachtig! Luister, wat bedoel je daarmee?"},{"role":"Jurylid 10","text":"Wat denk je dat ik bedoel?"},{"role":"Voorzitter","text":"Wat, alleen omdat ik probeer dit geordend te houden? Luister. (hij staat op) Wil jij het doen? Hier. Ga hier zitten. Neem de verantwoordelijkheid op je. Ik houd gewoon mijn mond, dat is alles."},{"role":"Jurylid 10","text":"Luister, waarom word je zo boos? Rustig aan, oké?"},{"role":"Voorzitter","text":"Zeg me niet dat ik rustig moet blijven. Hier! Hier is de stoel. Zorg dat alles soepel verloopt. Denk je dat het een makkie is? Kom op, laten we eens kijken hoe goed jij de show zou runnen"},{"role":"Jurylid 10","text":"(tegen 11e jurylid) Heb je ooit zoiets gezien?"},{"role":"Voorzitter","text":"Vind je dat grappig of zo?"},{"role":"Jurylid 12","text":"Rustig aan. Het is allemaal niet belangrijk."},{"role":"Voorzitter","text":"Onbelangrijk? Wil je het proberen?"},{"role":"Jurylid 12","text":"Nee. Luister, je doet het geweldig. Niemand wil veranderen."},{"role":"Jurylid 6","text":"Je doet het prima."},{"role":"Jurylid 7","text":"(cynisch) Ja, ja, je doet het geweldig. Hou vol en ga door."},{"role":"Jurylid 10","text":"Oké. Laten we doorgaan. (Er valt een stilte.) Akte 2 Analyse van het bewijs"}]},{"title":"SCENE 4       Het mes!","cards":[{"role":"Jurylid 8","text":"Nou, als je wilt weten hoe ik er nu over denk, ik vind het prima."},{"role":"Voorzitter","text":"(zachtjes) Het maakt me niet uit wat je doet."},{"role":"Jurylid 8","text":"{na een pauze) Oké. Ik heb niets briljants te melden. Ik weet net zoveel als jullie. Volgens de getuigenverklaringen lijkt de jongen schuldig. Misschien is hij dat ook wel. Ik heb drie dagen lang in de rechtbank gezeten en geluisterd terwijl het bewijs werd opgebouwd. Iedereen klonk zo positief dat ik een vreemd gevoel begon te krijgen over dit proces. Ik bedoel, niets is zo positief. Ik had vragen die ik graag had willen stellen. Misschien hadden ze niets betekent. Ik weet het niet. Maar ik begon het gevoel te krijgen dat de advocaat van de verdediging zijn werk niet goed deed. Hij liet te veel dingen gaan. Kleine dingen."},{"role":"Jurylid 10","text":"Welke kleine dingen? Luister, als deze jongens geen vragen stellen, is dat omdat ze de antwoorden al weten en denken dat het hun zaak alleen maar kan benadelen."},{"role":"Jurylid 8","text":"Misschien. Het is ook mogelijk dat een advocaat gewoon dom is, nietwaar?"},{"role":"Jurylid 6","text":"Je klinkt alsof je mijn zwager hebt ontmoet. (Een paar juryleden lachen.)"},{"role":"Jurylid 8","text":"(glimlachend) Ik bleef mezelf in de plaats van de jongen verplaatsen. Ik zou om een andere advocaat hebben gevraagd, denk ik. Ik bedoel, als ik terechtstond voor mijn leven, zou ik willen dat mijn advocaat de getuigen van de aanklager aan flarden scheurde, of dat tenminste probeerde. Kijk, er was één vermeende ooggetuige van deze moord. Iemand anders beweert dat hij de moord heeft gehoord en daarna de jongen heeft zien wegrennen. Er was veel indirect bewijs, maar eigenlijk waren die twee getuigen de enige basis voor de aanklacht. Stel dat ze het bij het verkeerde eind hadden?"},{"role":"Jurylid 12","text":"Wat bedoel je met \"Stel dat ze het bij het verkeerde eind hadden?\" Wat heeft het dan voor zin om getuigen te hebben?"},{"role":"Jurylid 8","text":"Zou ze het bij het verkeerde eind kunnen hebben?"},{"role":"Jurylid 12","text":"Ze hebben onder ede getuigd. Wat wil je daarmee zeggen?"},{"role":"Jurylid 8","text":"Het zijn maar mensen. Mensen maken fouten. Kunnen ze zich vergissen?"},{"role":"Jurylid 12","text":"Ik... Nee! Ik denk het niet."},{"role":"Jurylid 8","text":"Weet u dat zeker?"},{"role":"Jurylid 12","text":"Luister eens. Niemand kan zoiets weten. Dit is geen exacte wetenschap."},{"role":"Jurylid 8","text":"Dat klopt. Dat is het niet."},{"role":"Jurylid 3","text":"(staat boos op) Oké. (tegen de 8e jurylid) Laten we ter zake komen. Hoe zit het met het zakmes dat ze in de borst van de vader hebben gevonden?"},{"role":"Jurylid 2","text":"Wacht even. Ik denk dat we... Er zijn nog mensen die nog niet hebben gesproken. Moeten we niet..."},{"role":"Jurylid 3","text":"Luister, ze kunnen praten wanneer ze willen. Wees nu even stil, wil je? (Hij wendt zich tot de 8e jurylid) Oké, hoe zit het met het mes? Je weet wel, dat mes dat die nette, oprechte jongen heeft toegegeven te hebben gekocht op de avond van de moord. Laten we het daar eens over hebben."},{"role":"Jurylid 8","text":"Oké, laten we erover praten. Laten we het hierheen halen en bekijken. Ik wil het nog eens zien. (Hij wendt zich tot de voorzitter) Voorzitter? (De voorzitter staat op en loopt naar de deur.)"},{"role":"Jurylid 3","text":"We weten allemaal hoe het eruit ziet. (De voorzitter klopt op de deur. De bewaker komt binnen. De voorzitter fluistert iets tegen hem. De bewaker knikt en gaat weer weg.) Wat levert het ons op om het nog eens te bekijken?"},{"role":"Jurylid 5","text":"Jij bracht het ter sprake."},{"role":"Jurylid 4","text":"Hij heeft het recht om bewijsstukken te bekijken. (tegen de 8e jurylid) Het mes en de manier waarop het is gekocht, zijn behoorlijk sterk bewijs. Vindt u ook niet?"},{"role":"Jurylid 8","text":"Ja, dat vind ik wel."},{"role":"Jurylid 4","text":"Goed. Laten we deze feiten nu een voor een bekijken. Eén. De jongen gaf toe dat hij op de avond van de moord om acht uur zijn huis had verlaten nadat hij meerdere keren door zijn vader was geslagen."},{"role":"Jurylid 8","text":"Hij zei niet \"geslagen\". Hij zei \"geraakt\". Er is een verschil tussen een klap en een stoot."},{"role":"Jurylid 4","text":"(negeerd jurylid 8) Nadat hij meerdere keren door zijn vader was geslagen, Twee, ging de jongen rechtstreeks naar een rommelwinkel in de buurt waar hij een... Hoe noem je deze dingen ook alweer…"},{"role":"Jurylid 3","text":"Stiletto."},{"role":"Jurylid 4","text":"... een stiletto. (tegen de 3e jurylid) Bedankt. Drie. Dit was geen gewoon mes. Het had een heel bijzonder gesneden handvat. Vier. De winkelier die het aan hem had verkocht, identificeerde het mes in de rechtbank en zei dat het het enige exemplaar was dat hij ooit in zijn assortiment had gehad. Vijf. Om ongeveer kwart voor negen kwam de jongen drie vrienden tegen voor een restaurant. Klopt het tot nu toe?"},{"role":"Jurylid 8","text":"Ja, dat klopt."},{"role":"Jurylid 3","text":"(tegen de 8e jurylid) Zeker weten. (tegen de anderen) Luister nu naar deze man. Hij weet waar hij het over heeft."},{"role":"Jurylid 4","text":"De jongen praatte ongeveer een uur met zijn vrienden en vertrok om kwart voor tien. Gedurende deze tijd zagen ze het zakmes. Zes. Elk van hen identificeerde het moordwapen in de rechtbank als datzelfde mes. Zeven. De jongen kwam rond tien uur thuis. Nu beginnen de verhalen van de jongen en de staat enigszins uiteen te lopen. Hij beweert dat hij thuis bleef tot half twaalf en ging toen naar een van die nachtelijke films. Hij kwam om ongeveer kwart over drie 's nachts thuis en vond zijn vader dood en werd zelf gearresteerd. Wat is er nu met het zakmes gebeurd? Dit is het charmante en fantasierijke verhaaltje dat de jongen heeft verzonnen. Hij beweert dat het mes ergens tussen half twaalf en kwart over drie door een gat in zijn zak is gevallen terwijl hij naar de bioscoop ging en dat hij het nooit meer heeft teruggezien. Dit is een verhaaltje, heren. Ik denk dat het vrij duidelijk is dat de jongen die avond nooit naar de bioscoop is geweest. Niemand in het huis zag hem om half twaalf vertrekken. Niemand in het theater herkende hem. Hij kon zich zelfs de namen van de films die hij had gezien niet herinneren. Wat er werkelijk gebeurde, was dit: de jongen bleef thuis, kreeg opnieuw ruzie met zijn vader, stak hem om tien over twaalf dood met het mes en vluchtte het huis uit. Hij dacht er zelfs aan om de vingerafdrukken van het mes te verwijderen. (De bewaker komt binnen met een vreemd vormgegeven mes waaraan een label hangt. De vierde jurylid gaat naar de bewaker toe en neemt het mes van hem aan. De bewaker vertrekt.) Iedereen die bij de zaak betrokken was, heeft het mes geïdentificeerd. Wil je me nu vertellen dat het echt door een gat in de broekzak van de jongen is gevallen en dat iemand het van de straat heeft geraapt, naar het huis van de jongen is gegaan en zijn vader ermee heeft neergestoken, alleen maar voor de lol?"},{"role":"Jurylid 8","text":"Nee. Ik zeg dat het mogelijk is dat de jongen het mes heeft verloren en dat iemand anders zijn vader met een soortgelijk mes heeft neergestoken. Dat is mogelijk. (De vierde jurylid klapt het mes open en steekt het in de tafel. )"},{"role":"Jurylid 4","text":"Kijk eens naar dat mes. Ik heb nog nooit zo'n mes gezien. De winkelier die het aan de jongen verkocht, ook niet. Vraagt u ons niet om een nogal ongeloofwaardig toeval te accepteren?"},{"role":"Jurylid 8","text":"Ik vraag niemand om het te accepteren. Ik zeg alleen dat het mogelijk is."},{"role":"Jurylid 3","text":"(schreeuwend) En ik zeg dat het niet mogelijk is. (De 8e jurylid staat even stil, dan steekt hij zijn hand in zijn zak en haalt er snel een mes uit. Hij houdt het voor zijn gezicht en klapt het lemmet open, dan leunt hij voorover en steekt het mes naast het andere in de tafel. Ze zijn precies hetzelfde.)"},{"role":"Jurylid 6","text":"Kijk eens! Het is hetzelfde mes."},{"role":"Jurylid 7","text":"Wat is dit?"},{"role":"Jurylid 12","text":"Waar komt dat vandaan?"},{"role":"Jurylid 2","text":"Zo zie je maar."},{"role":"Jurylid 3","text":"(kijkt naar de 8e jurylid, verbaasd) Wat probeer je te doen?"},{"role":"Jurylid 10","text":"Ja. Wat is hier aan de hand? Wie denk je wel dat je bent?"},{"role":"Jurylid 4","text":"Stil! Laten we stil zijn. (tegen de 8e jurylid) Waar heb je dat mes vandaan?"},{"role":"Jurylid 8","text":"Ik heb gisteravond een paar uur gewandeld, gewoon om na te denken. Ik liep door de buurt waar de jongen woont. Het mes komt uit een klein pandjeshuis drie straten verderop. Het kostte zes dollar."},{"role":"Jurylid 4","text":"Het is verboden om zakmessen te kopen of te verkopen."},{"role":"Jurylid 8","text":"Dat klopt. Ik heb de wet overtreden."},{"role":"Jurylid 3","text":"Luister. Je hebt hier een heel slimme truc uitgehaald. Stel dat je me vertelt wat je hebt bewezen? Misschien zijn er wel tien van zulke messen. En dan?"},{"role":"Jurylid 8","text":"Misschien wel."},{"role":"Jurylid 3","text":"Wat betekent dat dan? Het is hetzelfde soort mes. Wat is dat dan? De ontdekking van de eeuw of zo?"},{"role":"Jurylid 11","text":"Het zou nog steeds een ongelooflijk toeval zijn als iemand anders de vader met hetzelfde soort mes zou hebben neergestoken."},{"role":"Jurylid 3","text":"Dat zou inderdaad toeval zijn. Hij heeft gelijk."},{"role":"Jurylid 7","text":"De kans is één op een miljoen."},{"role":"Jurylid 8","text":"Het is mogelijk."},{"role":"Jurylid 4","text":"Maar niet erg waarschijnlijk."},{"role":"Voorzitter","text":"Luister, laten we gaan zitten. Het heeft geen zin om hier rond te blijven lopen. (Ze gaan terug naar hun stoelen. De achtste jurylid blijft staan kijken.)"},{"role":"Jurylid 2","text":"Het is interessant dat hij precies hetzelfde mes heeft gevonden als het mes dat de jongen had gekocht."},{"role":"Jurylid 3","text":"Wat is er interessant? Denk je dat het iets bewijst?"},{"role":"Jurylid 2","text":"Nou, nee. Ik was gewoon..."},{"role":"Jurylid 3","text":"Interessant! (Hij wijst naar de 8e jurylid) Luister, waarom heeft die jongen dat mes eigenlijk gekocht?"},{"role":"Jurylid 8","text":"Nou, hij beweert dat."},{"role":"Jurylid 3","text":"Ik weet het weer. Hij beweert dat hij het als cadeau voor een vriend van hem heeft gekocht. Hij zou het hem de volgende dag geven, omdat hij het mes van die andere jongen kapot had gemaakt door het op de stoep te laten vallen."},{"role":"Jurylid 8","text":"Dat is wat hij zei."},{"role":"Jurylid 7","text":"Onzin!"},{"role":"Jurylid 9","text":"De vriend heeft verklaard dat de jongen zijn mes heeft gebroken."},{"role":"Jurylid 3","text":"Ja. En hoe lang voor de moord? Drie weken. Klopt dat? Hoe komt het dan dat onze nobele jongeman dit mes een half uur nadat zijn vader hem had geslagen en drieënhalf uur voordat ze het hier in de borst van zijn vader gevonden hebben, heeft gekocht?"},{"role":"Jurylid 7","text":"Nou, hij wilde het mes aan zijn vriend geven. Hij wilde het alleen even gebruiken. (Er klinkt verspreid gelach.)"},{"role":"Jurylid 8","text":"(tegen de 3e jurylid) Laat me je dit vragen. Het is een van de vragen die ik in de rechtbank wilde stellen. Als de jongen het mes had gekocht om zijn vader mee te vermoorden, waarom liet hij dan een paar uur voor de moord het moordwapen aan drie vrienden zien?"},{"role":"Jurylid 3","text":"Luister, dit is allemaal maar gepraat. De jongen heeft gelogen en dat weet je."},{"role":"Jurylid 8","text":"Hij heeft misschien gelogen. (tegen 10e jurylid) Denk je dat hij heeft gelogen?"},{"role":"Jurylid 10","text":"Dat is een domme vraag. Natuurlijk heeft hij gelogen."},{"role":"Jurylid 8","text":"(tegen 4e jurylid) Jij ook?"},{"role":"Jurylid 4","text":"Dat hoef je mij niet te vragen. Je weet mijn antwoord. Hij heeft gelogen."},{"role":"Jurylid 8","text":"(tegen 5de jurylid) Denkt u dat hij heeft gelogen?"},{"role":"Jurylid 5","text":"Ik denk dat hij misschien... (Hij onderbreekt zichzelf en kijkt nerveus om zich heen.)"},{"role":"Jurylid 3","text":"(springt in de bres) Misschien! Wacht even. (tegen 8e jurylid) Wat ben jij, de advocaat van die jongen of zo? Wie denk je wel dat je bent om ons te ondervragen?"},{"role":"Jurylid 8","text":"Is dat niet wat er in een jurykamer hoort te gebeuren?"},{"role":"Jurylid 3","text":"Luister, er zijn nog steeds elf van ons die denken dat hij schuldig is."},{"role":"Jurylid 7","text":"Ja. Wat denk je te bereiken? Je gaat niemand van gedachten doen veranderen. Dus als je koppig wilt zijn en deze jury wilt laten stranden, ga je gang. De jongen zal opnieuw worden berecht en zeker schuldig worden bevonden."},{"role":"Jurylid 8","text":"Je hebt waarschijnlijk gelijk."},{"role":"Jurylid 7","text":"Wat ga je eraan doen? We kunnen hier de hele nacht blijven."},{"role":"Jurylid 9","text":"Het is maar één nacht. Een jongen kan sterven."},{"role":"Jurylid 7","text":"Jezus. Heeft iemand een pak kaarten?"},{"role":"Jurylid 2","text":"(tegen de voorzitter) Ik vind dat hij daar geen grapjes over moet maken."},{"role":"Voorzitter","text":"Wat wil je dat ik doe?"},{"role":"Jurylid 10","text":"Luister, ik snap niet wat dat mes ermee te maken heeft. Iemand heeft gezien dat de kinderen zijn vader hebben neergestoken. Wat hebben we nog meer nodig? Terwijl jij aan het praten bent, gaan er drie garages van mij naar de knoppen. Laten we dit afhandelen en hier wegwezen."},{"role":"Jurylid 11","text":"Het mes was erg belangrijk voor de officier van justitie. Hij besteedde een hele ochtend..."},{"role":"Jurylid 10","text":"Hij is een invaller of zoiets. Wat weet hij ervan?"},{"role":"Voorzitter","text":"Oké. Ik denk dat we nu maar eens verder moeten gaan. Deze zijdelingse discussies vertragen ons alleen maar. (tegen de 8e jurylid) Wat vind jij ervan?"},{"role":"Jurylid 6","text":"(tegen de 8e jurylid) Jij bent de enige."},{"role":"Jurylid 8","text":"Ik heb een voorstel voor jullie allemaal. Ik wil een stemming houden. Ik wil dat jullie elf in een geheime schriftelijke stemming stemmen. Ik onthoud me van stemming. Als er nog steeds elf stemmen voor schuldig zijn, sta ik alleen. Dan ga ik met jullie mee en leggen we het vonnis direct voor aan de rechter. Maar als iemand voor niet schuldig stemt, blijven we hier om hierover te praten. (even pauze) Nou, dat is alles. Als u het wilt proberen, ben ik er klaar voor."},{"role":"Jurylid 2","text":"Nou, eindelijk gedraag je je als een redelijk mens."},{"role":"Jurylid 12","text":"Oké, dat geloof ik wel."},{"role":"Jurylid 7","text":"Oké. Laten we het doen."},{"role":"Voorzitter","text":"Dat klinkt redelijk. (Sommige juryleden knikken. Het 8e jurylid loopt naar het raam.) Is er iemand die het hier niet mee eens is? Oké. Geef deze door. (Hij deelt de papiertjes uit. De achtste jurylid kijkt toe hoe de anderen bezig zijn. De juryleden geven de briefjes door. Uiteindelijk begint iedereen te schrijven. Sommigen vouwen hun briefje op en geven het terug aan de voorzitter. De voorzitter stapelt alle briefjes op de tafel voor zich. Hij pakt het eerste briefje, vouwt het open en leest om de beurt de briefjes) Schuldig. Schuldig. Schuldig. Schuldig. Schuldig. Schuldig. Schuldig. Schuldig. Schuldig. Niet schuldig. (Er klinkt een geroezemoes van stemmen. De 8e jurylid ontspant zich, loopt naar zijn stoel en gaat zitten. De voorzitter leest het laatste briefje voor) Schuldig."}]},{"title":"SCENE 5       SLOPPENWIJK","cards":[{"role":"Jurylid 10","text":"Jongen! Wat is dit nu weer?"},{"role":"Jurylid 7","text":"En weer iemand die overstag gaat!"},{"role":"Jurylid 10","text":"Oké, wie was het? Kom op. Ik wil het weten."},{"role":"Jurylid 11","text":"Pardon. Dit was een geheime stemming. Dat hadden we afgesproken."},{"role":"Jurylid 3","text":"Geheim? Hoezo geheim? Er zijn geen geheimen in een jurykamer. Ik weet wie het was. (Hij loopt naar het 5de jurylid.) Kerel, je bent me er eentje! Je komt hier binnen en stemt net als iedereen voor schuldig, en dan begint die predikant met zijn gouden stem je hart te breken met verhalen over een arm kind dat niet anders kon dan moordenaar worden. Dus verander je je stem. Als dat niet walgelijk is... Waarom gooi je geen kwartje in zijn collectebus?"},{"role":"Jurylid 5","text":"Wacht even. (De derde jurylid draait zich om.) Je kunt niet zo tegen mij praten! (De derde jurylid draait zich naar hem toe. De vierde jurylid glipt tussen hen in en pakt de derde jurylid bij de arm.) Nee. (Hij schudt de vierde jurylid van zich af) Nee, laat me los. Waar haalt hij het recht vandaan om tegen mij te schreeuwen?"},{"role":"Jurylid 4","text":"Oké. Laten we rustig blijven."},{"role":"Jurylid 5","text":"Wie denkt hij wel dat hij is? Ik bedoel, heb je hem gezien?"},{"role":"Jurylid 4","text":"Ga gewoon zitten. Hij is erg prikkelbaar. Laat maar. Het maakt niet uit."},{"role":"Jurylid 3","text":"Natuurlijk ben ik prikkelbaar. We proberen een schuldige man op de stoel te zetten waar hij thuishoort en plotseling vertelt iemand ons sprookjes - en wij luisteren."},{"role":"Jurylid 2","text":"(mild) Rustig aan."},{"role":"Jurylid 3","text":"Wat bedoel je met 'rustig aan'? Wil je een bewezen moordenaar vrij rond zien lopen? Waarom geven we hem zijn mes niet terug? Dat maakt het makkelijker voor hem."},{"role":"Voorzitter","text":"Oké, laten we ophouden met schreeuwen. Wie heeft er iets constructiefs te zeggen?"},{"role":"Jurylid 11","text":"Alstublieft. Ik wil hier graag iets zeggen. Ik heb altijd gedacht dat een man in dit land het recht had om impopulaire meningen te hebben..."},{"role":"Jurylid 7","text":"Laten we bij het onderwerp blijven. (tegen de 5e jurylid) Waarom heb je je stem veranderd?"}]},{"title":"SCENE 6       Getuige oude man","cards":[{"role":"Jurylid 9","text":"Hij heeft zijn stem niet veranderd. Ik wel. Wil je weten waarom?"},{"role":"Jurylid 7","text":"Nee, ik wil niet dat je me vertelt waarom."},{"role":"Jurylid 9","text":"Ik wil het toch graag duidelijk maken, als u het niet erg vindt."},{"role":"Jurylid 10","text":"Moeten we hiernaar luisteren?"},{"role":"Jurylid 6","text":"Hé, kijk! De man wil praten."},{"role":"Jurylid 9","text":"Dank u. (tegen de 7e jurylid) Deze man... (Hij wijst op de 8e jurylid) staat alleen tegenover ons. Hij zegt niet dat de jongen onschuldig is. Hij is er gewoon niet zeker van. Nou, het is niet makkelijk om alleen te staan tegenover de spot van anderen. Hij gokte op steun en ik gaf hem die. Ik respecteer zijn motieven. De jongen die terechtstaat is waarschijnlijk schuldig. Maar ik wil meer horen. (De 7e jurylid staat op en loopt richting naar het toilet) Voorlopig is de stemming tien tegen twee. (De 7e jurylid gaat de wc in en slaat de deur achter zich dicht) Ik ben aan het woord. Je hebt niet het recht om..."},{"role":"Jurylid 8","text":"(tegen de 9e jurylid) Hij kan je niet horen. Dat zal hij nooit kunnen. Laten we gaan zitten."},{"role":"Jurylid 3","text":"Nou, als de toespraak voorbij is, kunnen we misschien…"},{"role":"Voorzitter","text":"Ik denk dat we even pauze moeten nemen. Er zit nog één man binnen. Laten we op hem wachten. (De voorzitter loopt naar de tafel waar de twee messen in gestoken zijn. Hij pakt het gemerkte mes eruit en klapt het dicht. De voorzitter loopt naar de deur en klopt aan. De bewaker komt binnen. De voorman geeft hem het mes. De bewaker gaat weg)"},{"role":"Jurylid 12","text":"(tegen de 11e jurylid) Het lijkt erop dat we hier echt vastzitten. Ik bedoel, dat voorval met die oude man was nogal onverwacht. Ik wou dat ik wist hoe we hieruit konden komen. (hij glimlacht plotseling) Weet je, in de reclame... Ik heb je toch verteld dat ik bij een reclamebureau heb gewerkt? Nou, er zijn nogal wat vreemde mensen – niet echt vreemd, maar ze hebben gewoon een eigenaardige manier om zich uit te drukken, begrijp je wat ik bedoel? (de 11e jurylid knikt) Nou, dat is waarschijnlijk ook zo in jouw branche, toch? Wat doe je voor werk?"},{"role":"Jurylid 11","text":"Ik ben horlogemaker."},{"role":"Jurylid 12","text":"Echt? De beste horlogemakers komen uit Europa, neem ik aan. (De elfde jurylid buigt lichtjes. De zesde jurylid staat op en gaat naar het toilet.) Hoe dan ook, ik vertelde je net dat wanneer ze in het bureau tijdens een vergadering op een bepaald punt komen, er altijd wel iemand is die met een idee klaarstaat. En het irriteert me mateloos, ik bedoel, het is soms zo raar hoe ze het idee voorafgaan met een of andere zin. Zoals... oh, een accountmanager zegt dan: \"Hier is een idee. Laten we het eens uittesten en kijken of iemand erop reageert\", of \"Zet het op een bus en kijk of het op Wall Street aanslaat.\" Ik bedoel, het is idioot, maar het is grappig. (De 8e jurylid gaat naar het toilet. De 3e jurylid loopt naar het 5de jurylid.)"},{"role":"Jurylid 3","text":"(tegen het 5de jurylid) Luister, ik was een beetje opgewonden. Nou ja, je weet hoe dat gaat – ik wilde niet gemeen zijn of zo. (het 5de jurylid loopt weg van de derde jurylid zonder te antwoorden. De zevende jurylid komt terug uit het toilet en loopt naar de watercooler. De achtste jurylid komt uit het toilet en loopt ook naar de watercooler)"},{"role":"Jurylid 7","text":"(tegen de 8e jurylid) Zeg, bent u verkoper?"},{"role":"Jurylid 8","text":"Nee. Ik ben architect."},{"role":"Jurylid 7","text":"Weet je wat soft selling is? Je bent er behoorlijk goed in. Ik zal je vertellen, ik heb een andere techniek. Grappen. drankjes. Ze omverblazen. Ik heb vorig jaar 27.000 dollar verdiend met de verkoop van marmelade. Dat is niet slecht. Voor marmelade. (hij kijkt even naar de 8e jurylid) Wat levert het je op, kicks? De jongen is schuldig, vriend. Laten we naar huis gaan voordat we keelpijn krijgen."},{"role":"Jurylid 8","text":"Wat maakt het uit of je die hier krijgt of bij de honkbalwedstrijd?"},{"role":"Jurylid 7","text":"Geen verschil, vriend. Helemaal geen verschil. (De 7e jurylid loopt weg. De 6e jurylid komt uit het toilet, ziet 8 bij de watercooler staan en loopt daarheen)"},{"role":"Jurylid 6","text":"(tegen de 8e jurylid) Leuke jury"},{"role":"Jurylid 8","text":"Ik denk dat ze hetzelfde zijn als alle andere jury‘s"},{"role":"Jurylid 6","text":"Die luidruchtige, zwaargebouwde man, die ons over zijn kind vertelde ….de manier waarop hij praatte… jongen, dat was echt gênant."},{"role":"Jurylid 8","text":"Ja."},{"role":"Jurylid 6","text":"Wat een moordende dag. Denk je dat we hier nog lang zullen zitten?"},{"role":"Jurylid 8","text":"Ik weet het niet."},{"role":"Jurylid 6","text":"Hij is zeker schuldig. Daar bestaat geen twijfel over. We hadden al klaar moeten zijn. Luister, het kan me niet schelen, weet je. Het is beter dan werken. (8e jurylid glimlacht) Denk je dat hij onschuldig is?"},{"role":"Jurylid 8","text":"Ik weet het niet. Het is mogelijk."},{"role":"Jurylid 6","text":"Ik ken je niet, maar ik durf te wedden dat je nog nooit zo verkeerd hebt gezeten in je leven. Je kunt beter ophouden. Je verspilt je tijd.."},{"role":"Jurylid 8","text":"Stel dat jij degene was die terechtstond?"},{"role":"Jurylid 6","text":"Ik ben niet gewend om te speculeren, ik ben maar een gewone arbeider. Mijn baas doet het speculeren. Maar ik zal het eens proberen. Stel dat je ons allemaal overtuigt en dat het joch echt zijn vader echt heeft neergestoken? (De zesde jurylid kijkt even naar de achtste jurylid en loopt weg) Akte 3 Emoties lopen op"}]},{"title":"SCENE 7           Agressie","cards":[{"role":"Voorzitter","text":"Oké, laten we gaan zitten."},{"role":"Jurylid 2","text":"Het lijkt erop dat we hier blijven eten."},{"role":"Voorzitter","text":"Oké. Laten we aan de slag gaan. Wie wil beginnen? (Er valt een stilte, waarna de 4e en 6e jurylid tegelijkertijd beginnen te spreken.) 6e + 4e jurylid Nou, ik wil graag iets zeggen..."},{"role":"Jurylid 6","text":"(tegen de 4e jurylid) Pardon. 6e + 4e jurylid Misschien moeten we….."},{"role":"Jurylid 4","text":"(tegen de 6e jurylid) Sorry, ga je gang."},{"role":"Jurylid 6","text":"Ik wilde je niet onderbreken."},{"role":"Jurylid 4","text":"Nee. Ga je gang. Het is goed."},{"role":"Jurylid 6","text":"Nou, ik wilde zeggen, nou ja, dit is waarschijnlijk een klein puntje, maar goed... (tegen de 8e jurylid) De jongen had een motief voor de moord. Je weet wel, het geslagen worden en zo. Dus als hij het niet gedaan heeft, wie had er anders een motief? Dat is mijn punt. Ik bedoel, niemand gaat erop uit om iemand te vermoorden zonder motief, tenzij hij gewoon gek is. Toch?"},{"role":"Jurylid 8","text":"Voor zover ik weet, moeten we beslissen of de jongen die terechtstaat schuldig is, zonder enige twijfel. We houden ons hier niet bezig met de motieven van anderen. Dat is een taak voor de politie."},{"role":"Jurylid 4","text":"Dat is waar. Maar we kunnen niet anders dan het enige motief dat we kennen in onze gedachten laten sluipen, toch? En we kunnen niet anders dan ons afvragen wie er nog meer een motief zou kunnen hebben gehad. Logischerwijs volgen deze dingen uit elkaar. (Hij knikt naar de zesde jurylid.) Deze heer stelt een redelijke vraag. Iemand heeft hem vermoord. Als het niet de jongen was, wie was het dan?"},{"role":"Jurylid 3","text":"CC Sabathia!"},{"role":"Jurylid 7","text":"U heeft het over de man van wie ik houd!"},{"role":"Jurylid 4","text":"Als je niets anders te zeggen hebt dan grappen, raad ik je aan om te luisteren."},{"role":"Jurylid 3","text":"Oké. Ik ben gewoon mijn hart aan het luchten. Sorry. Ga je gang."},{"role":"Jurylid 4","text":"(tegen de 8e jurylid) Nou, misschien kun jij mij het antwoord geven. Wie zou de vader nog meer vermoord kunnen hebben?"},{"role":"Jurylid 8","text":"Nou, ik weet het niet. De vader was niet bepaald een modelburger. De advocaat van de jongen schetste zijn achtergrond in zijn slotpleidooi. Hij heeft een keer in de gevangenis gezeten. Hij stond bekend als een gokverslaafde en een behoorlijk - consequente verliezer. Hij gaf veel geld uit aan tijd doorbracht in buurtcafés en soms, na een paar drankjes, in vechtpartijen terechtkwam. Meestal om een vrouw. Hij was een stoere, wrede, primitieve man die nog nooit langer dan zes maanden achter elkaar een baan had gehad. Hier zijn een paar mogelijkheden. Hij kan zijn vermoord door een van de vele mannen met wie hij in de gevangenis heeft gezeten. Door een bookmaker. Door een man die hij in elkaar had geslagen. Door een vrouw die hij had opgepikt. Door een van de ruige types met wie hij omging."},{"role":"Jurylid 10","text":"Jongen, dat is de grootste onzin die ik ooit heb gehoord... Luister, we weten dat de vader een nietsnut was. Maar wat heeft dat ermee te maken?"},{"role":"Jurylid 8","text":"Ik heb het niet ter sprake gebracht. Mij werd gevraagd wie hem nog meer zou kunnen hebben vermoord. Ik heb mijn antwoord gegeven."},{"role":"Jurylid 9","text":"(wijzend naar de 4e jurylid) Die meneer daar stelde een directe vraag."},{"role":"Jurylid 10","text":"Iedereen is natuurlijk ook advocaat!"},{"role":"Jurylid 3","text":"Kijk, stel dat je dit voor mij beantwoordt. De oude man die beneden woonde hoorde het kind roepen: \"Ik ga je vermoorden.\" Een fractie van een seconde later hoorde hij een lichaam op de grond vallen. Toen zag hij het kind het huis uit rennen. Wat betekent dat allemaal voor jou?"},{"role":"Jurylid 8","text":"Ik vroeg me af hoe duidelijk de oude man de stem van de jongen door het plafond heen kon horen."},{"role":"Jurylid 3","text":"Hij hoorde het niet door het plafond. Zijn raam stond open, net als het raam boven. Het was een warme nacht, weet je nog?"},{"role":"Jurylid 8","text":"De stem kwam uit een ander appartement. Het is niet gemakkelijk om een stem te herkennen, vooral een schreeuwende stem."},{"role":"Voorzitter","text":"Hij heeft het in de rechtbank geïdentificeerd. Hij heeft de stem van de jongen uit vijf andere stemmen herkend, terwijl hij geblinddoekt was."},{"role":"Jurylid 8","text":"Dat was gewoon een ambitieuze officier van justitie die een show opvoerde. Kijk, de oude man kent de stem van de jongen heel goed. Ze wonen al jaren in hetzelfde huis. Maar om die stem duidelijk te herkennen vanuit het appartement beneden... Is het niet mogelijk dat hij zich vergiste, dat hij misschien dacht dat de jongen boven was en automatisch besloot dat de stem die hij hoorde 'de stem van de jongen' was?"},{"role":"Jurylid 4","text":"Ik vind dat een beetje vergezocht."},{"role":"Jurylid 10","text":"Dat kun je wel zeggen. (tegen de 8e jurylid) Kijk. De oude man hoorde het lichaam van de vader vallen en zag vervolgens de jongen vijftien seconden later het huis uit rennen. Hij zag de jongen."},{"role":"Jurylid 12","text":"Oké. En vergeet de vrouw aan de overkant van de straat niet. Zij keek recht door het open raam en zag de jongen zijn vader neersteken. Ik bedoel, is dat niet genoeg voor u?"},{"role":"Jurylid 8","text":"Op dit moment niet. Nee, dat is het niet."},{"role":"Jurylid 7","text":"Wat vind je van hem? Het is alsof je tegen een muur praat."},{"role":"Jurylid 4","text":"De vrouw zag de moord door de ramen van een rijdende trein. De trein had zes wagons en ze zag het door de ramen van de laatste twee wagons. Ze herinnerde zich de belangrijkste details. Ik zie niet in hoe je daar tegenin kunt gaan."},{"role":"Jurylid 3","text":"(tegen 8e jurylid) Nou, wat heb je daarop te zeggen?"},{"role":"Jurylid 8","text":"Ik weet het niet. Ik twijfel daarover."},{"role":"Jurylid 3","text":"Twijfel!. Nou, denk toch eens na. (tegen 12e jurylid) Leen me je potlood. (De"},{"role":"Jurylid 12","text":"geeft het potlood aan de 3e jurylid, die begint met het tekenen van wat duidelijk een boter-kaas-en-eierenpatroon is op het blocnote.)"},{"role":"Jurylid 8","text":"Ik vraag me af of iemand enig idee heeft hoe lang een verhoogde trein erover doet… (Hij ziet de derde en twaalfde jurylid boter-kaas-en-eieren spelen, grijpt het blocnote, scheurt het bovenste blad eraf, verfrommelt het en gooit het in de prullenbak.)"},{"role":"Jurylid 3","text":"Wacht even! Wat doe je!"},{"role":"Jurylid 8","text":"Dit is geen spelletje."},{"role":"Jurylid 3","text":"(schreeuwend) Wie denk je wel dat je bent?"},{"role":"Jurylid 12","text":"(tegen 3e jurylid) Oké, rustig aan."},{"role":"Voorzitter","text":"Kom op, ga zitten."},{"role":"Jurylid 3","text":"Ik zal hem eens een klap voor zijn harsens geven. (Wil op de vuist gaan met 8e jurylid hij wordt door andere tegen gehouden)"},{"role":"Voorzitter","text":"Nu, alsjeblieft! Ik wil hier geen ruzie."},{"role":"Jurylid 3","text":"Heb je hem gezien? Wat een lef! Wat een absoluut lef!"},{"role":"Jurylid 10","text":"Oké. Laat het. Maak je niet zo druk. Ik snap jou wel!"},{"role":"Jurylid 3","text":"(Blaast nog na) Dit is geen spelletje. Met wie denkt hij hier te maken te hebben?"},{"role":"Voorzitter","text":"Kom op, het is voorbij. Laten we gaan zitten."},{"role":"Jurylid 3","text":"Wat is er voorbij? Ik wil een verontschuldiging."},{"role":"Jurylid 6","text":"Oké, schreeuwlelijk. Hou je mond even. Laten we nu eens luisteren naar wat de man te zeggen heeft. Ik wil het wel horen!"},{"role":"Jurylid 8","text":"Bedankt. Ik vraag me af of iemand weet hoelang het duurt voordat een trein op verhoogde rails met gemiddelde snelheid een bepaald punt passeert?"},{"role":"Jurylid 7","text":"Wat heeft dat ermee te maken?"},{"role":"Jurylid 8","text":"Hoe lang? Raad eens."},{"role":"Jurylid 4","text":"Ik heb geen flauw idee."},{"role":"Jurylid 8","text":"(tegen de 5e jurylid) Wat denk jij?"},{"role":"Jurylid 5","text":"Ik weet het niet. Ongeveer tien of twaalf seconden, misschien."},{"role":"Jurylid 3","text":"Waar is dit allemaal voor?"},{"role":"Jurylid 8","text":"Ik zou zeggen dat dat een redelijke gok was. Nog iemand anders?"},{"role":"Jurylid 11","text":"Dat klinkt logisch."},{"role":"Jurylid 10","text":"Kom op, wat is dit voor een raadspelletje?"},{"role":"Jurylid 8","text":"(tegen 2e jurylid) Wat zou jij zeggen?"},{"role":"Jurylid 2","text":"Tien seconden. Ongeveer."},{"role":"Jurylid 4","text":"Oké. Laten we zeggen tien seconden. Waar wil je heen?"},{"role":"Jurylid 8","text":"Dit. Een trein op verhoogde rails met zes wagons doet er tien seconden over om een bepaald punt te passeren. Stel nu dat dat punt het open raam is van de kamer waarin de moord plaatsvond. Je kunt bijna uit het raam van die kamer reiken en de spoorrails aanraken. Klopt dat?"},{"role":"Jurylid 5","text":"Klopt."},{"role":"Jurylid 8","text":"Oké. Nu wil ik je het volgende vragen... Heeft iemand hier ooit vlak naast de spoorlijn gewoond?"},{"role":"Jurylid 6","text":"Nou, ik heb net een appartement geschilderd dat uitkijkt op een spoorlijn. Ik ben huisschilder, weet je. Ik was daar drie dagen bezig."},{"role":"Jurylid 8","text":"Hoe was dat?"},{"role":"Jurylid 6","text":"Wat bedoel je?"},{"role":"Jurylid 8","text":"Luidruchtig?"},{"role":"Jurylid 6","text":"Kerel! Wat maakt het uit. We waren daar met onze eigen dingen bezig."},{"role":"Jurylid 8","text":"Ik woonde ooit in een appartement op de tweede verdieping naast een tramlijn. Als het raam openstaat en de tram voorbijrijdt, is het lawaai bijna ondraaglijk. Je kunt je eigen gedachten niet horen."},{"role":"Jurylid 3","text":"Oké. Je kunt je eigen gedachten niet horen. Kom eens ter zake!"},{"role":"Jurylid 8","text":"Dat zal ik doen. Laten we twee getuigenissen nemen en proberen ze samen te voegen. Ten eerste, de oude man in het appartement beneden. Hij zegt dat hij de jongen hoorde zeggen: \"Ik ga je vermoorden\", en een fractie van een seconde later valt het lichaam op de grond. Een seconde later. Klopt dat?"},{"role":"Jurylid 2","text":"Dat klopt."},{"role":"Jurylid 8","text":"Ten tweede, de vrouw in het appartement aan de overkant van de straat. Ze beweerde dat ze uit haar raam keek en de moord zag door de laatste twee wagons van een voorbijrijdende verhoogde trein. Klopt dat? De laatste twee wagons."},{"role":"Jurylid 3","text":"Oké. Wat wil je hiermee zeggen?"},{"role":"Jurylid 8","text":"We zijn het erover eens dat een trein op verhoogde rails ongeveer tien seconden nodig heeft om een bepaald punt te passeren. Aangezien de vrouw het steekincident door de laatste twee wagons heen zag, kunnen we aannemen dat de vader op de grond viel net toen de trein voorbijreed. Op dat moment kwam de trein net voorbij aan het raam van de oude man. Volgens zijn eigen verklaring hoorde de oude man \"Ik ga je vermoorden\" en viel het lichaam een fractie van een seconde later. Hoe heeft hij dit kunnen horen terwijl de trein langs zijn neus raasde. Het is onmogelijk dat hij dit heeft kunnen horen."},{"role":"Jurylid 3","text":"Dat is belachelijk! Natuurlijk kon hij het horen."},{"role":"Jurylid 8","text":"(tegen de derde jurylid) Denkt u dat echt?"},{"role":"Jurylid 3","text":"De oude man zei dat de jongen het riep. Dat is voor mij genoeg."},{"role":"Jurylid 8","text":"Als hij überhaupt iets heeft gehoord, had hij de stem nog steeds niet kunnen herkennen met het gebrul van de trein."},{"role":"Jurylid 3","text":"Je hebt het hier over een kwestie van seconden. Niemand kan zo nauwkeurig zijn."},{"role":"Jurylid 8","text":"Nou, ik vind dat een getuigenis die iemand in de elektrische stoel kan brengen, zo nauwkeurig moet zijn."},{"role":"Jurylid 5","text":"Ik denk niet dat hij het gehoord kan hebben."},{"role":"Jurylid 6","text":"Misschien heeft hij het niet gehoord. Ik bedoel, met al dat lawaai..."},{"role":"Jurylid 3","text":"Waar hebben jullie het over?"},{"role":"Jurylid 5","text":"Nou, het is toch ook niet mogelijk dat hij dat heeft kunnen horen."},{"role":"Jurylid 3","text":"Je bent gek! Waarom zou hij liegen? Wat heeft hij daaraan?"},{"role":"Jurylid 9","text":"Aandacht misschien."},{"role":"Jurylid 3","text":"Je ook met je wijsheden. Waarom stuur je er niet een naar een krant? Ze betalen je voor die onzin."},{"role":"Jurylid 6","text":"(tegen de derde jurylid) Hé! Waarom praat je zo tegen hem? (De derde jurylid kijkt naar de zesde jurylid en draait zich vervolgens walgend om. De zesde jurylid reikt uit en draait de derde jurylid stevig bij zijn arm om.) Iedereen heeft recht van spreken. Ook hij met zijn wijsheden."},{"role":"Jurylid 3","text":"Blijf met je handen van me af!"},{"role":"Jurylid 6","text":"Je moet wat respect tonen, meneer. Als je nog eens zulke dingen tegen hem zegt, sla ik je neer. (Hij laat de derde jurylid gaan en spreekt tegen de negende jurylid) Ga je gang. Je kunt zeggen wat je wilt. Waarom denk je dat de oude man zou liegen?"}]},{"title":"SCENE 8       Stemming draait: 6–6","cards":[{"role":"Jurylid 9","text":"Ik heb alleen maar heel lang naar hem gekeken. De naad van zijn jasje was onder zijn arm gescheurd. Heb je dat gezien? Ik bedoel, om zo de rechtbank binnen te komen. Hij was een heel oude man met een gescheurd jasje en hij liep heel langzaam naar de getuigenbank. Hij sleepte met zijn linkerbeen en probeerde dat te verbergen omdat hij zich schaamde. Ik denk dat ik hem beter ken dan wie dan ook hier. Dit is een stille, angstige, onbeduidende oude man die zijn hele leven niets heeft betekend, die nooit erkenning heeft gekregen, wiens naam nooit in de krant heeft gestaan. Niemand kent hem, niemand citeert hem, niemand vraagt hem om advies na vijfenzeventig jaar. Dat is heel triest, om niets te zijn. Zo'n man moet erkenning krijgen, er moet naar hem geluisterd worden, hij moet één keer geciteerd worden. Dat is heel belangrijk. Het zou zo moeilijk voor hem zijn om naar de achtergrond te verdwijnen als er een kans is om..."},{"role":"Jurylid 7","text":"Wacht even. Wil je ons vertellen dat hij alleen maar zou liegen om eens belangrijk te kunnen zijn?"},{"role":"Jurylid 9","text":"Nee. Hij zou niet echt liegen. Maar misschien zou hij zichzelf wijsmaken dat hij die woorden had gehoord en het gezicht van de jongen had herkend."},{"role":"Jurylid 10","text":"Nou, dit is de grootste onzin die ik ooit heb gehoord. Hoe kun je zoiets verzinnen? Wat weet je ervan? Wil jij ook even belangrijk zijn. (De 9e jurylid buigt beschaamd zijn hoofd.)"},{"role":"Voorzitter","text":"Heren, ik wil u eraan herinneren dat deze zaak gebaseerd is op een redelijke en logische opeenvolging van feiten. Laten we het daarbij houden."},{"role":"Jurylid 11","text":"Feiten kunnen worden gekleurd door de persoonlijkheid van de mensen die ze presenteren."},{"role":"Jurylid 12","text":"Zeg wat je wilt, ik begrijp nog steeds niet hoe iemand kan denken dat die jongen niet schuldig is."},{"role":"Jurylid 8","text":"Er is nog iets anders waar ik het even over wil hebben. Ik denk dat we hebben bewezen dat de oude man niet kon horen dat de jongen zei: \"Ik ga je vermoorden\", maar stel dat..."},{"role":"Jurylid 10","text":"Dat heb je helemaal niet bewezen. Waar heb je het over?"},{"role":"Jurylid 8","text":"Maar stel dat hij het echt heeft gehoord. Hoe vaak hebben we deze zin allemaal wel niet gebruikt? Waarschijnlijk honderden keren. \"Daarvoor zou ik je kunnen vermoorden, schat.\" \"Als je dat nog één keer doet, Junior, dan vermoord ik je.\" \"Kom op, Rocky, vermoord hem.\" We zeggen het elke dag. Dat betekent niet dat we iemand echt gaan vermoorden."},{"role":"Jurylid 3","text":"Wacht even! Wat probeer je ons hier te vertellen? De zin was: \"Ik ga je vermoorden,\" en het kind schreeuwde het uit volle borst. Zeg me niet dat hij het niet meende. Als iemand zoiets zegt zoals hij het zei, dan meent hij het."},{"role":"Jurylid 2","text":"Nou, ja, ik weet het niet. Ik herinner me dat ik een paar weken geleden ruzie had met de man naast me op het werk bij de bank, dus hij noemde me een idioot; dus ik schreeuwde tegen hem..."},{"role":"Jurylid 3","text":"Luister, die vent laat je dingen geloven die niet waar zijn. De jongen zei dat hij hem zou vermoorden en dat heeft hij ook gedaan."},{"role":"Jurylid 8","text":"Nou, laat me je dit vragen: denk je echt dat de jongen zoiets zou roepen zodat de hele buurt het zou horen? Ik denk het niet. Daar is hij veel te slim voor."},{"role":"Jurylid 10","text":"Slim? Hij is een gewone, onwetende sloddervos. Hij heeft niet eens zijn school afgemaakt. Gewoon te dom om te poepen."},{"role":"Jurylid 5","text":"Ik wil mijn stem wijzigen in \"niet schuldig\"."},{"role":"Jurylid 7","text":"Dat meen je niet."},{"role":"Jurylid 5","text":"Je hebt het gehoord."},{"role":"Voorzitter","text":"Weet je het zeker?"},{"role":"Jurylid 5","text":"Jazeker."},{"role":"Voorzitter","text":"Ok. Dan is de stemming negen tegen drie in het voordeel van \"schuldig\"."},{"role":"Jurylid 7","text":"Nou wordt ie helemaal mooi. Waar baseer je dat op? Verhalen die deze man verzonnen heeft. Hij zou fantasieverhalen moeten gaan schrijven. Hij zou er rijk van worden. (tegen de 5e jurylid) Luister, er zijn feiten die als een paal boven water staan. Ze zeggen allemaal dat deze jongen zijn vader heeft vermoord. Zijn eigen advocaat wist vanaf het begin dat hij geen schijn van kans had. Zijn eigen advocaat. Je kon het zien. Hij verdient de elektrische stoel."},{"role":"Jurylid 8","text":"Is dat zo? Het is eerder voorgekomen dat iemand veroordeeld is voor moord, en geëxecuteerd, en jaren later heeft iemand anders de misdaad bekend. Soms... soms zijn de feiten die iedereen voor ogen heeft, verkeerd."},{"role":"Jurylid 7","text":"(tegen de 8e jurylid) Ik heb het tegen hem... (hij wijst naar de 5e jurylid) niet tegen jou. (tegen de anderen) Beste juryleden, deze man is niet goed wijs. (tegen de 8e jurylid) Luister, die jongen had een advocaat, toch? De advocaat heeft zijn zaak bepleit, niet jij. Waarom heb je dan zoveel te zeggen?"},{"role":"Jurylid 8","text":"De advocaat was door de rechtbank aangesteld."},{"role":"Jurylid 7","text":"Dus?"},{"role":"Jurylid 8","text":"Nou, dat kan van alles betekenen. Het kan betekenen dat hij de zaak niet wilde. Het kan betekenen dat hij het vervelend vond om aangewezen te worden. Het is het soort zaak dat hem niets oplevert. Geen geld. Geen roem. Zelfs niet veel kans om te winnen. Het is geen veelbelovende situatie voor een jonge advocaat. Hij zou echt in zijn cliënt moeten geloven om een goede strijd te kunnen leveren. Zoals u zojuist al aangaf, deed hij dat duidelijk niet."},{"role":"Jurylid 7","text":"Natuurlijk niet. Wie zou dat in vredesnaam kunnen, behalve God die naar de aarde is gekomen of zo? (Hij kijkt op zijn horloge en dan naar de klok.) Kom op zeg! Kijk eens hoe laat het is!"},{"role":"Jurylid 11","text":"Neem me niet kwalijk, maar ik heb hier wat aantekeningen gemaakt."},{"role":"Jurylid 10","text":"Aantekeningen zelfs!"},{"role":"Jurylid 11","text":"Ik wil graag iets zeggen. Ik heb heel aandachtig geluisterd en het lijkt mij dat deze man... (hij wijst naar de 8e jurylid) heeft een aantal zeer goede argumenten. Op basis van wat tijdens het proces naar voren is gekomen, lijkt de jongen schuldig, maar misschien als we dieper graven..."},{"role":"Jurylid 10","text":"Kom op, zeg."},{"role":"Jurylid 11","text":"Ik wil graag een vraag stellen. We gaan ervan uit dat de jongen moord heeft gepleegd. Hij heeft zijn vader in de borst gestoken en is weggerend. Dit was tien minuten na twaalf uur. Hoe werd hij door de politie gepakt? Hij kwam rond drie uur thuis en werd door twee rechercheurs in de hal van zijn huis opgepakt. Mijn vraag is: als hij zijn vader echt had vermoord, waarom zou hij dan drie uur later terugkomen? Zou hij niet bang zijn om gepakt te worden?"},{"role":"Jurylid 3","text":"(lachend) Kijk, hij kwam naar huis om zijn mes te halen. Het is niet netjes om messen in de borst van mensen te laten steken."},{"role":"Jurylid 7","text":"Ja, vooral familieleden."},{"role":"Jurylid 4","text":"Ik vind het helemaal niet grappig. (tegen de 11e jurylid) De jongen wist dat er mensen waren die het mes konden identificeren als het mes dat hij net had gekocht. Hij moest het pakken voordat de politie dat deed."},{"role":"Jurylid 11","text":"Maar als hij wist dat het mes geïdentificeerd kon worden, waarom liet hij het dan überhaupt achter?"},{"role":"Jurylid 4","text":"Nou, ik denk dat we kunnen aannemen dat hij in paniek wegrende nadat hij zijn vader had vermoord, en toen hij eindelijk kalmeerde, besefte hij dat hij het mes daar had achtergelaten."},{"role":"Jurylid 11","text":"Dat hangt af van je definitie van paniek. Hij was kalm genoeg om ervoor te zorgen dat er geen vingerafdrukken op het mes achterbleven. Waar begon zijn paniek en waar eindigde die?"},{"role":"Jurylid 3","text":"Luister, je kunt al die andere dingen vergeten. Hij kwam toch naar huis om zijn mes te pakken en het weg te gooien."},{"role":"Jurylid 2","text":"Drie uur later?"},{"role":"Jurylid 3","text":"Ja, drie uur later."},{"role":"Jurylid 11","text":"Als ik die jongen was en ik had mijn vader vermoord, zou ik niet drie uur later naar huis zijn gekomen. Ik zou bang zijn
