end! We hébben geen poot om op te staan, we hébben al de handtekening gezet!"},{"role":"HANS","text":"Je wilt hét hotel weer terug? Hahaha!"},{"role":"SIMONE","text":"Ik kan toch al mijn werknemers niet op straat zetten en ik ben gehécht aan dit gebouw, hét breekt mijn hart als hét plat gaat."},{"role":"HANS","text":"Hahaha, man, dit is een verlopen en vervallen hotel met een ongeregeld zootje als personeel."},{"role":"GERRIE","text":"Ja, daar héb je wel weer gelijk in. En laten we eerlijk zijn, die vrouw van jou bakt er ook niet veel van."},{"role":"SIMONE","text":"Mijn mensen hébben allemaal hun kwaliteiten! Zelfs mijn vrouw... denk ik..."},{"role":"GERRIE","text":"Nou, die tonen ze dan nooit. En ik kan hét weten, want ik kom hier geregeld voor mijn schadevergoedingen. (Toost met hét glas.) Had ik nog niet wat schadevergoeding tegoed?"},{"role":"HANS","text":"Kom op zeg. Een kok die niet kan koken, een piccolo die te slap is om nog de koffers naar boven te krijgen, een onnozele als tuinman die een boom voor peterselie aanziet en een kamermeisje die alles in hét honderd laat lopen. En jij gelooft dat je met die mensen een hotel perfect kan runnen?"},{"role":"GERRIE","text":"Helemaal eens met die man, ook al is hét een vieze gluiperd, hij héeft hélemaal gelijk."},{"role":"SIMONE","text":"Buurman, hou je er nu even buiten! (Dan tegen Hans.) Ik geloof in mijn mensen."},{"role":"HANS","text":"Man, dat lukt je nog geen dag om hét hier perfect en normaal te laten verlopen, zoals dat in een hotel hoort! Daar durf ik mijn geld wel op te zetten, haha!"},{"role":"SIMONE","text":"Je geld of hét hotel?"},{"role":"HANS","text":"Eh... kijk dat wordt een beetje moeilijk hè. Ik héb natuurlijk wel plannen."},{"role":"SIMONE","text":"Je zei net nog dat je je geld er wel op in wilde zetten."},{"role":"LOLA","text":"Ach, hij is een echte draaikont!"},{"role":"HANS","text":"Ik een draaikont?"},{"role":"LOLA","text":"Ja, dan val je op vrouwen, dan op mannen en dan ineens wel weer op vrouwen, maar bak je er niks van. En dat je al tijden tegen je vrouw zou zeggen dat je bij haar weg zou gaan en met mij verder zou gaan. Maar elke keer stel je hét weer uit! Je bent een vent zonder ruggengraat. Een draaikont!"},{"role":"HANS","text":"Dat ben ik zeker niet!!"},{"role":"LOLA","text":"Tuurlijk wel. Je durft niet eens zo’n weddenschapje aan. Temeer weer een bewijs van wat voor een zielig ventje je bent! En zo’n vent hoef ik niet!"},{"role":"HANS","text":"O, dus ik ben een zielig ventje?"},{"role":"LOLA","text":"Ja! Een héeeeel zielig ventje!"},{"role":"HANS","text":"En ik durf die weddenschap niet aan?"},{"role":"LOLA","text":"Nee! Een laf kereltje ben jij!"},{"role":"HANS","text":"Ach, ik win toch gegarandeerd! Maar dan moet hij ook wat inzetten natuurlijk."},{"role":"GERRIE","text":"Ja Simone, zo hoort dat bij een weddenschap hè. Of ben je nu ineens niet meer zo zeker van je zaak?"},{"role":"HANS","text":"Wat dacht je ervan samen met je vrouw de komende 10 jaar in de nieuwe kerncentrale te werken?"},{"role":"GERRIE","text":"Werken? Dat moet zijn vrouw nog leren."},{"role":"SIMONE","text":"10 jaar? Eh... we zouden eigenlijk met pensioen..."},{"role":"HANS","text":"Helemaal geen raar werk trouwens, en hét héeft ook zo zijn voordelen."},{"role":"SIMONE","text":"Voordelen? Welke dan?"},{"role":"HANS","text":"Nou, als je ’s avonds op bed nog even een boek wilt lezen, hoef je geen leeslampje aan te doen, omdat je zelf al oplicht."},{"role":"SIMONE","text":"Wij gaan dit winnen!"},{"role":"GERRIE","text":"Oeps, ben bang van niet!"},{"role":"HANS","text":"Haha, dus je neemt de weddenschap aan? Goed, dan gaat hij nu in! (Steekt zijn hand uit.) Kijk eens Lola, niks geen zielig ventje!"},{"role":"SIMONE","text":"(Geven elkaar een hand.) Aangenomen!"},{"role":"LOLA","text":"O Hans, wat stoer van je! Ik neem mijn woorden terug! Je bent een echte kerel! Een machoman!"},{"role":"HANS","text":"(Glundert.) Ja poppetje, hier staat een echte alfa-man die niet bang is voor een wedje! Sterker nog, die nergens bang voor is! (Er klinkt wat gerommel van de zijkant van de trap. Hans reageert angstig en wil haastig wegduiken.) Komt mijn vrouw daar aan?"},{"role":"LOLA","text":"(Kijkt ook om.) Nee schat, daar is niks."},{"role":"HANS","text":"(Herstelt zich.) Maar geen trucs met nieuw personeel en weet ik veel wat voor trucs meer hè! Je moet hét gewoon doen met dit team!"},{"role":"SIMONE","text":"Ja, geen probleem! Geen trucs."},{"role":"HANS","text":"(Sarcastisch) Dan wens ik je veel succes, hahaha. Kom Lola, dan gaan wij even naar de stad te shoppen en als we terug komen, komen we terecht in een perfect en normaal hotel! Haha, niet dus."},{"role":"LOLA","text":"Ja, even shoppen. Ik moet nog een mobieltje kopen. Die ik nu héb, daar is de accu van leeg."},{"role":"GERRIE","text":"(Tegen Simone) Bij haar is wel meer leeg. (Tikt tegen haar hoofd.) Maar daar héb ik nooit problemen mee... ’t Is vaak eerder een pluspunt. (Hans en Lola gaan via de voordeur af. Emma komt via hét restaurant op.) Nou, ik wens jou en je vrouw succes met jullie verplichte baan voor de komende 10 jaar in de kerncentrale!"}]},{"title":"DERDE BEDRIJF — Scène 18","cards":[{"role":"EMMA","text":"10 jaar in de kerncentrale? Waar héeft hij hét over, Simone!?"},{"role":"GERRIE","text":"Hij héeft een briljante weddenschap afgesloten! En die gaat ie verliezen en dan moeten jullie beiden 10 jaar werken in de kerncentrale hier!"},{"role":"EMMA","text":"Waarom moeten wij 10 jaar werken in een kerncentrale!!"},{"role":"SIMONE","text":"Tja, ik héb een weddenschap met meneer Groothof afgesloten."},{"role":"EMMA","text":"Een weddenschap?!"},{"role":"SIMONE","text":"Ja, als wij een dag lang dit hotel zo kunnen laten draaien als een normaal hotel draait, verschéurt hij hét koopcontract. En als hét... niet... lukt..."},{"role":"GERRIE","text":"Dan ben je veroordeeld tot 10 jaar slavenarbeid in een kerncentrale!!"},{"role":"SIMONE","text":"Maar hét had ook voordelen, zei meneer Groothof. Als je dan op bed ligt... ach laat maar..."},{"role":"EMMA","text":"Ben je hélemaal gek geworden Simone!!"},{"role":"GERRIE","text":"Nee, dat was ie al."},{"role":"SIMONE","text":"Buurman, moet je niet eens naar huis?"},{"role":"GERRIE","text":"Nee, hoe kom je daar bij?"},{"role":"SIMONE","text":"Volgens mij wel! (Simone pakt Gerrie in de arm en sleept haar mee naar de voordeur.)"},{"role":"GERRIE","text":"Ik héb mijn schadevergoeding nog niet op! (Simone duwt Gerrie de voordeur uit en gaat er zelf ook achteraan. Ondertussen is meneer Chateau van de trap afgekomen.)"},{"role":"MENEER CHATEAU","text":"Hallo, zeg wat hoorde ik nu? Het kamermeisje vertelde dat hét hotel gaat sluiten?"},{"role":"EMMA","text":"Ja, sterker nog, hét héle hotel gaat plat en al hét personeel komt op straat te staan!"},{"role":"MENEER CHATEAU","text":"Oh, en is daar hélemaal niets meer aan te doen?"},{"role":"EMMA","text":"Denk hét niet. Of we zouden wonder boven wonder die belachélijke weddenschap van mijn man moeten winnen."},{"role":"MENEER CHATEAU","text":"Weddenschap? Hoe bedoelt u?"},{"role":"EMMA","text":"Die weddenschap is waarschijnlijk nog de enige kans om onze domme fout weer goed te maken. We zouden de weddenschap kunnen winnen als we de rest van de dag laten zien dat we toch een goed hotel zijn. Mijn man ook altijd met zijn belachélijke ideeën!"},{"role":"MENEER CHATEAU","text":"Zo, nou, dat is bij voorbaat al verloren. Wat ik, ondanks dat ik dit een vreselijk hotel vind, wel erg jammer vind. Het doet mij, als hotelliefhébber, altijd pijn aan hét hart als een hotel verdwijnt. Ja, en dat ik dan voor niets mijn stukje aan hét schrijven ben natuurlijk."},{"role":"EMMA","text":"Kunt u ons dan niet hélpen? U met al uw hotelervaring? En dan is hét stukje schrijven ook niet voor niets geweest!"},{"role":"MENEER CHATEAU","text":"Het is een idee. Ik zal eens mijn gedachten erover laten gaan."},{"role":"EMMA","text":"Ik vermoed dat u wel de nodige horeca-ervaring héeft."},{"role":"MENEER CHATEAU","text":"Ach, ik héb meerdere hotels tot grote hoogte gestuwd."},{"role":"EMMA","text":"Precies, en dan is hét toch een peulenschilletje om van dit hotel weer iets te maken? Zo’n man als u..."},{"role":"MENEER CHATEAU","text":"Nou... (Begint te glimmen van trots.) Misschien kan ik u inderdaad hélpen... (Denkt na.) Altijd alleen maar stukjes schrijven wordt ook maar saai."},{"role":"EMMA","text":"Precies! En dan is dit natuurlijk de uitdaging bij uitstek!"},{"role":"MENEER CHATEAU","text":"Hmm, misschien moeten we hét maar proberen. Maar ik denk dat ik dan eerst maar eens een gesprek met uw personeel moet aangaan."},{"role":"EMMA","text":"Als u hét wilt kan ik ze meteen bij elkaar roepen."},{"role":"MENEER CHATEAU","text":"Dat lijkt mij een uitstekend idee. (Emma loopt achter de balie en pakt de luchthoorn en geeft een stoot.)"},{"role":"EMMA","text":"VERGADERING!!!"},{"role":"MENEER CHATEAU","text":"Hmm, dit is misschien direct al een eerste puntje wat voor verbetering vatbaar is."},{"role":"EMMA","text":"Zou hét?"}]},{"title":"DERDE BEDRIJF — Scène 19","cards":[{"role":"FRITS","text":"((Simone, Piet, Grietje, Frits en Kitty komen van alle kanten op.)) De kerstpakketten?"},{"role":"EMMA","text":"Nee, ik héb voor een andere reden iedereen bij elkaar geroepen. Misschien hébben jullie hét al van Simone gehoord, maar we hébben dus nog één kans om hét hotel te behouden."},{"role":"SIMONE","text":"Ja, nog één kans."},{"role":"EMMA","text":"Precies. We mogen hét hotel houden als we de rest van de dag dit hotel perfect draaiende weten te houden. Dus door de rest van de dag geen enkele fout te maken!"},{"role":"SIMONE","text":"Ja, hét hotel is de inzet van een weddenschap met meneer Groothof. (Iedereen mompelt dat ze dat wel kunnen, vergeten e.d.)"},{"role":"EMMA","text":"En als hét ons niet lukt, staat niet alleen iedereen op straat, maar moet Simone ook nog eens 20 jaar in de kerncentrale werken!"},{"role":"EMMA","text":"Ja, jij doet die 10 jaar van mij er ook maar mooi bij, met je belachélijke weddenschappen!"},{"role":"FRITS","text":"Heb je mooi wel 20 jaar lang nog een kerstpakket."},{"role":"EMMA","text":"Maar misschien hébben we nog een kansje. Ik héb meneer Chateau gevraagd om ons te hélpen. Met zijn staat van dienst weet hij precies hoe je succesvol een hotel moet runnen."},{"role":"MENEER CHATEAU","text":"Tja... ja... Ik wil daarvoor mijn best wel doen, maar weet niet of hét allemaal in één keer lukt. Maar ik héb misschien een paar goeie ideeën, die ook nog wel eens zouden kunnen werken. Laten we met z’n allen in hét restaurant gaan zitten en kijken hoe we hét gaan regelen. (Iedereen gaat hét restaurant in. Tegelijk komen Laura en Nel de trap af. Nel loopt naar de balie en drukt op hét belletje. De deur van hét restaurant gaat open en Emma steekt haar hoofd om de hoek.)"},{"role":"EMMA","text":"Nu even niet!! (En gooit de deur weer dicht.)"},{"role":"NEL","text":"Nou zeg."},{"role":"LAURA","text":"Ik begin dit een steeds raarder hotel te vinden."},{"role":"NEL","text":"Och, ik vind hét wel leuk. Alleen dat we een badkamer hébben met bruin water uit de kraan is wat minder, maar hét gehéel héeft wel zijn charmes. Heeft mij ook altijd al leuk geleken, zo’n hotel."},{"role":"LAURA","text":"Dan moet je maar snel die meneer Chateau aan de haak slaan, die héeft er tenminste verstand van."},{"role":"NEL","text":"En hét lijkt hém ook leuk om weer een hotelletje te gaan runnen."},{"role":"LAURA","text":"Tja, maar hét schijnt al verkocht te zijn."},{"role":"NEL","text":"Nu we hét toch over kopen hébben, kom we gaan naar de stad te shoppen! (Gerrie is ondertussen binnengekomen.)"},{"role":"GERRIE","text":"Shoppen? Jullie ook al?"},{"role":"NEL","text":"Hoe bedoelt u?"},{"role":"GERRIE","text":"Dat andere stel dat hier in hét hotel overnacht, die willen ook net weg te shoppen in de stad. Maar hét schiet nog niet...\nZe staan wat klef te doen daar bij de auto. Die kerel héeft trouwens dit hotel gekocht."},{"role":"LAURA","text":"Misschien kunnen we wel even meerijden!"},{"role":"NEL","text":"Met zo’n klef stel?"},{"role":"LAURA","text":"Ja joh, zal tijdens hét rijden wel meevallen toch? (De deur van hét restaurant gaat open en Piet komt in een hémd voorbij lopen. Niet hérkenbaar, met de koksjas en muts van Kitty onder de arm. Hij verdwijnt in de keuken. Nel en Laura kijken verschrikt toe.) Is toch een raar hotel!"},{"role":"GERRIE","text":"Nou, beter een raar hotel, dan een kerncentrale."},{"role":"LAURA","text":"kerncentrale?"},{"role":"GERRIE","text":"Ja, maar ik ga er weer eens vandoor, ik zie Simone niet, dus kan ik ook geen schadevergoeding eisen voor wat dan ook. (Gerrie loopt via de voordeur af.)"},{"role":"NEL","text":"Hoe komt die man er nu bij dat dit beter is dan een kerncentrale?"},{"role":"LAURA","text":"Ja... (Dan gaat de deur van hét restaurant open en komt Kitty in hémd hét podium op. Onder haar arm, onhérkenbaar, de piccolokleding.)"},{"role":"KITTY","text":"Dag dames. (De dames kijken stomverbaasd en Kitty verdwijnt via de trap.)"},{"role":"NEL","text":"Inderdaad, een raar hotel."},{"role":"LAURA","text":"Nou ja, entertainment genoeg, zullen we maar zeggen. Kom Nel, we gaan eens achter dat kleffe stel aan! (Nel en Laura gaan via de voordeur af. Grietje en Emma komen uit hét restaurant.)"},{"role":"GRIETJE","text":"Hup hup, naar boven!"},{"role":"EMMA","text":"Nou, ja zeg!"},{"role":"GRIETJE","text":"Ja, toe maar even. Zo’n tempo is dat lichaam niet meer gewend hè! (Grietje en Emma verdwijnen via de trap. Meneer Chateau en Simone komen uit hét restaurant.)"},{"role":"MENEER CHATEAU","text":"Ik zal eens in de keuken zien om te kijken wat daar nog te redden valt."},{"role":"SIMONE","text":"Ik wil u alvast hartelijk bedanken voor uw hulp."}]},{"title":"DERDE BEDRIJF — Scène 20","cards":[{"role":"MENEER CHATEAU","text":"Juich maar niet te vroeg! (Meneer Chateau verdwijnt in de keuken en Simone gaat achter de balie staan. Hans en Lola komen via de voordeur binnen en hébben een koffer mee genomen. Ze zitten onder de blaadjes en takjes. Ze lopen naar de balie.)"},{"role":"LOLA","text":"Maar Hans, we zouden gaan shoppen."},{"role":"HANS","text":"Ja, maar je hoorde toch wat die buurvrouw zei! Dat die twee dames met ons meewilden rijden naar de stad! Dat is wel mijn vrouw en haar vriendin hoor!"},{"role":"LOLA","text":"We zouden shoppen! En nu bedenkt je je weer! Wat is dat met jou! En dan moesten we ons nog in de bosjes verstoppen!"},{"role":"HANS","text":"Ja, we waren gelukkig net op tijd! Maar gelukkig namen ze hun eigen auto! We kunnen er nu beter even voor zorgen dat ik de weddenschap win. Immers mijn vrouw en haar vriendin zijn nu weg, dus we hébben nu even hét rijk alleen!"},{"role":"LOLA","text":"Nou zeg, je hébt wel wat goed te maken straks!"},{"role":"HANS","text":"Dat komt wel goed. Nu gaan we lachén, die weddenschap héeft hij direct verloren! (Tegen Simone) Zou uw Piccolo deze koffer naar boven kunnen brengen? (Tegen Lola) Die afschuwelijke luchthoorn, haha! (Simone drukt op hét belletje en vervolgens komt Kitty in een piccolopak op. Hans en Lola kijken verbaasd.)"},{"role":"KITTY","text":"(Tegen Simone) U had geroepen meneer?"},{"role":"SIMONE","text":"Inderdaad, zou u de koffer van deze gasten even naar boven kunnen brengen?"},{"role":"KITTY","text":"Natuurlijk, met genoegen meneer. (Kitty pakt de koffer aan.)"},{"role":"HANS","text":"Ben jij nu ineens de Piccolo?"},{"role":"KITTY","text":"Dat is correct meneer. Wij hébben zojuist een functioneringsgesprek gehad, gevolgd door een reorganisatie. (Kitty loopt behéndig de trap op met de koffer.)"},{"role":"LOLA","text":"Functioneringsgesprek en reorganisatie?"},{"role":"SIMONE","text":"Inderdaad. Kitty gaf aan dat hij het werk in de keuken saai en eenzaam vond. Hij wilde veel liever met mensen werken, vandaar dat hij nu Piccolo is."},{"role":"HANS","text":"Hmm, (dan tegen Lola) dan pakken we ze wel op het restaurant. Ze hebben immers nu geen kok! Haha. (tegen Simone) Wij zouden graag straks willen dineren in het restaurant, weer zo’n overheerlijke lopend kipbuffet!"},{"role":"SIMONE","text":"Helaas serveren wij vanavond geen lopend kipbuffet."},{"role":"HANS","text":"Ha! Nu heb ik je."},{"role":"SIMONE","text":"Ik zal de kok voor u halen, dan kan hij u vertellen waar u uit kunt kiezen vanavond. (Simone loopt naar de keukendeur en doet die open) Meneer de Chef, zou u even willen komen? (Vervolgens komt Piet via de keukendeur het podium op) Zou u meneer en juffrouw op de hoogte willen stellen van het menu?"},{"role":"PIET","text":"Natuurlijk. Vanavond hebben wij als voorgerecht keuze uit Gebonden Champignonsoep of Tomatencremesoep met verse room. Als hoofdgerecht kunt u kiezen uit Varkenshaas met peppersaus of gegrilde vis met pestoboter. Als nagerecht hebben wij dan weer als keuze roomijs met flensjes en rum of een heerlijk desserttaartje met vruchten."},{"role":"LOLA","text":"O, dat klinkt niet verkeerd Hans!"},{"role":"HANS","text":"Dat klinkt heel verkeerd Lola!"},{"role":"PIET","text":"Hopelijk mag ik u straks verwelkomen in het restaurant. (Piet draait zich om en gaat de keuken weer in)"},{"role":"HANS","text":"Hoe kan hij dan nu ineens de kok zijn?"},{"role":"SIMONE","text":"Hij kon het werk van Piccolo, met al die koffers de trap op, niet meer aan, maar toen bleek ineens dat hij thuis altijd het heerlijk vindt om voor familie en vrienden te koken. En een mooie bijkomstigheid, deze broek past hem ook beter!"},{"role":"HANS","text":"Ha, maar wat voor functie heeft die tuinman dan nu! (tegen Lola) Wat die ook doet, die blundert toch alles bij elkaar! Die weddenschap winnen is een makkie!"},{"role":"SIMONE","text":"Frits is nog gewoon tuinman."},{"role":"HANS","text":"Ha, dan zal ik die eens opzoeken, hè hè!"},{"role":"SIMONE","text":"Dat zal helaas even niet gaan, die is niet aanwezig."},{"role":"HANS","text":"Ja, hallo, zo werkt dat niet. Je kunt niet zomaar je personeel vrij geven om te voorkomen dat ze hier alles in de war sturen!"},{"role":"SIMONE","text":"O, maar die is ook niet vrij. Die is inkopen aan het doen."},{"role":"LOLA","text":"Inkopen?"},{"role":"SIMONE","text":"Ja, voor de Kerstpakketten."},{"role":"HANS","text":"Nou, dan blijft er waarschijnlijk nog één probleem over en dat is dat kamermeisje wat half overspannen hier rond loopt! Haha, we zullen eens even zien hoe die er in om blundert!"},{"role":"SIMONE","text":"O, maar wij hebben het probleem van haar opgelost. Zij heeft een extra hulp onder zich gekregen."},{"role":"HANS","text":"Ha, dat mag natuurlijk niet! Extra personeel erbij halen is niet eerlijk?"},{"role":"SIMONE","text":"Extra personeel?... (Op dat moment komen Grietje en Emma van de trap; beiden in dezelfde kamermeisjespakjes, met Grietje voorop.)"},{"role":"GRIETJE","text":"(Tegen Emma) En dan gaan we nu het restaurant op orde maken en daarna kun je de wasmachine uitladen en de nieuwe was er in stoppen. (Emma zucht zwaar, maar loopt gewillig achter Grietje aan en beiden verdwijnen in het restaurant.)"},{"role":"HANS","text":"Kom Lola, we gaan naar onze kamer. (Tegen Simone) Maar wij vinden wel wat hoor! Zo gemakkelijk geef ik mij niet gewonnen! (Hans en Lola gaan de trap op naar boven.)\n(Meneer Chateau komt via de deur van de keuken het toneel op en gaat aan de bar zitten.)"}]},{"title":"DERDE BEDRIJF — Scène 21","cards":[{"role":"MENEER CHATEAU","text":"En hoe gaat het tot nu toe?"},{"role":"SIMONE","text":"Op rolletjes!"},{"role":"MENEER CHATEAU","text":"Zo’n gesprek levert altijd wat op. En met een paar kleine veranderingen, kan het hotel hopelijk gered worden! (Frits komt met een navigatiesysteem via de voordeur binnen.)"},{"role":"SIMONE","text":"(Lichtelijk paniek) Wat moet jij hier!"},{"role":"FRITS","text":"Die Tomtom van jou deugt niet. Zo vind ik nooit de weg."},{"role":"SIMONE","text":"Wat is er dan mee?"},{"role":"FRITS","text":"Nou kijk, dan zegt die vrouw: Links afslaan! En dan wijst de pijl naar rechts! (Simone, meneer Chateau en Piet staan aandachtig het navigatiesysteem te bekijken. Simone pakt het navigatiesysteem uit Frits zijn handen en draait hem om.)"},{"role":"SIMONE","text":"Zo, en nu snel weg. Je hebt een belangrijke opdracht!"},{"role":"FRITS","text":"Ja! Kerstpakketten! (Frits gaat via de voordeur weer af.)"},{"role":"MENEER CHATEAU","text":"Dat viel gelukkig mee."},{"role":"SIMONE","text":"Inderdaad, Frits had het anders vast in het honderd laten lopen. (Een geluid van een startende auto met veel te veel gas klinkt.)"},{"role":"MENEER CHATEAU","text":"Nou, die heeft er zin in! Heeft hij wel een rijbewijs?"},{"role":"SIMONE","text":"Hmm, dat is een goeie vraag."},{"role":"MENEER CHATEAU","text":"Eh... (kijkt uit het raam) sturen kan hij in ieder geval niet..."},{"role":"SIMONE","text":"(kijkt nu ook) O nee, de begonia’s van de buurman! (Een geluid van piepende remmen van een auto klinkt, gevolgd door een harde knal.)"},{"role":"MENEER CHATEAU","text":"O jee, hij heeft zijn auto in de prak gereden!"},{"role":"SIMONE","text":"O nee, was het maar zo. Hij rijdt altijd brommer. Ik had hem mijn eigen auto meegegeven! (Piet komt gehaast uit de keuken gerend.)"},{"role":"PIET","text":"Er staat een auto midden in de keuken!"},{"role":"SIMONE","text":"Midden in de keuken!"},{"role":"PIET","text":"Dwars door het keukenblok! Hoe moet ik nu koken?"},{"role":"MENEER CHATEAU","text":"Dan moet ik vanavond maar weer naar Joco’s Kinderpannenkoekenpaleis. (Frits komt met zwarte vegen op zijn gezicht en verfrommelde kleding op via de keukendeur. Met in beide handen houdt hij een stuur vast.)"},{"role":"FRITS","text":"Ben ik hier bij de winkel voor Kerstpakketten? (Buurvrouw Gerrie komt woest via de voordeur binnen.)"},{"role":"GERRIE","text":"Dit wordt een gigantische claim! Die gek heeft mijn hele tuin omgeploegd met die auto!"},{"role":"MENEER CHATEAU","text":"(Wijst naar de trap) Volgens mij komt die Groothof daar de trap af! Volgens mij komt die..."},{"role":"SIMONE","text":"Hier is de schadevergoeding! (Reikt buurvrouw Gerrie een fles aan.)"},{"role":"GERRIE","text":"Nou mannetje, daar kom je niet zo gemakkelijk vanaf! (Simone stopt buurvrouw Gerrie nog een fles toe.) Hm, zo wel."},{"role":"SIMONE","text":"(tegen Piet) Hij (Frits) moet hier ook weg. (Simone duwt Gerrie de voordeur uit en Piet neemt Frits mee. Ondertussen komen eerst Lola en dan Hans via de trap op.)"},{"role":"LOLA","text":"Ja schat, ik hoorde echt een harde knal."},{"role":"HANS","text":"We zullen wel eens zien wat er allemaal mis is, haha!"},{"role":"SIMONE","text":"Hier is niets aan de hand hoor."},{"role":"HANS","text":"Hmm, dat zal wel. (Kijkt aandachtig rond.)"},{"role":"LOLA","text":"Wij wilden eigenlijk wel graag reserveren voor vanavond in het restaurant. Dat menu lijkt me wel wat."},{"role":"SIMONE","text":"Tja, het menu..."},{"role":"MENEER CHATEAU","text":"Ik hoorde net van de kok dat hij er aan zit te denken om het menu iets aan te passen. Houdt u van pannenkoeken?"},{"role":"HANS","text":"Pannenkoeken!"},{"role":"LOLA","text":"O ja! Pannenkoeken! Daar ben ik gek op!"},{"role":"HANS","text":"Dan maar pannenkoeken. Zullen wij weer even naar onze kamer Lola?"},{"role":"LOLA","text":"O ja, je was net bezig om me wat te overtuigen hè."},{"role":"HANS","text":"Jaja... (Hans en Lola gaan de trap weer op.)"},{"role":"MENEER CHATEAU","text":"Het probleem met de keuken is weer opgelost. Je belt straks hun bestelling door naar Joco’s Kinderpannenkoekenpaleis en haalt het daar weg, en zet het je gasten weer voor!"},{"role":"SIMONE","text":"Ik heb geen auto meer... maar daar vinden we wel wat op. ’t Is alleen jammer dat zijn vrouw er niet is."},{"role":"MENEER CHATEAU","text":"Hoezo?"},{"role":"SIMONE","text":"Hoe meer die hier rond loopt, des te meer kans dat hij naar zijn kamer of in die kast zit en dan gebeuren er weer van die dingen die misgaan."},{"role":"MENEER CHATEAU","text":"Tja, maar..."},{"role":"SIMONE","text":"Hmm, wacht eens even... (Simone loopt het podium af.)"},{"role":"MENEER CHATEAU","text":"Wat is die nu weer van plan?"},{"role":"MENEER CHATEAU","text":"Als ik over dit hotel een recensie moet schrijven, heb ik wat papier nodig. En toch zou je hem eens moeten zien: dit hotel. De ligging is perfect, mooi bos om je heen en rust. En het is ook een prachtig hotel. Er moet nog wel wat gebeuren, maar de basis is goed. (Meneer Chateau staat en loopt over het toneel.) Mooie nieuwe gordijnen draperen. Een mooie nieuwe bar. En natuurlijk de bedden boven er allemaal uit. Lekkere boxsprings. (Simone komt de trap weer op met een jurk en een pruik in de hand. Hij wordt gevolgd door Kitty.)"},{"role":"KITTY","text":"Dan kan toch niet zomaar?"},{"role":"SIMONE","text":"Nood breekt wetten! (Simone loopt naar de keuken en gaat daar naar binnen.)"},{"role":"MENEER CHATEAU","text":"Wat is hij van plan?"},{"role":"KITTY","text":"Geen idee."},{"role":"MENEER CHATEAU","text":"En hoe bevalt de nieuwe functie?"},{"role":"KITTY","text":"Ja, stuk beter! Ik krijg nu tenminste ook fooien."},{"role":"MENEER CHATEAU","text":"En hoe was je dan ooit kok geworden?"},{"role":"KITTY","text":"Gewoon solliciteren."},{"role":"MENEER CHATEAU","text":"Nee, ik bedoel, waarom je daar vroeger voor gekozen hebt."},{"role":"KITTY","text":"Mijn pa was kok, mijn opa was kok. Zo gaat dat dan."},{"role":"MENEER CHATEAU","text":"O, dus al generaties van je familie koken in restaurants."},{"role":"KITTY","text":"Nee, mijn pa en mijn opa waren kok in de gevangenis en zij hebben mij het vak geleerd!"},{"role":"MENEER CHATEAU","text":"O, dat verklaart een hoop."},{"role":"KITTY","text":"Beiden hadden ook als specialiteit kip! De directie van de gevangenis beweerde zelfs dat, dankzij de kookkunsten van zowel mijn pa als mijn opa, heel veel gevangenen het goede pad opgingen en nooit weer terugkeerden in de gevangenis. (Simone komt via de keukendeur het podium op en schuift Frits voor zich uit. Frits heeft een jurk aan en een pruik op en het stuur nog in de handen.)"}]},{"title":"DERDE BEDRIJF — Scène 22","cards":[{"role":"SIMONE","text":"Kijk, hier hebben we Laura!"},{"role":"MENEER CHATEAU","text":"Laura?"},{"role":"SIMONE","text":"Ja, Frits gaat hier zitten (drukt hem op een stoel in het zithoekje) en zolang jij hier zit hebben we geen last van die Groothof."},{"role":"KITTY","text":"Hij ziet er helemaal niet uit als Laura!"},{"role":"SIMONE","text":"’t Is anders wel een jurk van haar en die pruik die ik nog had heeft bijna dezelfde kleur. Ach, als hij ook maar een glimp ziet, dan rent hij al weg! Misschien moet dat stuur wel even weg. (Simone pakt het stuur van Frits af en gooit die ergens heen.)"},{"role":"MENEER CHATEAU","text":"Misschien nog niet eens zo’n slecht idee."},{"role":"SIMONE","text":"Ja, zelfs een super idee! (Op dat moment komen Laura en Nel via de voordeur op. Simone ziet het echter nog net op tijd en trekt Frits uit de stoel en gooit hem in de kast.)"},{"role":"NEL","text":"Wat jij Laura, zullen we een lekker bakkie koffie nemen?"},{"role":"LAURA","text":"Goed idee!"},{"role":"SIMONE","text":"Ik heb nog nooit zoveel koffie uit die keuken gehaald dan vandaag!"},{"role":"KITTY","text":"Kan ik uw tassen naar de kamer brengen?"},{"role":"NEL","text":"Ja, en graag niet laten vallen."},{"role":"LAURA","text":"Hé, maar dit is een andere."},{"role":"KITTY","text":"Ik zal er de nodige zorg voor dragen mevrouw. (Kitty pakt de tassen aan en gaat de trap op. Simone is de keuken weer in gegaan.)"},{"role":"MENEER CHATEAU","text":"Fijn aan het shoppen dames?"},{"role":"NEL","text":"Nou nee, we moesten van Laura steeds rondjes rijden om dit hotel."},{"role":"LAURA","text":"Ja, we waren even op zoek naar een klef stel! Hun auto stond er nog, terwijl ze naar de stad zouden..."},{"role":"NEL","text":"Maar toen hebben we nog even gewinkeld hier in het dorp. (Grietje en Emma komen gehaast uit het restaurant.)"},{"role":"GRIETJE","text":"Dan gaan we nu de was draaien. Die moeten we nog even van boven halen."},{"role":"EMMA","text":"Jaja pfffft, ik kan niet zo snel hoor. Ik ben bekaf!"},{"role":"GRIETJE","text":"Bekaf? We zijn nog maar net begonnen. Pak je trouwens nog even een dweil?"},{"role":"EMMA","text":"Waar is die dan, waar is die dan?"},{"role":"GRIETJE","text":"In de kast, daar. (Wijst.) Je weet toch wel waar je eigen spullen zijn?"},{"role":"EMMA","text":"Jaja, tuurlijk. (Emma doet de kastdeur open en een arm van Frits steekt er uit en geeft aan Emma een dweil. Ze neemt hem zonder blikken of blozen aan en doet de deur weer dicht. Echter als ze dan eens naar de dweil kijkt, beseft ze wat er is gebeurd en maakt een sprong van schrik en kijkt verwilderd naar de deur.) Daar zat iemand in de kast!"},{"role":"GRIETJE","text":"Jaja, schijnt tegenwoordig heel normaal te zijn dat er een man in die kast zit."},{"role":"EMMA","text":"Een man? Dit leek meer op een vrouw. Met de nadruk op leek!"},{"role":"GRIETJE","text":"Kom, we gaan naar boven. (Simone komt op met twee kopjes koffie en zet die voor de dames neer op de bar. Gerrie komt als een dronkenman via de voordeur binnen.)"},{"role":"GERRIE","text":"Da wa een goeie schaaaaadevergoedingggg!"},{"role":"SIMONE","text":"O nee, hij niet weer! Kan er dan niet één dag hier normaal aan toegaan?"},{"role":"GERRIE","text":"Zal ik de daaammmesssss eens gezellie gezelschap houen?"},{"role":"LAURA","text":"Nou, liever niet."},{"role":"GERRIE","text":"Achhhh toe, gun een eenzame man ook eens plezier."},{"role":"MENEER CHATEAU","text":"Volgens mij heeft hij twee flessen schadevergoeding in één keer opgemaakt."},{"role":"NEL","text":"Zeg Laura, buiten in de tuin is ook een gezellig terrasje."},{"role":"LAURA","text":"Dan gaan we daar ons kopje koffie drinken!"},{"role":"GERRIE","text":"Wa flauw zegggg. (De beide dames stappen op.)"},{"role":"MENEER CHATEAU","text":"Een beetje frisse lucht zou mij ook wel goed doen! (Meneer Chateau gaat met de dames door de voordeur af.)"}]},{"title":"DERDE BEDRIJF — Scène 23","cards":[{"role":"SIMONE","text":"(Loopt naar Gerrie toe) Gerrie, je kunt hier niet zo dronken rondhangen! Als die Groothof je zo ziet, laat je mijn hele weddenschap in het honderd lopen!"},{"role":"GERRIE","text":"Wieee? Ikkkkk? Da zou ik toch nooooit doen. Je weeet toch da je mijn beste vriend ben."},{"role":"SIMONE","text":"Beste vriend? Daar heb ik nog nooit wat van gemerkt."},{"role":"GERRIE","text":"Je sta altijjjid voor me klaar en nu ga je wegggggg! En je laat mij hier achterrrrrrrr. Terwijl ik zooooveeeeeel van je hou! (Gerrie slaat Simone in de armen, die totaal dit niet verwacht. Met moeite weet zij zich los te rukken.)"},{"role":"SIMONE","text":"Als die Groothof de buurvrouw zo ziet, is de zaak verloren. Frits moet de situatie redden! (Simone loopt snel naar de kast en haalt Frits eruit en zet hem op een barkruk. Dit gaat wat onhandig, omdat Frits er net zo op wil stappen als op een herenfiets, maar de jurk nu in de weg zit.) Jij moet hier gaan zitten en er voor zorgen dat, zodra Groothof naar beneden komt, hij je ziet en hij zo snel mogelijk weer weg gaat! Dan werk ik de buurman er uit."},{"role":"GERRIE","text":"Oei, een lekkerrrr dinggg!"},{"role":"FRITS","text":"(Tilt zijn pruik op) Dag buurvrouw! (Doet pruik weer op.)"},{"role":"GERRIE","text":"Aaaghh! ’t Is die tuinmannnn! (Ondertussen komen Lola en Hans van de trap.)"},{"role":"LOLA","text":"Hans! Je vrouw zit aan de bar!"},{"role":"HANS","text":"Snel naar boven!"},{"role":"GERRIE","text":"Ho ho, wachtesse offe. Dit is Fritssie de tuinmannn hoor!"},{"role":"SIMONE","text":"O nee Gerrie!"},{"role":"GERRIE","text":"Simonnn, ook al issss de waaarheid nogggg zo snel, de leugennn achterrrhaalt hem welll."},{"role":"HANS","text":"Dus dit is mijn vrouw niet!"},{"role":"GERRIE","text":"Neeeh, dit is dieee idiooot van eeen tuinmannn die zojuist met eeen auto de keuken verwoesttt heeft. Zag ie dat nie? (Hans loopt naar de keuken en doet de deur open en kijkt naar binnen.)"},{"role":"HANS","text":"Keuken verwoest?"},{"role":"GERRIE","text":"Ja, en me tuinnnnn."},{"role":"HANS","text":"Haha, de weddenschap heb ik gewonnen! Kom Lola, wij gaan! We zijn nu wel lang genoeg geweest in deze rotzooi en de weddenschap heb ik nu wel duidelijk gewonnen! Een verwoeste keuken, een bezopen man aan de bar en een tuinman die in een jurkje hier maar wat zit!"},{"role":"LOLA","text":"Staat hem anders wel goed."},{"role":"FRITS","text":"O, dank je!"},{"role":"HANS","text":"Het was leuk hier, maar niet heus. Lola en ik gaan er vandoor, de koffers mogen jullie wel na laten zenden. O ja, volgens het contract moeten jullie allemaal over twee weken hier weg zijn, want dan komen de slopers! (Hans en Lola lopen naar de voordeur, die zwaait open. Laura en Nel komen met de koffiekopjes binnen en kijken verbaasd naar Hans en Lola. Hans krimpt ineen.)"},{"role":"LAURA","text":"Hans! Ik dacht wel dat jij het was! Wat doe jij hier?! En dan wel met haar!"},{"role":"HANS","text":"Eh... zakenreisje."},{"role":"LAURA","text":"Ammehoela, een zakenreisje. Moet die snol er bij?"},{"role":"LOLA","text":"Snol? Ik zorg anders heel wat beter voor hem dan jij!"},{"role":"HANS","text":"(Tegen Lola) Toe schat, maak het niet erger dan het al is."},{"role":"LAURA","text":"Schat?!"},{"role":"LOLA","text":"Nee, dat doe je nu zelf al wel!"},{"role":"HANS","text":"(Tegen Laura) Lieverd, het stelt niks voor."},{"role":"LOLA","text":"O! Ik stel niks voor! Bekijk het maar Hans!\n(Stampvoetend loopt Lola via de voordeur het toneel af. Meneer Chateau komt haar buiten tegen en gaat via de voordeur het podium weer op.)"},{"role":"LAURA","text":"Na al die jaren?! Zakenreisje, en daar ben ik ingetrapt!"},{"role":"HANS","text":"Het is echt een zakenreisje, lieverd. Ik heb namens het bedrijf dit hotel gekocht!"},{"role":"SIMONE","text":"Ja, en hij gaat het plat gooien en dan komt hier jullie volgende kerncentrale."},{"role":"LAURA","text":"Hans, ik hoorde al van de buurman van die kerncentrale en wist direct dat er maar één kon zijn met zo’n belachelijk idee!"},{"role":"HANS","text":"Dit is de ideale plek er voor!"},{"role":"LAURA","text":"Kom nou Hans, een kerncentrale midden in het bos! Komt niks van in. Je kunt wel wat de directeur uithangen, maar het bedrijf is nog altijd van mij, omdat ik het geërfd heb van pappie. Je mocht altijd je gang gaan, maar dit slaat nergens op. Je bent niet langer directeur en binnenkort ook niet meer mijn man!"},{"role":"HANS","text":"Maar dan ben ik werkeloos en kom ik op straat!"},{"role":"LAURA","text":"Nee hoor, je kunt wel aan de slag als schoonmaker van de reactor in onze andere kerncentrale."},{"role":"SIMONE","text":"Schijnt ook voordelen te hebben."},{"role":"HANS","text":"Hu?"},{"role":"SIMONE","text":"Heb gehoord dat je dan na een tijdje geen bedlampje meer nodig hebt om ’s avonds een boek te lezen op bed!"},{"role":"EMMA","text":"(Is juist van de trap gekomen) Dus de koop gaat niet door!"},{"role":"LAURA","text":"Nee, de koop gaat gewoon door. Jullie willen toch immers met pensioen?"},{"role":"EMMA","text":"Ja, dat wel, dit werk valt mij zwaar, vooral de laatste paar uren!"},{"role":"LAURA","text":"Nee, ik koop het gewoon en dan geef ik het cadeau!"},{"role":"SIMONE","text":"Cadeau?"},{"role":"LAURA","text":"Ja, cadeau! Ik heb zo’n vermoeden dat hier een kleine romance aan de gang is tussen mijn lieve vriendin Nel en meneer Chateau. (Zitten al wat erg gezellig te keuvelen bij de bar.) En als voortijdig huwelijkscadeau geef ik hen graag dit aller aardigste hotelletje. Ze zijn namelijk niet alleen een beetje verliefd op elkaar, maar ook op dit hotelletje!"},{"role":"FRITS","text":"Wat ben ik blij dat het allemaal zo afloopt. Dan ben ik de komende jaren tenminste verzekerd van..."},{"role":"IEDEREEN","text":"Een kerstpakket!!"},{"role":"FRITS","text":"Eh... nee, mijn baan natuurlijk!\nDOEK SLUITEN"}]}]};
CUE_LIBRARY.scripts.unshift({id:"unaniem",title:"Unaniem",data:D});
let si=0,pos=0,practicing=false,revealed=false;
const $=x=>document.getElementById(x);
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function formatRepliek(text){
 let result='', plain='', direction='', depth=0;
 for(const character of text){
  if(character==='('){
   if(depth===0){result+=esc(plain);plain='';}
   depth++;direction+=character;
  }else if(character===')'&&depth>0){
   direction+=character;depth--;
   if(depth===0){result+=`<span class="v5-direction">${esc(direction)}</span>`;direction='';}
  }else if(depth>0){direction+=character;}
  else{plain+=character;}
 }
 return result+esc(plain+direction);
}
function cs(){return D.scenes[si]?.cards||[]}
function isMine(c){return c.role===$('role').value}
D.roles.forEach(r=>$('role').add(new Option(r,r)));
D.scenes.forEach((s,i)=>$('scene').add(new Option(s.title,i)));
let def=D.roles.indexOf("Jurylid 8"); $('role').selectedIndex=def>=0?def:0;

function readScene(){
 practicing=false; revealed=false;
 $('out').innerHTML=cs().map(c=>`<article class="card ${isMine(c)?'mine':''}">
 <b>${esc(c.role)}</b><div>${formatRepliek(c.text)}</div></article>`).join('');
 $('bar').style.width='0%'; $('status').textContent=$('scene').selectedOptions[0]?.text||'';
}
function start(){
 let i=cs().findIndex(isMine);
 if(i<0){$('out').innerHTML='<article class="card">Deze rol heeft geen repliek in deze scène.</article>';return}
 practicing=true; pos=i; revealed=false; render();
}
function render(){
 let a=cs(); if(!a[pos])return;
 // ALLE voorafgaande gesproken replieken, ongeacht wie ze zegt.
 let h='';
 for(let i=0;i<pos;i++) {
   let c=a[i];
   h+=`<article class="card cue"><b>${esc(c.role)}</b><div>${formatRepliek(c.text)}</div></article>`;
 }
 let c=a[pos];
 h+=`<article class="card mine"><b>${esc(c.role)} — MIJN TEKST</b>
 <div class="${revealed?'':'blur'}">${formatRepliek(c.text)}</div>
 <small>${revealed?'':'Zeg je repliek uit het hoofd en toon daarna de tekst ter controle.'}</small></article>`;
 $('out').innerHTML=h;
 $('bar').style.width=((pos+1)/a.length*100)+'%';
}
function next(){
 if(!practicing)return; let a=cs(),i=pos+1;
 while(i<a.length&&!isMine(a[i]))i++;
 if(i<a.length){pos=i;revealed=false;render()}else $('status').textContent='Alle replieken van jouw rol in deze scène zijn geoefend.';
}
function prev(){
 if(!practicing)return; let a=cs(),i=pos-1;
 while(i>=0&&!isMine(a[i]))i--;
 if(i>=0){pos=i;revealed=false;render()}
}
$('read').onclick=readScene;$('start').onclick=start;$('next').onclick=next;$('prev').onclick=prev;
$('reveal').onclick=()=>{if(practicing){revealed=true;render()}};
$('role').onchange=()=>practicing?start():readScene();
$('scene').onchange=()=>{si=+$('scene').value;readScene()};
readScene();
</script>
<script id="speech-practice-script">
/* Spraakoefening: gebruikt de ingebouwde Web Speech API van de browser. */
(function () {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;
  let restartTimer = null;
  let advanceTimer = null;
  let finalTranscript = '';

  const style = document.createElement('style');
  style.textContent = '.speech-panel{margin:10px 0;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc}.speech-panel p{margin:6px 0}.speech-panel .speech-live{min-height:1.4em;color:#334155}.speech-panel .speech-score{font-weight:700}.speech-panel.unsupported{background:#fff7ed;border-color:#fed7aa}';
  document.head.appendChild(style);

  const toolbar = $('read').parentElement;
  const listenButton = document.createElement('button');
  listenButton.id = 'listen';
  listenButton.type = 'button';
  listenButton.textContent = '🎙️ Start spraakoefening';
  listenButton.disabled = !SpeechRecognition;
  toolbar.insertBefore(listenButton, $('reveal'));
  const autoLabel = document.createElement('label');
  autoLabel.innerHTML = '<input type="checkbox" id="auto-cues"> Automatisch tegenspelers voorlezen';
  toolbar.appendChild(autoLabel);
  const toleranceLabel = document.createElement('label');
  toleranceLabel.innerHTML = 'Herkenning: <select id="speech-tolerance"><option value="0.5">Heel soepel (50%)</option><option value="0.6" selected>Soepel (60%)</option><option value="0.75">Normaal (75%)</option><option value="0.85">Streng (85%)</option></select>';
  toolbar.appendChild(toleranceLabel);
  const tolerance = toleranceLabel.querySelector('select');
  try {
    const saved = localStorage.getItem('cue-speech-tolerance');
    if (Array.from(tolerance.options).some(option => option.value === saved)) tolerance.value = saved;
  } catch (_) {}
  tolerance.onchange = () => {
    clearTimeout(advanceTimer);
    try { localStorage.setItem('cue-speech-tolerance', tolerance.value); } catch (_) {}
    updateScore();
  };
  const doneButton = document.createElement('button');
  doneButton.textContent = '✓ Ik ben klaar';
  doneButton.type = 'button';
  doneButton.disabled = !SpeechRecognition;
  toolbar.appendChild(doneButton);
  doneButton.onclick = () => {
    if (!listening) return;
    finishTurn();
  };
  const autoCues = autoLabel.querySelector('input');
  autoCues.disabled = !SpeechRecognition || !('speechSynthesis' in window);
  autoCues.onchange = () => { clearTimeout(advanceTimer); };
  window.addEventListener('cue-reading-finished', () => {
    if (autoCues.checked && practicing && !listening) startListening();
  });

  const panel = document.createElement('section');
  panel.id = 'speech-panel';
  panel.className = 'speech-panel' + (SpeechRecognition ? '' : ' unsupported');
  panel.innerHTML = SpeechRecognition
    ? '<strong>Spraakoefening</strong><p id="speech-help">Start de oefening, zeg je verborgen repliek en vergelijk daarna de tekst.</p><p class="speech-live" id="speech-live" aria-live="polite"></p><p class="speech-score" id="speech-score"></p>'
    : '<strong>Spraakoefening niet beschikbaar</strong><p>Deze browser ondersteunt geen spraakherkenning. Open de app in een recente versie van Chrome of Edge.</p>';
  $('out').before(panel);

  const live = () => $('speech-live');
  const score = () => $('speech-score');
  const help = () => $('speech-help');
  const normalise = text => text
    .replace(/\([^)]*\)/g, ' ')
    .toLocaleLowerCase('nl-NL')
    .replace(/[^\p{L}\p{N}'’\s]/gu, ' ')
    .replace(/\s+/g, ' ').trim();
  const words = text => normalise(text).split(' ').filter(Boolean);
  const lcsLength = (expected, spoken) => {
    let previous = new Uint16Array(spoken.length + 1);
    for (const expectedWord of expected) {
      const current = new Uint16Array(spoken.length + 1);
      for (let column = 1; column <= spoken.length; column++) {
        current[column] = expectedWord === spoken[column - 1]
          ? previous[column - 1] + 1
          : Math.max(previous[column], current[column - 1]);
      }
      previous = current;
    }
    return previous[spoken.length];
  };
  const updateScore = () => {
    if (!practicing || !cs()[pos]) return;
    const expected = words(cs()[pos].text);
    const spoken = words(finalTranscript);
    if (!spoken.length) { score().textContent = ''; return; }
    const percentage = expected.length ? Math.round((lcsLength(expected, spoken) / expected.length) * 100) : 0;
    score().textContent = `Woordovereenkomst met je repliek: ${percentage}%. ${percentage >= Number(tolerance.value) * 100 ? 'Voldoende voor de gekozen herkenningsmarge.' : 'Nog onder de gekozen marge. Anders verwoord? Tik op “Ik ben klaar”.'}`;
  };
  const resetFeedback = () => {
    finalTranscript = '';
    if (live()) live().textContent = '';
    if (score()) score().textContent = '';
    if (help()) help().textContent = 'Zeg je verborgen repliek. De herkenning vergelijkt alleen gesproken woorden; regieaanwijzingen tellen niet mee.';
  };
  const stopListening = () => {
    listening = false;
    clearTimeout(advanceTimer);
    clearTimeout(restartTimer);
    restartTimer = null;
    if (recognition) recognition.stop();
    if (SpeechRecognition) listenButton.textContent = '🎙️ Start spraakoefening';
  };
  const startListening = () => {
    if (!practicing) { $('status').textContent = 'Kies eerst “Start oefenen” om een repliek te oefenen.'; return; }
    resetFeedback();
    recognition = new SpeechRecognition();
    const session = recognition;
    recognition.lang = 'nl-NL';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.onresult = event => {
      if (recognition !== session) return;
      let interim = '';
      for (let index = event.resultIndex; index < event.results.length; index++) {
        const text = event.results[index][0].transcript;
        if (event.results[index].isFinal) finalTranscript += `${text} `;
        else interim += text;
      }
      live().textContent = `Herkenning: ${(finalTranscript + interim).trim()}`;
      updateScore();
      clearTimeout(advanceTimer);
      const expected = words(cs()[pos].text);
      const spoken = words(finalTranscript);
      const enoughWords = spoken.length >= Math.ceil(expected.length * 0.75);
      if (autoCues.checked && listening && !interim && expected.length && enoughWords && lcsLength(expected, spoken) / expected.length >= Number(tolerance.value)) {
        advanceTimer = setTimeout(() => {
          if (!autoCues.checked || !listening || recognition !== session) return;
          finishTurn();
        }, 2500);
      }
    };
    recognition.onerror = event => {
      if (recognition !== session || !listening) return;
      if (event.error === 'no-speech' || event.error === 'aborted') return;
      listening = false;
      clearTimeout(advanceTimer);
      clearTimeout(restartTimer);
      listenButton.textContent = '🎙️ Start spraakoefening';
      const messages = { 'not-allowed': 'Microfoontoegang is niet toegestaan. Sta deze toe in de browser en probeer opnieuw.', 'no-speech': 'Geen spraak gehoord. Probeer het opnieuw.', 'network': 'Spraakherkenning heeft een netwerkverbinding nodig.' };
      help().textContent = messages[event.error] || `Spraakherkenning kon niet starten (${event.error}).`;
    };
    recognition.onend = () => {
      if (recognition !== session) return;
      updateScore();
      if (!listening) return;
      help().textContent = 'Luisteren wordt hervat… je herkende tekst blijft bewaard.';
      restartTimer = setTimeout(() => {
        if (!listening || recognition !== session) return;
        try {
          session.start();
          help().textContent = 'Luisteren… neem gerust een pauze. Klik op stop wanneer je klaar bent.';
        } catch (_) {
          listening = false;
          listenButton.textContent = '🎙️ Start spraakoefening';
          help().textContent = 'Het luisteren kon niet worden hervat. Je herkende tekst blijft staan. Start opnieuw om nog eens te oefenen.';
        }
      }, 300);
    };
    try {
      recognition.start();
      listening = true;
      listenButton.textContent = '■ Stop spraakoefening';
      help().textContent = 'Luisteren… kleine tekstafwijkingen mogen. Bij voldoende herkenning gaat Cue! na een pauze verder. Anders kun je op “Ik ben klaar” tikken.';
    } catch (_) { help().textContent = 'De microfoon start al. Klik op stop en probeer opnieuw.'; }
  };
  listenButton.onclick = () => listening ? stopListening() : startListening();
  function finishTurn() {
    stopListening();
    updateScore();
    if (!autoCues.checked) return;
    const previousPosition = pos;
    next();
    if (pos !== previousPosition) $('speak-cues').click();
  }

  const originalRender = render;
  render = function () { stopListening(); originalRender(); resetFeedback(); };
  const originalReadScene = readScene;
  readScene = function () { stopListening(); originalReadScene(); resetFeedback(); };
})();
</script>
<script id="role-voices-script">
window.cueVoiceForRole = function (role) {
  const setting = D.roleVoices?.[role] || {};
  const voices = window.speechSynthesis.getVoices().filter(v => /^nl(?:[-_]|$)/i.test(v.lang));
  const explicit = voices.find(v => v.name === setting.voice);
  const male = /\b(frank|ruben|xander|maarten|arthur|male|man)\b/i;
  const female = /\b(colette|femke|lotte|claire|ellen|saskia|laura|female|vrouw)\b/i;
  const matched = setting.gender === 'male' ? voices.find(v => male.test(v.name))
    : setting.gender === 'female' ? voices.find(v => female.test(v.name)) : null;
  return { voice: explicit || matched || voices[0], fallback: !!setting.gender && !explicit && !matched,
    pitch: setting.gender === 'male' ? 0.85 : setting.gender === 'female' ? 1.15 : 1 };
};
</script>
<script id="cue-read-aloud">
(function () {
  const supported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  const button = document.createElement('button');
  button.id = 'speak-cues';
  button.textContent = '🔊 Lees tegenspelers voor';
  button.disabled = !supported;
  $('read').parentElement.appendChild(button);
  let generation = 0;
  let speaking = false;
  function stop() {
    generation++;
    speaking = false;
    if (supported) window.speechSynthesis.cancel();
    button.textContent = '🔊 Lees tegenspelers voor';
  }
  button.onclick = () => {
    if (speaking) { stop(); return; }
    const cards = cs();
    let from = 0;
    if (practicing) {
      for (let i = pos - 1; i >= 0; i--) {
        if (isMine(cards[i])) { from = i + 1; break; }
      }
    }
    const lines = cards.slice(from, practicing ? pos : cards.length)
      .filter(card => !isMine(card))
      .map(card => ({ role: card.role, text: card.text.replace(/\([^)]*\)/g, ' ').replace(/\s+/g, ' ').trim() }))
      .filter(card => /[\p{L}\p{N}]/u.test(card.text));
    if (!lines.length) {
      $('status').textContent = 'Hier zijn geen replieken van tegenspelers om voor te lezen.';
      window.dispatchEvent(new Event('cue-reading-finished'));
      return;
    }
    const listen = $('listen');
    if (listen && listen.textContent.startsWith('■')) listen.click();
    stop();
    speaking = true;
    button.textContent = '■ Stop voorlezen';
    const token = generation;
    function speak(index) {
      if (token !== generation) return;
      if (index >= lines.length) {
        stop();
        $('status').textContent = practicing ? 'Jij bent aan de beurt. Zeg je repliek of start de spraakoefening.' : 'Voorlezen klaar.';
        window.dispatchEvent(new Event('cue-reading-finished'));
        return;
      }
      const utterance = new SpeechSynthesisUtterance(lines[index].text);
      const selection = window.cueVoiceForRole(lines[index].role);
      utterance.lang = 'nl-NL';
      if (selection.voice) utterance.voice = selection.voice;
      if (selection.fallback) utterance.pitch = selection.pitch;
      utterance.onend = () => speak(index + 1);
      utterance.onerror = () => {
        if (token !== generation) return;
        stop();
        $('status').textContent = 'Voorlezen is onderbroken. Tik opnieuw op “Lees tegenspelers voor”.';
      };
      window.speechSynthesis.speak(utterance);
    }
    speak(0);
  };
  const previousRender = render;
  render = function () { stop(); previousRender(); };
  const previousReadScene = readScene;
  readScene = function () { stop(); previousReadScene(); };
  $('listen').addEventListener('click', stop);
  window.addEventListener('pagehide', stop);
})();
</script>
<script id="text-editor-script">
(function () {
  const editor = document.createElement('details');
  editor.className = 'speech-panel';
  editor.innerHTML = '<summary><strong>✏️ Toneeltekst aanpassen</strong></summary>' +
    '<p>Pas een repliek aan en sla deze op. Download daarna het publicatiebestand en upload dit naar GitHub om je wijzigingen met iedereen te delen.</p>' +
    '<label>Scène<br><select id="edit-scene"></select></label> ' +
    '<label>Repliek<br><select id="edit-line" style="max-width:100%"></select></label>' +
    '<p><label>Speler<br><select id="edit-role"></select></label></p>' +
    '<label>Tekst (regieaanwijzingen tussen haakjes)<br><textarea id="edit-text" rows="7" style="box-sizing:border-box;width:100%;padding:10px;font:inherit"></textarea></label>' +
    '<p><button id="edit-save" type="button">Sla repliek op</button> <button id="edit-delete" type="button">Verwijder repliek</button> <button id="edit-undo-delete" type="button" disabled>Maak verwijderen ongedaan</button> <button id="edit-download" type="button">Download index.html voor GitHub</button></p>' +
    '<p id="edit-status" aria-live="polite">Wijzigingen zijn pas voor iedereen zichtbaar na uploaden naar GitHub. Download ze vóór je deze pagina sluit.</p>' +
    '<h3>Stemmen per speler</h3><p>Kies man of vrouw en beluister het voorbeeld. Je kunt ook zelf een Nederlandse stem kiezen. Stemmen verschillen per apparaat. Zonder passende stem gebruikt Cue! de standaardstem met een lagere of hogere toonhoogte.</p><div id="role-voice-settings"></div>';
  document.querySelector('main').appendChild(editor);
  const sceneSelect = $('edit-scene'), lineSelect = $('edit-line');
  let dirty = false, unsaved = false;
  let deletedLine = null;
  D.roleVoices = D.roleVoices || {};
  const voiceRows = [];
  function rebuildVoiceRows() {
  voiceRows.length = 0;
  $('role-voice-settings').innerHTML = '';
  D.roles.forEach(role => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0';
    const label = document.createElement('strong');
    label.textContent = role;
    label.style.minWidth = '110px';
    const gender = document.createElement('select');
    gender.setAttribute('aria-label', `Man of vrouw voor ${role}`);
    gender.add(new Option('Standaard', ''));
    gender.add(new Option('Man', 'male'));
    gender.add(new Option('Vrouw', 'female'));
    gender.value = D.roleVoices[role]?.gender || '';
    const voice = document.createElement('select');
    voice.style.maxWidth = '100%';
    voice.setAttribute('aria-label', `Stem voor ${role}`);
    const preview = document.createElement('button');
    preview.textContent = '▶ Luister';
    preview.type = 'button';
    preview.disabled = !('speechSynthesis' in window);
    function saveSetting() {
      D.roleVoices[role] = { gender: gender.value, voice: voice.value };
      dirty = true;
      $('edit-status').textContent = 'Stemkeuze opgeslagen. Download index.html en upload dit naar GitHub om deze instelling te delen.';
    }
    gender.onchange = () => { voice.value = ''; saveSetting(); };
    voice.onchange = saveSetting;
    preview.onclick = () => {
      if ($('listen').textContent.startsWith('■')) $('listen').click();
      if ($('speak-cues').textContent.startsWith('■')) $('speak-cues').click();
      window.speechSynthesis.cancel();
      const selection = window.cueVoiceForRole(role);
      const utterance = new SpeechSynthesisUtterance(`Hallo, ik speel ${role}. Dit is mijn stem.`);
      utterance.lang = 'nl-NL';
      if (selection.voice) utterance.voice = selection.voice;
      if (selection.fallback) utterance.pitch = selection.pitch;
      $('edit-status').textContent = selection.fallback ? 'Geen passende mannelijke of vrouwelijke stem gevonden. Je hoort de standaardstem met aangepaste toonhoogte. Kies eventueel zelf een stem.' : 'Luistervoorbeeld voor ' + role;
      window.speechSynthesis.speak(utterance);
    };
    row.append(label, gender, voice, preview);
    $('role-voice-settings').appendChild(row);
    voiceRows.push({ role, voice });
  });
  }
  rebuildVoiceRows();
  function refreshVoices() {
    const voices = 'speechSynthesis' in window ? window.speechSynthesis.getVoices().filter(v => /^nl(?:[-_]|$)/i.test(v.lang)) : [];
    voiceRows.forEach(({ role, voice }) => {
      const saved = D.roleVoices[role]?.voice || '';
      voice.innerHTML = '';
      voice.add(new Option('Automatisch kiezen', ''));
      voices.forEach(v => voice.add(new Option(`${v.name} (${v.lang})`, v.name)));
      if (saved && !voices.some(v => v.name === saved)) voice.add(new Option(saved + ' (niet op dit apparaat)', saved));
      voice.value = saved;
    });
  }
  if ('speechSynthesis' in window) window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
  refreshVoices();
  D.scenes.forEach((scene, index) => sceneSelect.add(new Option(scene.title, index)));
  D.roles.forEach(role => $('edit-role').add(new Option(role, role)));
  function loadLine() {
    const card = D.scenes[+sceneSelect.value].cards[+lineSelect.value];
    $('edit-save').disabled = !card;
    $('edit-delete').disabled = !card;
    $('edit-role').disabled = !card;
    $('edit-text').disabled = !card;
    if (!card) {
      $('edit-text').value = '';
      unsaved = false;
      return;
    }
    $('edit-role').value = card.role;
    $('edit-text').value = card.text;
    unsaved = false;
  }
  function loadScene(selectedIndex = 0) {
    lineSelect.innerHTML = '';
    D.scenes[+sceneSelect.value].cards.forEach((card, index) => {
      lineSelect.add(new Option(`${index + 1}. ${card.role}: ${card.text.slice(0, 65)}`, index));
    });
    lineSelect.selectedIndex = Math.min(Number.isInteger(selectedIndex) ? selectedIndex : 0, lineSelect.options.length - 1);
    loadLine();
  }
  function saveLine() {
    if (!$('edit-line').options.length) return false;
    const text = $('edit-text').value.trim();
    if (!text) { $('edit-status').textContent = 'Vul eerst een tekst in.'; return false; }
    const card = D.scenes[+sceneSelect.value].cards[+lineSelect.value];
    card.text = text;
    card.role = $('edit-role').value;
    lineSelect.selectedOptions[0].textContent = `${+lineSelect.value + 1}. ${card.role}: ${text.slice(0, 65)}`;
    dirty = true;
    unsaved = false;
    if (practicing) render(); else readScene();
    $('edit-status').textContent = 'Repliek opgeslagen in deze pagina. Download index.html om de wijzigingen te bewaren en te publiceren.';
    return true;
  }
  sceneSelect.onchange = loadScene;
  lineSelect.onchange = loadLine;
  $('edit-text').oninput = () => { unsaved = true; };
  $('edit-role').onchange = () => { unsaved = true; };
  $('edit-save').onclick = saveLine;
  function refreshAfterDeletion() {
    if (si === +sceneSelect.value && practicing) {
      practicing = false;
      readScene();
      $('status').textContent = 'De scène is aangepast. Tik op “Start oefenen” om opnieuw te beginnen.';
    } else if (practicing) render(); else readScene();
  }
  $('edit-delete').onclick = () => {
    const sceneIndex = +sceneSelect.value;
    const index = +lineSelect.value;
    const cards = D.scenes[sceneIndex].cards;
    if (!lineSelect.options.length || !cards[index]) return;
    deletedLine = { sceneIndex, index, card: cards[index] };
    cards.splice(index, 1);
    dirty = true;
    unsaved = false;
    $('edit-undo-delete').disabled = false;
    loadScene(index);
    refreshAfterDeletion();
    $('edit-status').textContent = 'Repliek verwijderd. Je kunt dit met “Maak verwijderen ongedaan” herstellen. Download index.html en upload die naar GitHub om het voor iedereen te wijzigen.';
  };
  $('edit-undo-delete').onclick = () => {
    if (!deletedLine) return;
    const { sceneIndex, index, card } = deletedLine;
    D.scenes[sceneIndex].cards.splice(index, 0, card);
    sceneSelect.value = String(sceneIndex);
    deletedLine = null;
    dirty = true;
    unsaved = false;
    $('edit-undo-delete').disabled = true;
    loadScene(index);
    refreshAfterDeletion();
    $('edit-status').textContent = 'De laatst verwijderde repliek is teruggezet. Download index.html om je wijzigingen te bewaren.';
  };
  $('edit-download').onclick = async () => {
    if (unsaved && !saveLine()) return;
    try {
      const response = await fetch(location.href.split('#')[0], { cache: 'no-store' });
      if (!response.ok) throw new Error('download');
      const source = await response.text();
      const dataPattern = /(?:const|let) D=\{[^\r\n]*\};/;
      if (!dataPattern.test(source)) throw new Error('data');
      const json = JSON.stringify(D).replace(/</g, '\\u003c');
      const libraryPattern = /const CUE_LIBRARY=\{[^\r\n]*\};/;
      if (!libraryPattern.test(source)) throw new Error('library');
      const libraryJson = JSON.stringify(CUE_LIBRARY).replace(/</g, '\\u003c');
      const updated = source.replace(dataPattern, () => `let D=${json};`).replace(libraryPattern, () => `const CUE_LIBRARY=${libraryJson};`);
      const url = URL.createObjectURL(new Blob([updated], { type: 'text/html;charset=utf-8' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'index.html';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      dirty = false;
      window.cueLibraryDirty = false;
      $('edit-status').textContent = 'Download gestart. Upload dit bestand in GitHub via Add file → Upload files → Commit changes. Daarna krijgt iedereen de aangepaste tekst.';
    } catch (_) {
      $('edit-status').textContent = 'Download niet gelukt. Open Cue! via je online GitHub-link en probeer opnieuw. Houd deze pagina open om je wijzigingen te bewaren.';
    }
  };
  window.addEventListener('beforeunload', event => {
    if (!dirty && !unsaved) return;
    event.preventDefault();
    event.returnValue = '';
  });
  loadScene();
  window.addEventListener('cue-script-changed', () => {
    deletedLine = null;
    $('edit-undo-delete').disabled = true;
    sceneSelect.innerHTML = '';
    $('edit-role').innerHTML = '';
    D.scenes.forEach((scene, index) => sceneSelect.add(new Option(scene.title, index)));
    D.roles.forEach(role => $('edit-role').add(new Option(role, role)));
    rebuildVoiceRows();
    refreshVoices();
    loadScene();
  });
})();
</script>
<script id="v5-script">
(function(){
 function init(){
  if(document.getElementById('v5-panel')) return;
  const host=document.querySelector('main')||document.body;
  const p=document.createElement('section'); p.id='v5-panel'; p.className='v5-panel';
  p.innerHTML='<div class="v5-title">Versie 5 · Oefeninstellingen</div>'+
   '<div class="v5-buttons">'+
   '<button class="v5-button selected" data-mode="all">Alle cues</button>'+
   '<button class="v5-button" data-mode="3">Laatste 3</button>'+
   '<button class="v5-button" data-mode="1">Laatste cue</button>'+
   '<button class="v5-button" data-mode="scene">Hele scène</button>'+
   '<button class="v5-button" id="v5-directions">Regieaanwijzingen: aan</button></div>'+
   '<div class="v5-help">Kies hoeveel voorafgaande replieken je wilt zien. Regieaanwijzingen tussen haakjes kun je tonen of verbergen.</div>';
  host.insertBefore(p,host.firstChild);
  let mode='all', showDirections=true;
  p.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
   mode=b.dataset.mode;p.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('selected',x===b));
   window.dispatchEvent(new CustomEvent('v5-cue-mode',{detail:mode}));
   applyCueMode();
  });
  p.querySelector('#v5-directions').onclick=()=>{
   showDirections=!showDirections;
   p.querySelector('#v5-directions').textContent='Regieaanwijzingen: '+(showDirections?'aan':'uit');
   document.getElementById('out').classList.toggle('cue-hide-directions',!showDirections);
  };
  function applyCueMode(){
   const cards=[...document.querySelectorAll('.line-card,.dialogue-card,.repliek,.line')];
   if(!cards.length)return;
   const idx=cards.findIndex(el=>el.querySelector('.hidden,.blurred,[data-hidden="true"]'));
   if(idx<0)return;
   cards.forEach((el,i)=>{
    if(i>=idx){el.style.display='';return;}
    const n=idx-i;
    el.style.display=(mode==='all'||mode==='scene'||(mode==='3'&&n<=3)||(mode==='1'&&n<=1))?'':'none';
   });
  }
  new MutationObserver(()=>{applyCueMode()}).observe(document.getElementById('out'),{childList:true,subtree:true});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
<script id="script-import">
// Lokale import: het bestand wordt niet naar een externe dienst verstuurd.
window.cueValidateScript = function (input) {
  if (!input || !Array.isArray(input.scenes) || !input.scenes.length) throw new Error('Het script bevat geen scènes.');
  const roles = new Set();
  const scenes = input.scenes.map((scene, index) => {
    if (!Array.isArray(scene.cards)) throw new Error('Een scène heeft geen geldige repliekenlijst.');
    const cards = scene.cards.map(card => {
      if (!card || typeof card.role !== 'string' || typeof card.text !== 'string' || !card.role.trim() || !card.text.trim()) throw new Error('Een repliek mist een rol of tekst.');
      roles.add(card.role.trim());
      return { role: card.role.trim(), text: card.text.trim() };
    });
    return { title: String(scene.title || `Scène ${index + 1}`), cards };
  });
  if (!roles.size) throw new Error('Het script bevat geen gesproken replieken.');
  return { roles: [...roles], scenes };
};
window.cueParseScriptText = function (text, title) {
  const scenes = []; let scene = null, current = null, pending = [], skipped = [];
  function ensureScene() { if (!scene) { scene = { title: 'Scène 1', cards: [] }; scenes.push(scene); } }
  const lines = text.replace(/\r/g, '').split('\n');
  for (let index = 0; index < lines.length; index++) {
    const line = lines[index].trim();
    if (!line || /^pagina\s+\d+$/i.test(line) || /^\d+$/.test(line) || line.toLowerCase() === title.trim().toLowerCase()) continue;
    if (/^(?:[①-⑳\d.\s-]*)sc[eè]ne\s+(?:\d+|[①-⑳])/i.test(line) || /^(?:(?:eerste|tweede|derde|vierde|vijfde|\d+)[\s]+bedrijf|akte\s+\d+)$/i.test(line)) {
      scene = { title: line, cards: [] }; scenes.push(scene); current = null; pending = []; continue;
    }
    const roleMatch = line.match(/^([\p{L}\p{N}][\p{L}\p{N} .’'\-]{0,65}):\s*(.*)$/u);
    // Losse rolnamen worden alleen herkend als ze volledig in hoofdletters staan.
    const standalone = /^[\p{Lu}\d][\p{Lu}\d .’'\-]{1,45}$/u.test(line) && /\p{Lu}/u.test(line);
    if (roleMatch || standalone) {
      ensureScene();
      const role = roleMatch ? roleMatch[1].trim() : line;
      const spoken = roleMatch ? roleMatch[2].trim() : '';
      current = { role, text: [...pending, spoken].filter(Boolean).join(' ') };
      pending = []; scene.cards.push(current);
    } else if (current) current.text += (current.text ? '\n' : '') + line;
    else if (scene) pending.push(line.startsWith('(') ? line : `(${line})`);
    else skipped.push({ line: index + 1, text: line });
  }
  const emptyCards = scenes.flatMap(s => s.cards).filter(c => !c.text.trim()).length;
  const cleanScenes = scenes.map(s => ({ ...s, cards: s.cards.filter(c => c.text.trim()) })).filter(s => s.cards.length);
  const data = window.cueValidateScript({ scenes: cleanScenes });
  const counts = new Map();
  data.scenes.forEach(s => s.cards.forEach(c => counts.set(c.role, (counts.get(c.role) || 0) + 1)));
  const warnings = skipped.map(item => `Regel ${item.line} niet ingedeeld: ${item.text}`).concat(emptyCards ? [`${emptyCards} lege rolvermeldingen overgeslagen.`] : []);
  for (const [role, count] of counts) if (count <= 2 || role.length > 30) warnings.push(`Controleer rolnaam “${role}” (${count} replieken); dit kan een scan- of indelingsfout zijn.`);
  if (data.scenes.some(s => s.cards.some(c => /\b[\p{Lu}][\p{Lu} .]{2,30}:\s/u.test(c.text)))) warnings.push('Er lijken meerdere spelers in één repliek te staan. Splits die in het tekstvak op aparte regels met ROL: tekst.');
  return { data, warnings };
};
window.cueDocxText = async function (buffer) {
  const bytes = new Uint8Array(buffer), view = new DataView(buffer), decoder = new TextDecoder();
  let end = bytes.length - 22;
  while (end >= Math.max(0, bytes.length - 65557) && view.getUint32(end, true) !== 0x06054b50) end--;
  if (end < 0 || view.getUint32(end, true) !== 0x06054b50) throw new Error('Dit is geen geldig Word-bestand.');
  let position = view.getUint32(end + 16, true);
  const entries = view.getUint16(end + 10, true);
  for (let i = 0; i < entries; i++) {
    if (view.getUint32(position, true) !== 0x02014b50) throw new Error('Word-bestand kon niet worden gelezen.');
    const method = view.getUint16(position + 10, true), size = view.getUint32(position + 20, true);
    const nameLength = view.getUint16(position + 28, true), extraLength = view.getUint16(position + 30, true), commentLength = view.getUint16(position + 32, true);
    const name = decoder.decode(bytes.slice(position + 46, position + 46 + nameLength));
    if (name === 'word/document.xml') {
      const local = view.getUint32(position + 42, true);
      const start = local + 30 + view.getUint16(local + 26, true) + view.getUint16(local + 28, true);
      let xmlBytes = bytes.slice(start, start + size);
      if (method === 8) {
        try { xmlBytes = new Uint8Array(await new Response(new Blob([xmlBytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
        catch (_) { throw new Error('Deze browser kan Word niet uitpakken. Open in Chrome of kopieer de Word-tekst naar het tekstvak.'); }
      } else if (method !== 0) throw new Error('Onbekende Word-compressie. Plak de tekst uit Word.');
      const xml = new DOMParser().parseFromString(decoder.decode(xmlBytes), 'application/xml');
      if (xml.getElementsByTagName('parsererror').length) throw new Error('De Word-tekst is beschadigd.');
      const ns = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
      return Array.from(xml.getElementsByTagNameNS(ns, 'p'), paragraph => Array.from(paragraph.getElementsByTagNameNS(ns, 't'), node => node.textContent).join('')).join('\n');
    }
    position += 46 + nameLength + extraLength + commentLength;
  }
  throw new Error('Geen tekst gevonden. Een scan moet eerst met tekstherkenning worden omgezet.');
};
(function () {
  const host = document.querySelector('main');
  const panel = document.createElement('section'); panel.className = 'speech-panel';
  panel.innerHTML = '<label><strong>Toneelstuk</strong><br><select id="script-choice" style="width:100%"></select></label><details style="margin-top:12px"><summary>＋ Script toevoegen</summary><p>Importeer Word (.docx), tekst (.txt) of een Cue!-script (.json). Controleer de indeling voordat je het toevoegt. Bestanden blijven op dit apparaat.</p><label>Titel<br><input id="import-title" style="width:95%;padding:8px" placeholder="Titel van het toneelstuk"></label><p><input id="import-file" type="file" accept=".docx,.txt,.json"></p><label>Tekst controleren en aanpassen<br><textarea id="import-text" rows="10" style="width:100%;box-sizing:border-box;font:inherit" placeholder="Scène 1&#10;EMMA: Hallo!&#10;CHATEAU: Goedemiddag."></textarea></label><p>Gebruik per repliek <b>ROL: tekst</b> en voor scènegrenzen <b>Scène 1</b>, <b>Scène 2</b>, enzovoort.</p><button id="import-check">Controleer script</button><button id="import-add" disabled>Voeg gecontroleerd script toe</button><p id="import-status" aria-live="polite"></p><pre id="import-preview" style="white-space:pre-wrap;max-height:350px;overflow:auto"></pre></details><p><button id="script-json">Download gekozen script als JSON</button> <button id="library-download">Download index.html met alle scripts</button></p><small>Een nieuw script is eerst alleen in deze pagina beschikbaar. Download de app vóór je de pagina sluit. Upload index.html naar GitHub om alle scripts te publiceren.</small>';
  host.insertBefore(panel, host.firstChild);
  const choice = $('script-choice'); let candidate = null, jsonCandidate = null;
  window.cueLibraryDirty = false;
  function fillChoices() {
    choice.innerHTML = '';
    CUE_LIBRARY.scripts.forEach((script, index) => choice.add(new Option(script.title, index)));
    choice.selectedIndex = CUE_LIBRARY.scripts.findIndex(script => script.data === D);
  }
  function switchScript(index) {
    D = CUE_LIBRARY.scripts[index].data;
    si = 0; pos = 0; practicing = false; revealed = false;
    $('role').innerHTML = ''; $('scene').innerHTML = '';
    D.roles.forEach(role => $('role').add(new Option(role, role)));
    D.scenes.forEach((scene, i) => $('scene').add(new Option(scene.title, i)));
    readScene();
    window.dispatchEvent(new Event('cue-script-changed'));
  }
  choice.onchange = () => switchScript(+choice.value);
  function invalidate() { candidate = null; $('import-add').disabled = true; }
  $('import-title').oninput = invalidate;
  $('import-text').oninput = () => { jsonCandidate = null; invalidate(); };
  $('import-file').onchange = async event => {
    const file = event.target.files[0]; if (!file) return;
    invalidate(); jsonCandidate = null;
    $('import-status').textContent = 'Bestand lezen…';
    try {
      $('import-title').value = file.name.replace(/\.(docx|txt|json)$/i, '').replace(/_/g, ' ');
      if (/\.docx$/i.test(file.name)) $('import-text').value = await window.cueDocxText(await file.arrayBuffer());
      else if (/\.json$/i.test(file.name)) {
        const json = JSON.parse(await file.text());
        jsonCandidate = window.cueValidateScript(json.data || json);
        if (json.title) $('import-title').value = json.title;
        $('import-text').value = jsonCandidate.scenes.map(scene => scene.title + '\n' + scene.cards.map(card => card.role + ': ' + card.text).join('\n')).join('\n\n');
      } else $('import-text').value = await file.text();
      $('import-status').textContent = 'Bestand ingelezen. Klik op “Controleer script” en bekijk de rollen en replieken.';
    } catch (error) { $('import-status').textContent = error.message; }
  };
  $('import-check').onclick = () => {
    invalidate();
    try {
      const title = $('import-title').value.trim();
      if (!title) throw new Error('Vul eerst een titel in.');
      const result = jsonCandidate ? { data: jsonCandidate, warnings: [] } : window.cueParseScriptText($('import-text').value, title);
      candidate = { id: 'script-' + Date.now(), title, data: result.data };
      const count = result.data.scenes.reduce((n, scene) => n + scene.cards.length, 0);
      $('import-status').textContent = `${result.data.roles.length} rollen, ${result.data.scenes.length} scènes, ${count} replieken. Controleer de indeling hieronder.`;
      $('import-preview').textContent = 'ROLLEN: ' + result.data.roles.join(', ') + '\n\n' + result.warnings.join('\n') + '\n\n' + result.data.scenes.map(scene => scene.title + '\n' + scene.cards.map(card => card.role + ': ' + card.text).join('\n')).join('\n\n');
      $('import-add').disabled = false;
    } catch (error) { $('import-status').textContent = error.message; $('import-preview').textContent = ''; }
  };
  $('import-add').onclick = () => {
    if (!candidate) return;
    CUE_LIBRARY.scripts.push(candidate); window.cueLibraryDirty = true;
    fillChoices(); choice.value = String(CUE_LIBRARY.scripts.length - 1); switchScript(+choice.value);
    invalidate();
    $('import-status').textContent = 'Script toegevoegd. Download index.html met alle scripts om het te bewaren en daarna op GitHub te publiceren.';
  };
  $('library-download').onclick = () => $('edit-download').click();
  $('script-json').onclick = () => {
    const script = CUE_LIBRARY.scripts[+choice.value];
    const url = URL.createObjectURL(new Blob([JSON.stringify(script, null, 2)], { type: 'application/json' }));
    const link = document.createElement('a'); link.href = url; link.download = script.title.replace(/[^\p{L}\p{N}_-]/gu, '_') + '.json'; link.click(); setTimeout(() => URL.revokeObjectURL(url), 10000);
  };
  window.addEventListener('beforeunload', event => { if (window.cueLibraryDirty) { event.preventDefault(); event.returnValue = ''; } });
  fillChoices();
})();
