t aankomen. Hij belde vanuit zijn auto. Dus doe allemaal jullie best!"},{"role":"KITTY","text":"Ik ga meteen een paar kippetjes bereiden! Of hazen, ik laat me verrassen. (loopt naar de keuken)"},{"role":"PIET","text":"Ik sleep eerst deze troep even naar boven! (Meneer Chateau is al weer verdwenen. Piet pakt een koffer en gooit die met een grote zwaai de trap op en doet dat ook met rest van de bagage en gaat vervolgens zelf de trap op)"},{"role":"GRIETJE","text":"Welke kamers krijgen de gasten? Dan maak ik ze nog even extra op orde!"},{"role":"EMMA","text":"Doe dan maar kamer 13 en 15. (waarna Grietjebiets uit de bezemkast pakt en de trap opgaat)"},{"role":"FRITS","text":"(leunt op de grasmachine) Waar was ik eigenlijk mee bezig?"},{"role":"SIMONE","text":"Wat denk je zelf?"},{"role":"FRITS","text":"Geen idee, echt niet. (Simone knikt naar de  grasmachine maar Frits reageert niet begrijpend. Dan wijst Simone nadrukkelijk naar de grasmachine.Traag kijkt Frits naar de  grasmachine en heel langzaam daagt het) Aaaah! Ik weet het weer. Het hoogpolige tapijt moet even wat ingekort worden! (Rijdt met grasmachine restaurant in)"},{"role":"SIMONE","text":"Als je dat maar laat!"},{"role":"EMMA","text":"(zucht) Dat wordt nog een zware dobber om een goede indruk te maken op die man. Aan mij zal het natuurlijk niet liggen, maar dat personeel wat we hebben...."},{"role":"SIMONE","text":"Ja, maar we moeten ons best doen. Ons personeel moet niet op straat komen te staan. Neem nu Piet, die komt met moeite toch nog steeds de trap op met de koffers, maar als hi thuis komt te zitten, dan kwijnt hij zeker weg."},{"role":"EMMA","text":"Ja, die beste Frits, komt wat onnozel over, die komt ook nergens anders weer aan de bak."},{"role":"SIMONE","text":"'t Is niet alleen dat hij onnozel overkomt. Hij is het ook. Dan hebben we nog Grietje."},{"role":"EMMA","text":"Ja, Grietje, schat van een meid, maar wel wat onhandig en gestrest. Ze heeft nog meer last van alle stress dan ik! En dan hebben we Kitty nog. Een lieve vrouw,  maar ja, met haar kookkunsten zal ze ook niet snel ergens anders aan de bak komen."},{"role":"SIMONE","text":"O wacht! Ik zag iemand voor het raam langs lopen, dat zal hem zijn! Snel, we moeten paraat staan! (Simone en Emma fatsoeneren hun kleding en haar en gaan snel achter de balie staan. De voordeur gaat open én buurvrouw Gerrie komt binnen)"}]},{"title":"Eerste bedrijf — Scène 4","cards":[{"role":"EMMA","text":"(teleurgesteld) Ach nee, het is de buurvrouw maar."},{"role":"SIMONE","text":"O nee, wat heeft die nu weer te zeuren?"},{"role":"GERRIE","text":"Ik heb een klacht!"},{"role":"EMMA","text":"Alweer? Je hebt elke dag een klacht."},{"role":"GERRIE","text":"Nu moet je niet zo klagen Emma. Ik heb dus een klacht. Die taxi die zojuist een klant bij jullie heeft afgezet is tijdens het keren door mijn gazon gereden. Een heel diep spoor dwars door mijn gazon!"},{"role":"SIMONE","text":"En nu moet je weer de gebruikelijke schadevergoeding hebben?"},{"role":"GERRIE","text":"Precies! (Simone slaagt een zucht en loopt naar de bar. Gerrie loopt er ook heen en gaat op een kruk zitten. Simone schenkt haar een borrel in)"},{"role":"SIMONE","text":"Hier is de schadevergoeding."},{"role":"GERRIE","text":"Eéntje? ’t Is een diep spoor hoor! En je komt ook maar even langs om het gazon weer vlak te maken."},{"role":"SIMONE","text":"Ik stuur Frits wel even."},{"role":"GERRIE","text":"Die Frits van jullie? Alsjeblieft niet! Dan kan Ik daarna hier weer direct naar toe voor nog meer schadevergoeding.\n(Hans Groothof en Lola komen via de voordeur binnen.Simone en Emma staan achter de balie)"},{"role":"LOLA","text":"Dus dit is nu de plek waar jij je zinnen op hebt gezet?"},{"role":"HANS","text":"Precies! De perfecte plek voor mijn plannen."},{"role":"LOLA","text":"En mijn plannen... voor vannacht!"},{"role":"HANS","text":"Jajaja!"},{"role":"SIMONE","text":"Welkom welkom, in ons hotel!"},{"role":"HANS","text":"U bent de eigenaar, die mij zowat smeekte om dit hotel te kopen? (geven elkaar een hand) Hans Groothof."},{"role":"SIMONE","text":"Och, smeekte...? (smekend) O, ik hoop toch zo dat we er uit komen! Deze kans moet u echt niet aan u voorbij laten gaan! En u had mij inderdaad aan de telefoon en dit is mijn zus Emma Bovendijk."},{"role":"HANS","text":"Dit is mijn secretaresse mejuffrouw Titulaar. (Simone schudt Lola de hand)"},{"role":"GERRIE","text":"Zo dat is een rare naam."},{"role":"EMMA","text":"Dat is onze buurvrouw, maar let maar niet op haar. Zij gaat net weg! ,"},{"role":"GERRIE","text":"O ja?"},{"role":"EMMA","text":"Ja!"},{"role":"HANS","text":"Buurvrouw?"},{"role":"SIMONE","text":"Enh... ja... maar woont kilometers verderop! Zult u nooit last van hebben."},{"role":"GERRIE","text":"Kilometers???? (Emma werkt Gerrie via de voordeur uit) Niet zo hard aan mijn blouse trekken, straks scheurt hij!"},{"role":"EMMA","text":"Nee, kijk wel uit. Dan wil je weer schadevergoeding!"},{"role":"SIMONE","text":"(Tegen Hans) Welkom op deze prachtige plek. Een oase van rust."},{"role":"LOLA","text":"Het is inderdaad een dooie boel..."},{"role":"EMMA","text":"Wij hopen dat u beiden een prettig verblijft mag hebben in dit schitterende hotel. We hebben de twee mooiste kamers voor u in gereedheid gebracht."},{"role":"SIMONE","text":"Maar ook de andere kamers zijn Natuurlijk schitterend!!"},{"role":"LOLA","text":"Kamers? (vragend aan Hans)"},{"role":"HANS","text":"Eh.. he he, doet u ons maar één kamer. Dat is wel ze voordelig ... Nieuwe bezuinigingsmaatregelen van het bedrijf, ziet u... economische  crisis, etc. etc. weet u wel."},{"role":"EMMA","text":"Oh... een kamer dus...hmm"},{"role":"SIMONE","text":"Ik zal onze piccolo Pedro even roepen."},{"role":"EMMA","text":"Pedro? ;"},{"role":"SIMONE","text":"(met hand tegen de mond, omdat het alleen voor Emma bestemd is) Piet natuurlijk! Pedro klinkt beter."},{"role":"EMMA","text":"Oh, natuurlijk! Pedro! (Simone pakt de lucht Hoorn en geef een behoorlijke stoot, waardoor Hans en Lola in elkaar krimpen) Wilt u trouwens ook nog gebruik maken van ons voortreffelijke restaurant vanavond? (Piet komt ondertussen van de trap af gehobbeld.. Beneden aangekomen sjort hij zijn inmiddels half atgezakte broek weeromhoog)"},{"role":"PIET","text":"(Tegen Simone) Jullie moeten me niet zoveel laten sjouwen. Daar val ik veel te veel van af...."},{"role":"HANS","text":"En wat staat er op de menukaart?"},{"role":"EMMA","text":"We hebben vanavond lopend buffet, met waarschijnlijk kipproducten. En dan eigenlijk alleen maar kipproducten."},{"role":"PIET","text":"Smaken allemaal het zelfde, altijd aangebrand. Daar zakt je broek gewoon vanaf."},{"role":"SIMONE","text":"Pedro! ."},{"role":"PIET","text":"Wie? (kijkt verbaasd om zich heen)"},{"role":"SIMONE","text":"Pedro, dit is meneer Groothof. Hij heeft belangstelling om dit hotel te kopen!"},{"role":"PIET","text":"Ah... heel goed restaurant! Mensen komen van heinde en ver! Heerlijke kip, zoals je het nergens anders proef. En daar is geen woord van gelogen!"},{"role":"HANS","text":"Dan willen we graag voor twee personen reserveren voor vanavond."},{"role":"EMMA","text":"Ik geef het meteen door aan onze chef-kok. Pedro, wil je deze mensen even naar kamer 13 brengen?"},{"role":"PIET","text":"Pedro? O ja Pedro. Ah, u bent mevrouw Groothof? (tegen Lola)"},{"role":"HANS","text":"Nee, dit is mijn secretaresse mejuffrouw Titulaar"},{"role":"PIET","text":"(Met een knipoog) Mejuffrouw? Dus u bent nog in de markt?"},{"role":"EMMA","text":"Piet!!! ;"},{"role":"PIET","text":"Welke Piet? Ken ik die? (Piet probeert ondertussen alle koffers op te pakken, maar dat lukt niet echt. Ondertussen’ worstelt hij ook nog eens met zijn broek)."},{"role":"EMMA","text":"(tegen Simone) Pak ook een paar koffers, anders gaat dat straks weer helemaal fout! En geef hem een riem of zo!"},{"role":"SIMONE","text":"Dat is een goed idee, dan kan hij daarmee de koffers bij elkaar binden. (Simone pakt ook een paar koffers en verdwijnt samen met Piet, Hans en Lola van het podium via de trap. Emma loopt naar de keuken en doet de deur open)"}]},{"title":"Eerste bedrijf — Scène 5","cards":[{"role":"EMMA","text":"Kitty vanavond hebben we twee gasten in het  restaurant en daar moet je goed je best voor doen! (Kitty komt op via de keukendeur)"},{"role":"KITTY","text":"In de diepvries zat niets meer, wat enigszins als vlees herkenbaar was. Dus ik had al een paar verse kippen gehaald!"},{"role":"EMMA","text":"Mooi!"},{"role":"KITTY","text":"Eh... ja, maar het was mooier geweest als ze niet waren ontsnapt."},{"role":"EMMA","text":"Ontsnapt!"},{"role":"KITTY","text":"Ja, zojuist zaten ze nog in het hokje hier in de keuken, maar die zat waarschijnlijk niet goed dicht."},{"role":"EMMA","text":"En hoeveel waren het er?"},{"role":"KITTY","text":"Een stuk of twaalf."},{"role":"EMMA","text":"O nee, en die lopen nu overal rond?"},{"role":"KITTY","text":"Niet allemaal hoor..."},{"role":"EMMA","text":"Gelukkig."},{"role":"KITTY","text":"...sommige fladeren. (Frits komt via het restaurant met de grasmaaier het podium op)"},{"role":"FRITS","text":"Ik weet niet wat er met die grasmaaier is, Maar als ik hem aanzet komen er allemaal kippenveren uit."},{"role":"KITTY","text":"Ah! Dan weet het wel (Kitty pakt de grasopvangbak van de grasmaaler en kijkt erin. Ondertussen komen ma er wat kippenveren uit als hij in de bak graait) Nou, we kunnen vanavond gelukkig de gasten kip voorzetten. Hier zit er één in Tenminste, wat er van over is. (Meneer Chateau komt van de trap af)"},{"role":"MENEER CHATEAU","text":"Nu moet het niet gekker worden! Er loopt een kip door mijn kamer!"},{"role":"KITTY","text":"Ah! Nog één! U heeft dus al even kennis gemaakt met het avondeten. Zet die grasmachine maar in de keuken Frits! Dan zal ik nog één ophalen. (Kitty pakt een groot hakmes en gaat de trap op. Frits gaat met de grasmachine de keuken in)"},{"role":"MENEER CHATEAU","text":"Wat is dit voor een aller vreselijkst hotel met al dat ongedierte wat hier rond loopt!"},{"role":"EMMA","text":"Rustig maar meneer Chateau. U krijgt een borrel van het huis en ondertussen wordt het kippenprobleem opgelost. Het zijn maar kippen, en feitelijk is dat niet ongedierte. Eigenlijk meer een soort huisdier."},{"role":"MENEER CHATEAU","text":"En die eet u ook altijd op? (Emma gaat. achter de bar en schenkt meneer Chateau, die op een barkruk plaats neemt, een borrel in)"},{"role":"EMMA","text":"Een paar kippetjes, dat valt eigenlijk nog best mee. Vorig jaar waren het hier allemaal ratten, kijk, en dat is nu wel ongedierte en die eten we zeker hier niet op! Dus dit valt best mee."},{"role":"MENEER CHATEAU","text":"Ratten!?"},{"role":"EMMA","text":"Ja, zo groot als katten. Bijna niet dood te slaan met de bezem."},{"role":"MENEER CHATEAU","text":"En zijn ze nu wel weg!"},{"role":"EMMA","text":"Ja hoor, we hebben gewoon even een nacht lang het gas van het gasfornuis aan laten staan en zijn toen weggegaan. De volgende dag lagen ze allemaal op apegapen. (De voordeur gaat open en Laura en Nel komen binnen)"}]},{"title":"Eerste bedrijf — Scène 6","cards":[{"role":"LAURA","text":"Wat een alleraardigst hotelletje Nel."},{"role":"NEL","text":"Nou, dat dacht ik ook."},{"role":"LAURA","text":"Jammer dat de wintersportvakantie niet door gaat."},{"role":"NEL","text":"Nee, er ligt dan ook helemaal geen sneeuw in de Alpen. Maar dan is dit toch ook leuk?"},{"role":"LAURA","text":"Zeker! Een lekker relaxed weekje in een hotelletje in de bossen. En wat had ik anders ook thuis gemoeten? Hans is er ook niet, weer eens op zakenreis."},{"role":"NEL","text":"Die man van jou is wel vaak op zakenreis hoor. (Emma loopt naar de dames toe)"},{"role":"EMMA","text":"Dag dames, kan ik u helpen?"},{"role":"NEL","text":"Ja, ik had hier een kamer voor ons gereserveerd."},{"role":"EMMA","text":"Ik zal even kijken. (Emma loopt achter de balie en kijkt in het boek.Ondertussen komt Kitty met een jutezak met  inhoud en een bebloed hakmes de trap af. Meneer Chateau  kijkt met stomme verbazing naar het tafereel)"},{"role":"KITTY","text":"(tegen meneer Chateau) U vanavond ook een kippetje?"},{"role":"MENEER CHATEAU","text":"Maar.. dat.. eh..."},{"role":"KITTY","text":"Geef het maar toe, u heeft hem zelf gezien, het was een mooi vet kippetje. Smullen toch!"},{"role":"EMMA","text":"Ja, hier zie ik het al staan. Twee personen. Wilt u ook gebruik maken vanavond van het lopend buffet in ons restaurant?"},{"role":"LAURA","text":"Dat is goed, reserveert u maar."},{"role":"KITTY","text":"Potverdorie, dan moet ik snel op zoek naar nog een kip!\n(Kitty gaat vlug de keuken in: Ondertussen heeft Emma de luchthoorn gepakt en geeft een flinke stoot. Meneer Chateau gooit zijn borrel van de schrik de lucht in)"},{"role":"NEL","text":"Wat doet u nu!?"},{"role":"LAURA","text":"We komen hier voor de rust!"},{"role":"EMMA","text":"Onze piccolo is een beetje doof."},{"role":"MENEER CHATEAU","text":"Dat niet alleen hopelijk hebben jullie niets breekbaars in de koffers.\n(Piet komt van de trap gehobbeld)"},{"role":"PIET","text":"Nog meer koffers?! Daar zakt je broek toch vanaf!  (Sjort weer zijn broek omhoog)"},{"role":"EMMA","text":"Ik heb voor u een prachtige kamer, breng jij ze even naar kamer 15, Pedro? (Piet loopt half de trap op, maar komt onhandig achterste voren weer stuntelend de trap af. Vervolgens komen Simone en Grietje via de trap het toneel op)"},{"role":"SIMONE","text":"Wat heb je nu weer gedaan! We zeiden nog zo, we moeten een goede indruk maken op die mensen!"},{"role":"GRIETJE","text":"Ja, dat weet ik, maar ik had echt die badkamer schoongemaakt!"},{"role":"SIMONE","text":"Hoe kan het dan dat die badkamer onder de kippenstront zit!"},{"role":"GRIETJE","text":"(gestrest) Hoe moet ik dat weten, dat heb ik niet gedaan. Ik ben geen kip! Ik pak meteen een sopje en maak die badkamer schoon. (Piet:is inmiddels met de dames de trap op gelopen en Grietje pakt schoonmaakspullen uit de kast en gaat met een emmer de keuken in. Kitty en Frits komen via de keuken op. Frits heeft een hooivork in de hand)"},{"role":"KITTY","text":"Loop het hele hotel maar even door. Ik moet er nog één hebben."},{"role":"FRITS","text":"Ik probeer ze wel te lokken met een lokroep. (Kitty verdwijnt,weer in de keuken en Frits, ondertussen tokkend als een pauw, loopt op jacht met de hooivork over het podium en loopt het restaurant in. Grietje komt met een emmer vol sop uit de keuken en loopt richting de trap. Frits verdwijnt via de voordeur van het podium, al kakelend)"}]},{"title":"Eerste bedrijf — Scène 7","cards":[{"role":"MENEER CHATEAU","text":"Dames, Uw hotel is één grote ramp!"},{"role":"EMMA","text":"Ach, dat valt wel mee. Wist u trouwens dat er een koper op dit moment voor is?"},{"role":"MENEER CHATEAU","text":"U raakt het aan de straatstenen nooit kwit!"},{"role":"SIMONE","text":"We staan goed bekend hoor."},{"role":"MENEER CHATEAU","text":"Binnenkort niet meer!"},{"role":"EMMA","text":"Hoe bedoelt u?"},{"role":"MENEER CHATEAU","text":"De reden van mijn bezoek is om een recensie te schrijven voor de nieuwe uitgave van Hotels in Nederland, een toonaangevende gids voor de doorgewinterde hotelbezoeker. En ik kan u verzekeren dat de recensie die ik ga schrijven u geen klandizie op zal leveren, integendeel! Ik ben nog nooit in zo’n zooitje terecht gekomen!"},{"role":"EMMA","text":"O jee! (Dan komen Hans en Lola de trap afgestormd)"},{"role":"GRIETJE","text":"Sorry meneer, u kwam ook zo hard die trap af."},{"role":"HANS","text":"(negeert Grietje en tegen Simone) Wat doet mijn vrouw hier!"},{"role":"SIMONE","text":"Uw vrouw?"},{"role":"HANS","text":"Ja, ik zag haar net op de gang met haar vriendin Nel de kamer naast ons ingaan! De kamer naast ons nota bene!"},{"role":"LOLA","text":"Weet u wel hoe lastig dat is voor vannacht!"},{"role":"SIMONE","text":"Enh.. tja... ik heb geen idee waarom ze hier is. Wij wisten ook niet dat het uw vrouw was... (Grietje gaat ondertussen de keuken weer. Frits komt via de deur van het restaurant het podium weer op met een (nep)kip gespietst aan de hooivork)"},{"role":"FRITS","text":"Ik heb er weer één hoor! (De der van de keuken gaat open en Kitty kijkt om de hoek)"},{"role":"KITTY","text":"Het bikken staat zo op tafel!!!! (wijst naar de deur van het restaurant)"}]},{"title":"Eerste bedrijf — Scène 8","cards":[{"role":"HANS","text":"Ik hoor haar stem! Ze komen de trap af! Wij gaan alvast.(Hans pakt Lola beet en sleurt haairhet restaurant in)"},{"role":"FRITS","text":"Kijk Kitty, ik heb er weer ééntje!"},{"role":"KITTY","text":"Mooi, kom maar snel meer naar de keuken. (Frits loopt de keuken in en Kitty trekt de deur achter hun dicht)"},{"role":"EMMA","text":"Hmm, maar zijn vrouw en de vriendin hebben ook gereserveerd."},{"role":"SIMONE","text":"Dan moeten we voorkomen dat ze elkaar zien. hotel! We koeten die Groothof helpen, des te eerder koopt hij het hotel!"},{"role":"EMMA","text":"Daar heb je een punt. (Grietje komt met een emmer sop uit de keuken)"},{"role":"MENEER CHATEAU","text":"Wat stinkt het daar branderig in die keuken!"},{"role":"SIMONE","text":"Ja, specialiteit van de kok."},{"role":"EMMA","text":"(Fluistert tegen Simone) Kijk nu uit wat je zegt! Het is een recensent!"},{"role":"MENEER CHATEAU","text":"Ik zal mij vervoegen in het restaurant. Ik heb mijn twijfels bij de kwaliteiten van de Chef, maar maan haar alstublieft aan om eens boven haar eigen kunnen uit te stijgen. Misschien wordt de recensie dan iets minder vernietigend! (Grietje gaat de trap op. Meneer Chateau loopt het restaurant in ondertussen komen Laura en Nel via de trap het podium op. Laura zit nu onder de sop en Grietje komt weer met een lege emmer er achter aan)"},{"role":"GRIETJE","text":"Sorry sorry, ’t Is er ook zo krap op die trap."},{"role":"LAURA","text":"Kun je niet uitkijken!"},{"role":"NEL","text":"Kunnen wij alvast in het restaurant plaats nemen?"},{"role":"SIMONE","text":"Eh... Het restaurant is gesloten. (Kitty komt met een schaal uit de keuken en loopt naar de deur van het restaurant. Grietje gaat weer de keuken in)"},{"role":"KITTY","text":"Heerlijke kip, specialiteit van het huis! (Kitty verdwijnt door de deur van het restaurant)"},{"role":"LAURA","text":"Eerst vraagt die mevrouw (wijst naar Emma) of we willen reserveren in het restaurant, dan zegt u dat het gesloten is en vervolgens loopt de kok met schalen met eten er naar toe. (Op dat moment komt buurvrouw Gerrie binnen)"},{"role":"EMMA","text":"Wat moet u hier nu weer?"},{"role":"GERRIE","text":"Ja ho eens even! Ik heb een deal met die kok van jullie gesloten. Jullie hoeven die 12 kippen die hij gehaald heeft niet te betalen, als ik hier een paar keer kan eten."},{"role":"NEL","text":"Dan heeft u pech, het restaurant is gesloten."},{"role":"GERRIE","text":"Dat zullen we nog wel eens zien! (Gerrie loopt naar de deur van het restaurant en kijkt naar binnen) Hier zitten anders wel allemaal mensen achter hun bordjes! Niks gesloten! Ik ga hier ook bikken! (Gerrie loopt het restaurant in. Ook Nel’en Laura lopen nu naar de deur.Op dat moment komt meneer Chateau verontwaardigt weer uit het restaurant)"},{"role":"MENEER CHATEAU","text":"Dat lopende buffet met kipproducten is wel erg letterlijk!"},{"role":"SIMONE","text":"Hoe bedoelt u?"},{"role":"MENEER CHATEAU","text":"D’r lopen allemaal kippen daar rond! U denkt toch niet dat een man als ik daar mijn diner ga nuttigen! Ik zoek wel een restaurant in het dorp op!"},{"role":"NEL","text":"Een restaurant in het dorp, zou dat beter zijn?"},{"role":"MENEER CHATEAU","text":"Rekent u daar maar wel op. Het smerigste\nfrietkot is al snel beter dan dit hier! Hebben de dames misschien belangstelling om een vorkje mee te prikken."},{"role":"LAURA","text":"Nou, dat is heel attent van u. Dat lijkt mij wel wat, wat jou"},{"role":"NEL","text":"Met zo’n charmante man altijd! Ook al belanden we desnoods in een smerige frietkot. (Meneer Chateau neemt aan beide zijden een dame in de arm en het drietal vertrekt via de voordeur. Grietjie komt met een emmer sop uit de , keuken en loopt voorzichtig kijkend naar de trap;.)"},{"role":"SIMONE","text":"Die weten niet dat er in het dorp alleen maar Joco’s kinderpannenkoekenpaleis is! Maar goed, wij hebben nu tenminste even rust in de tent."},{"role":"EMMA","text":"Gelukkig wel ja, hopelijk kunnen we iedereen een beetje tevreden houden de komende dagen en het hotel verkopen. Dit hou ik geen jaren meer vol!"},{"role":"GRIETJE","text":"(Angstig kijkend richting de trap) Is er nog iemand boven? Is het vertrouwd dat ik de trap op ga?\nDOEK GAAT DICHT"}]},{"title":"TWEEDE BEDRIJF — Scène 9","cards":[{"role":"GERRIE","text":"Ik klaag dit hotel aan!"},{"role":"SIMONE","text":"Wat een verrassing... Wat nu weer buurvrouw?"},{"role":"GERRIE","text":"Salmonella vergiftiging! Ik heb hier gisteren die kip gehad. En vanmorgen was ik zo beroerd als weet niet wat en heb de pot tot boven toe vol gescheten!"},{"role":"SIMONE","text":"De andere gasten heb ik niet horen klagen. (richting Hans) Hebben jullie last van het eten gehad van gisteren?"},{"role":"HANS","text":"Ik heb bijna geen hap van de kip gehad, ik kon de vork er niet in krijgen en volgens mij is er een stuk van één van mijn tanden afgeknapt tijdens het eten."},{"role":"SIMONE","text":"Oh, onze excuses voor dit ongemak. Wij zullen dit graag goed maken en bieden u vanavond een gratis diner aan!"},{"role":"HANS","text":"Moet dat? Doe mij eerst maar een kopje koftie."},{"role":"SIMONE","text":"(inmiddels weer alle aandacht bij Gerrie) Dus ziek van de zieke kip?"},{"role":"GERRIE","text":"Inderdaad, beroerd! Ik klaag jullie aan! En dit keer neem ik geen genoegen met een glaasje van je bocht. Nee, dit gaat je smakken geld kosten!"},{"role":"SIMONE","text":"Dan is dat helaas maar zo. Maar dan verhaal ik die\nkosten wel weer op degene die ons die zieke kippen heeft geleverd."},{"role":"GERRIE","text":"Meteen doen... eh... ach vent!"},{"role":"SIMONE","text":"Een kop koffie dus!"},{"role":"HANS","text":"Inderdaad, daar ben ik wel aan toe."},{"role":"SIMONE","text":"Komt er aan, meneer. (Gerrie loopt kwaad de voordeur weer uit: Achter de voordeur komt zij “buiten” Laura en Nel, tegen, Simone loopt de keuken in);"},{"role":"GERRIE","text":"Dag dames!"},{"role":"LAURA EN NEL","text":"Dag mevrouw"},{"role":"GERRIE","text":"En hoe was het eten gisteren?"},{"role":"NEL","text":"Bij Joco’s kinderpannenkoekenpaleis bedoelt u? Ja, heerlijk"},{"role":"LAURA","text":"We kregen allemaal ook nog een mooie kleurplaat mee."},{"role":"GERRIE","text":"Dan kan ik daar dus de volgende keer beter heen gaan."},{"role":"NEL","text":"Ja, echt een aanrader, vooral het kinderijsje achteraf. (Ze blijven nog even met elkaar praten, maar dit is alleen te zien en niet te horen voor publiek) ;"},{"role":"HANS","text":"O nee, mijn vrouw! (Hans 'staat snel op en wil de trap oprennen. Echter als hij bijna van het podium is verdwenen komt hij achterste voren net zo snel weer terug, gevolgd door een stapel beddengoed dat gedragen wordt door Grietje. Door\nde hele actie valt al het beddengoed uit Grietje haar handen en beland op Hans en op de vioer)"},{"role":"GRIETJE","text":"Sorry meneer, maar ik zag u niet aankomen. ’t Is een grote stapel. (Grietje pakt het wasgoed op en loopt er mee het restaurant in. In paniek rent Hans weer naar het zithoekje, pakt een krant en kruipt er achter. Nel en Laura komen op via de voordeur. Gerrie loopt weg)"},{"role":"LAURA","text":"En het gezelschap gisteren aan tafel was natuurlijk ook leuk."},{"role":"NEL","text":"Inderdaad, een leuke man, die meneer Chateau. Zo charmant, zo kom je ze tegenwoordig niet meer zo vaak tegen,"},{"role":"LAURA","text":"O, kijk (wijst naar Hans) daar zit hij! Als ik jou was, zou ik er maar eens wat meer werk van maken."},{"role":"NEL","text":"Meer werk van maken?"},{"role":"LAURA","text":"Ja, die man is net wat voor jou."},{"role":"NEL","text":"Denk je dat hij geschikt is voor mij?"},{"role":"LAURA","text":"Tuurlijk, en je moet ook niet te kritisch zijn. Als ze nog maar ademen, dan moet je er op af! Als je nog wat wilt, moet je er nu bij zijn. Je eierstokken zijn nu nog niet verschrompeld."},{"role":"NEL","text":"Ja, ik weet het niet hoor. Ik ben daar zo slecht in. Wordt er gewoon nerveus van. Ik tril nu al helemaal van top tot teen."},{"role":"LAURA","text":"Ach, stel je niet aan. Zo moeilijk is het niet. Je loopt gewoon naar hem toe en begint een praatje over dat je zo heerlijk hebt gegeten gisteren bij Joco’s kinderpannenkoekenpaleis en dat het je leuk lijkt nog eens met hem er heen te gaan."},{"role":"NEL","text":"Was ook leuk he, vooral op het laatst in de ballenbak!"},{"role":"LAURA","text":"Misschien wil hij nog wel weer een keer met je in de ballenbak. (geeft Nel’een duw naar voren) Nou meid, succes! (Laura loopt:de trap op. Nel loopt zenuwachtig richting Hans, Hans heeft door dat Nel op hem af komt en heeft ook last van zenuwen. Zijn krant trilt er van),"},{"role":"NEL","text":"Hahahallo... Was gisteren gezellig he?"},{"role":"HANS","text":"Nou... (blijft achter de krant zitten)"},{"role":"NEL","text":"Misschien overval ik je een beetje..."},{"role":"HANS","text":"Ik weet het wel zeker!"},{"role":"NEL","text":"Maar ik zat te denken..."},{"role":"HANS","text":"Moet je niet doen!"},{"role":"NEL","text":"...vind je... eh... het leuk, om vanavond... eh... nog eens te gaan?"},{"role":"HANS","text":"(Doet de krant naar beneden) Dat moet maar niet! (Nel schrikt zich rot en rent gillend de trap op. ook Hans raakt in paniek, springt open vliegt de bezemkast in. Simone komt het podium via de  restaurantdeur op met een kop koffie in de hand)"}]},{"title":"TWEEDE BEDRIJF — Scène 10","cards":[{"role":"SIMONE","text":"Nou, ook mooi. Wil ie een kop koffie en dan is hij er niet meer. (Meneer Chateau komt via de voordeur het podium op)"},{"role":"MENEER CHATEAU","text":"(vrolijk) Ah, ik ruik een heerlijk bakje koffie. Dat lijkt mij ook wel wat."},{"role":"SIMONE","text":"U mag deze wel hebben hoor. Hij was voor iemand anders, maar die is er schijnbaar vandoor. (Meneer Chateau gaat in het zithoekje zitten en pakt de krant en neuriet een vrolijk deuntje. Simone zet de koffie voor hem neer) U bent ook\nIn een vrolijke bui. Een beter humeur dan gisteren."},{"role":"MENEER CHATEAU","text":"Maar toen was ik ook nog niet met twee van die gezellige dames uit eten geweest!"},{"role":"SIMONE","text":"Met twee vrouwen? Tja, daar zou ik ook wel vrolijk van worden. (Simone loopt weer achter de bar en gaat glazen poetsen. Zo nu en dan spuugt zij eens in de glazen en gaat dan door met het poetsen. Nel en Laura komen de trap af)"},{"role":"NEL","text":"Laura, ik weet het zeker! Dat was Hans!"},{"role":"LAURA","text":"Wat klets je nu, Nel. Hans is op zakenreis, dat kan helemaal niet. Voor zaken hoeft hij echt niet in zo’n afgelegen hotel te zijn."},{"role":"NEL","text":"Nou, kijk dan zelf! Daar zit ie! (Wijst naar meneer Chateau, die nu achter de krant zit)."},{"role":"LAURA","text":"Dat is meneer Chateau."},{"role":"MENEER CHATEAU","text":"(doet de krant naar beneden) Hoorde ik daar mijn naam?"},{"role":"LAURA","text":"Zie je wel."},{"role":"NEL","text":"k word gek!"},{"role":"MENEER CHATEAU","text":"Hopelijk dan op mij (met een vette knipoog naar het publiek. Grietje komt vanuit de keuken op)"},{"role":"GRIETJE","text":"Kan ik op uw kamer terecht voor het schoonmaken?"},{"role":"MENEER CHATEAU","text":"Ja hoor."},{"role":"LAURA","text":"Op onze kamer kunt u ook terecht hoor."},{"role":"GRIETJE","text":"Is het er daar nu al weer vies? Vorige week heb ik het\nnet schoongemaakt."},{"role":"LAURA","text":"Maar dat moet toch elke dag grondig gebeuren?"},{"role":"GRIETJE","text":"Eén keer per week met de hoge drukspuit er doorheen\nis toch meer dan afdoende?"},{"role":"NEL","text":"(tegen meneer Chateau) Aparte sponsen hebben ze hier in de badkamer hé? Hij leek wel van allemaal veertjes."},{"role":"MENEER CHATEAU","text":"Dan ben ik bang dat het niet een spons"},{"role":"NEL","text":"Ik had mijn lenzen dan ook niet in. Maar ik had wel het idee dat het probeerde weg te fladderen... (Grietje doet de deur  van de kast open en schrikt zich rot van Hans die er in staat en siaat’snel de deur weer dicht)"},{"role":"GRIETJE","text":"Een kekekeke...."},{"role":"MENEER CHATEAU","text":"Ook al weer een kip in de kast dus! Tjongejonge, wat een hotel. Laten wij maar snel een frisse neus gaan halen in de bossen, wat u dames? Heerlijk genieten van de natuur."},{"role":"NEL","text":"O ja, heerlijk genieten van de natuur!"},{"role":"SIMONE","text":"Een kip valt ook onder natuur. (Meneer Chateau loopt met de dames de voordeur uit en Simone loopt naar Grietje toe die nog steeds verstijft van schrik voor de deur staat)"},{"role":"GRIETJE","text":"Een kekeke..."},{"role":"SIMONE","text":"Ja, een kip in de kast! Ik pak hem wel even!"},{"role":"GRIETJE","text":"Nee! (Simone trekt met een zwaai de deur open en  springt in de kast Ondertussen vliegen de emmers en bezems uit de kast het toneel op tijdens een worsteling in de  kast) Niet een kekekip, maar een kekekerel! (Na een worsteling liggen'\nHans en Simone languit tussen de bezems en emmers op het podium)"},{"role":"SIMONE","text":"Verhip, wat een grote kip!"},{"role":"HANS","text":"Mens wat doe je nou! Blijf van mij af!"},{"role":"SIMONE","text":"Verhip, het is geen kip!"},{"role":"HANS","text":"Nee, natuurlijk niet! Ben je bijziend of zo?! Hou je handen eens thuis!"},{"role":"SIMONE","text":"Hou zelf je handen thuis! (Simone en Hans houden op te worstelen en liggen boven op elkaar uit te hijgen.. Ondertussen is Lola van de trap af gekomen) ."},{"role":"LOLA","text":"Hans, wat is hier allemaal aan de hand?"},{"role":"GRIETJE","text":"Oh, deze meneer is hier uit de kast gekomen."},{"role":"LOLA","text":"Uit de kast gekomen? Maar Hans? Hoe kan dat?"},{"role":"HANS","text":"(Niet begrijpend) Nou ja, gewoon, zij heeft mij er uit gehaald."},{"role":"LOLA","text":"(Tegen Simone) Dus het is jouw schuld! O Hans, ik weet niet of ik dit aan kan! HANS: Maar Lola! Waar heb je het nu over?"},{"role":"LOLA","text":"En al die wilde nachten dan? Terwijl je achteraf dus helemaal niet op mij hebt kunnen vallen! O Hans!"},{"role":"HANS","text":"Lola, je begrijpt het verkeerd. Ik zat in de kast en..."},{"role":"LOLA","text":"Ja, ik begrijp het juist heel goed! Nu ben je er uitgekomen. O, ik moet dit even verwerken! (Lola rent de voordeur uit, kwaad kijkt Hans  Grietje aan)"}]},{"title":"TWEEDE BEDRIJF — Scène 11","cards":[{"role":"GRIETJE","text":"Heb ik iets verkeerds gezegd?"},{"role":"HANS","text":"Uit de kast komen, dat is ook een uitdrukking!"},{"role":"GRIETJE","text":"0 ja?"},{"role":"HANS","text":"Ja! Voor mensen die er vooruitkomen dat ze homoseksueel zijn. Dan kom je uit de kast!"},{"role":"SIMONE","text":"(Springt terug) Bent u dat?"},{"role":"HANS","text":"Nee! En als ik het was,wat dan? En trouwens, waar blijft mijn koffie?"},{"role":"SIMONE","text":"O... ik zal meteen een kopje koffie voor u halen!"},{"role":"GRIETJE","text":"Maar u kwam toch uit de kast?"},{"role":"HANS","text":"Ja!... Nee! Ach, hou toch op!!! (Hans gaat zitten in de zithoek en pakt het krantje, Grietje ruimt de rommel uit de kast op per ongeluk krijgt Hans een paar klappen met een bezemsteel en scheurt de krant daardoor in tweeén, maar iGrietje heeft dat zelf niet door. Simone verdwijnt in de keuken. Via de voordeur komt Frits met een grote tak vol bladeren het podium op. Hans kijkt met open ogen naar het tafereel en ziet Frits met de tak in de keuken verdwijnen)"},{"role":"GRIETJE","text":"(die klaar is met de kast inpakken) Ik ga nu even naar boven om de kamers te doen, maar als er ook maar iets js waarmee ik u kan helpen, dan roept u maar."},{"role":"HANS","text":"Dan zul je lang wachten moeten! Je hebt me al meer dan genoeg “geholpen’! (Grietje loopt de trap op. Frits komt uit de keuken gevolgd door Kitty, die nu de tak in de handen heeft)"},{"role":"KITTY","text":"Dus dit is Peterselie?"},{"role":"FRITS","text":"Jaha. Dat moest je toch hebben uit de tuin?"},{"role":"KITTY","text":"Ja, voor het koken. Maar het is wel groot."},{"role":"FRITS","text":"Hoe dacht jij dan dat het er uit zag?"},{"role":"KITTY","text":"Weet ik veel, ik koop het altijd in potjes."},{"role":"FRITS","text":"Geloof mij nu maar, dit is peterselie. Zo ziet het eruit, voordat het in die potjes gaat. Of tenminste ongeveer zo ziet het eruit..."},{"role":"KITTY","text":"Als jij het zegt."},{"role":"FRITS","text":"Ja, ik zeg het. Ik weet echt wel waar ik over praat... meestal... (Kitty verdwijnt weer in de keuken en ook dit heeft Hans vol bewondering gade geslagen, Frits loopt richting  Hans):Dusssss... U heeft belangstelling voor het hotel?"},{"role":"HANS","text":"Ja, klopt."},{"role":"FRITS","text":"Maar wat ik vragen wilde... Doet u ook aan Kerstpakketten?"},{"role":"HANS","text":"Hu? Eh?"},{"role":"FRITS","text":"U weet wel, zo’n doos met mooie Kerstbedrukking. En daarin allemaal lekkers en nog een leuke kaars of Kersttafelkleed of..."},{"role":"HANS","text":"(Geirriteerd) Ja ja, ik weet wel wat een Kerstpakket is!"},{"role":"FRITS","text":"Ha, gelukkig. Dus dat is dan geregeld?"},{"role":"HANS","text":"Geregeld?"},{"role":"FRITS","text":"Mooi, daar ben ik blij mee. (draait zich om en loopt weg. Hans kijkt verbaasd Frits achterna, Simone komt via de . keukendeur het podium op met een kopje koffie)"},{"role":"SIMONE","text":"Een kopje koffie!"},{"role":"FRITS","text":"(Liep richting Simone) Ha lekker! (Frits pakt het kopje en loopt er al drinkend de voordeur mee uit, terwijl Hans en Simone hem stomverbaasd nakijken. Emma komt via de trap het podium op en rekt zich al gapend uit)"},{"role":"HANS","text":"U bent er ook niet vroeg bij."},{"role":"EMMA","text":"Niet vroeg? Het is nog maar elf uur, Normaal kom ik om twaalf uur uit bed! Zwaar beroep hoor, dat hotel runnen."},{"role":"SIMONE","text":"Meneer wil graag een kopje koffie."},{"role":"EMMA","text":"Ja, en? Je weet toch waar het staat?"},{"role":"SIMONE","text":"Ja, maar..."},{"role":"EMMA","text":"Nou, kom op! Haal even koffie, niet zo lui! (Simone vertrekt met een diepe zucht weer naar de keuken. Emma kijkt uit het raam) is dat niet uw vrouw die daar aan komt? (Hans kijkt ook verschrikt uit het raam wil net de trap oprennen. Echter komt Piet net de trap af met iets onder zijn jasje)"},{"role":"HANS","text":"0, nee. Moet ik toch weer die kast in! (Hans duikt weer snel de kast in en worstelt eerst nog even' met de bezems en emmers, voordat hij de deur dicht kan trekken. Laura komt via, de vooordeur binnen)"}]},{"title":"TWEEDE BEDRIJF — Scène 12","cards":[{"role":"LAURA","text":"Goedemorgen."},{"role":"EMMA","text":"Ja, ook een goedemorgen. Lekker aan de wandel geweest?"},{"role":"LAURA","text":"Maar een klein stukje hoor. Ik ben snel weer a teruggegaan. Zogenaamd omdat ik mijn tasje vergeten was. Maar dat was natuurlijk niet zo. Ik zie namelijk iets moois opbioeien tussen mijn vriendin Nel en die aardige meneer Chateau?"},{"role":"EMMA","text":"Aardig? Ik heb toch een heel ander beeld van die man hoor!... Zofveel goeds heeft hij niet voor ons in petto. (ondertussen komt Simone met een kopje koffie uit de keuken)"},{"role":"SIMONE","text":"Koffie! (en kijkt dan verbaasd rond, omdat zij Hans niet ziet)"},{"role":"LAURA","text":"Ah, lekker! Dat gaat er wel in na zon stevige... nou ja... korte wandeling. (Piet tikt voorzichtig Simone op de schouder als Simone de koffie voor Laura, die inmiddels in de zithoek is gaan zitten, neer zet. Emma is inmiddels achter de balie gaan hangen en gaat éen tijdschriftje lezen)"},{"role":"SIMONE","text":"Piet, wat is er? !"},{"role":"PIET","text":"Piet? (kijkt verward om zich heen)"},{"role":"SIMONE","text":"Jij bent toch Piet!"},{"role":"PIET","text":"O ja? Gisteren was ik nog Pedro?"},{"role":"SIMONE","text":"Ja, nou, dat doet er niet toe. Wat is er en wat heb je daar onder je jas?"},{"role":"PIET","text":"(op fluistertoon) k heb er weer één."},{"role":"SIMONE","text":"Een wat? Een maagzweer?"},{"role":"PIET","text":"Eh... ja ook... maar dit is iets anders...."},{"role":"SIMONE","text":"Nou, vertel op man, wat is het!"},{"role":"PIET","text":"Een kip."},{"role":"SIMONE","text":"O, een kip."},{"role":"PIET","text":"Ja, en ik heb hem verstopt, zodat die meneer die dit hotel kopen wil, en wiens naam ik nu niet durf te zeggen (knikt naar Laura) Zodat die meneer hem niet ziet en geen slechte of laat ik zeggen slechtere indruk van ons hotel zal krijgen."},{"role":"SIMONE","text":"Goed gedaan Piet!"},{"role":"PIET","text":"Pedro! Maar waar moet ik er mee heen? Naar de keuken?"},{"role":"SIMONE","text":"Nee, doe dat maar niet, dan laat Kitty ze weer net zo snel ontsnappen. (denkt even diep na) Weet je wat! Stop die kip maar in de kast!)"},{"role":"PIET","text":"In die kast?"},{"role":"SIMONE","text":"Ja, precies! Waar moet ie anders heen. En daar heeft niemand er last van! PIET: Goed idee! (Piet sluipt voorzichtig naar de kast met nog, steeds de jas dichtgedrukt. Op dat moment komt Lola vrolijk huppelend via de voordeur binnen. Als ze Laura ziet zitten geett ze een gilletje. Juist daardoor kijkt Laura op en duikt Lola achter de bar)"},{"role":"LAURA","text":"Daar duikt iemand achter jullie bar."},{"role":"EMMA","text":"(Kijkt op van haar tijdschriftje) Ja, inderdaad. (en gaat maar’snel weer verder met lezen.Simone weet zich geen houding te geven, omdat ze niet weet wat ze met de situatie aan moet. Ondertussen doet Piet snel de deur van de kast open goolt de kip er in en smijt de deur weer dicht en gaat snél met de rug tegen de deur staan. Uit de kast klinkt lawaai en Piet schrikt er van maar blijft stijf tegen de deur staan. Laura heeft er geen aandacht voor en loopt naar de bar)"},{"role":"SIMONE","text":"(Zenuwachtig) Eh... nog een bakje koffie?"},{"role":"LAURA","text":"Ja, graag, maar..."},{"role":"SIMONE","text":"Gaat u alvast dan maar zitten! Kijk daar, op die stoel!"},{"role":"LAURA","text":"Maar achter die bar... (Laura heeft haar aandacht bij de bar en even gaat snel de deur van de kast open en zien we Hans met een kip aan het worstelen. Piet ligt bijna onderste boven op het podium door de duw van de deur. Het lijkt net of de kip Hans bij de keel heeft en Hans uit alle macht probeert de kip van zijn keel te trekken. Net zo snel als hij even opkwam, verdwijnt hij al worstelend in de kast. Piet herstelt zich snel weer en gooit snel de deur weer dicht) Dus dat is hier normaal dat mensen achter de bar duiken?"},{"role":"SIMONE","text":"Eh... tja... normaal? Wat zal ik zeggen..."},{"role":"LAURA","text":"Daar wil ik het mijne van weten! (Op dat moment staat Lola weer op ze heeft haar lange haar voor haar gezicht langs gedaan en daar een zonnebril overheen gezet, zodat haar gezicht niet meer zichtbaar is) En wie mag u Wel niet zijn?"},{"role":"LOLA","text":"(Met een verdraaid gek stemmetje) lemand die u absoluut niet kent!"},{"role":"LAURA","text":"Waarom springt u hier achter de bar?"},{"role":"LOLA","text":"Waarom niet? Is dat hier verboden of zo? (Snel rent Lola de trap op maar  aangezien ze niet veel ziet loopt ze eerst tegen de wand aan, voordat ze de trapopgang heeft gevonden)"}]},{"cards":[{"role":"LAURA","text":"Wat een gek mens. En wat voor lawaai komt er daar allemaal uit de kast? Dit is maar een eigenaardig hotelletje.."},{"role":"EMMA","text":"Eigenaardig? (tegen het publiek) Valt wel mee toch? (Laura loopt naar de kast) SIMONE: Een kop koffie! Ik haal meteen een heerlijk bakkie koffie. Als u nu eens lekker gaat zitten."},{"role":"LAURA","text":"Maar ik wil weten wat er in die kast zit."},{"role":"EMMA","text":"Kijkt u altijd zomaar bij andere mensen in de kast?"},{"role":"LAURA","text":"Ja hoor, ik wel altijd belangrijk om te weten wat voor lijken er in de kast liggen! SIMONE: Lijken? Daar hebben wij geen belang bij! Dus kijk maar niet in die kast! (Tegen Emma) Doe iets!"},{"role":"EMMA","text":"Ja, even wachten, ik heb bijna de bladzijde uit."},{"role":"SIMONE","text":"Zucht... (Tegen Piet) Doe iets!"},{"role":"PIET","text":"Eh... lijk in de kast? Wacht! (Piet zakt in elkaar en biijft voor Pampus liggen) SIMONE: EHBO EHBO. (Tegen Laura) Heeft u EHBO?"},{"role":"LAURA","text":"Eh, ja..."},{"role":"SIMONE","text":"Mooi, mond op mond beademing!"},{"role":"PIET","text":"(Kreunt) Ja, mond op mond beademing..."},{"role":"LAURA","text":"Ja, doei. Doe dat lekker zelf!"},{"role":"PIET","text":"Laat dan maar zitten. (zakt weer zogenaamd bewusteloos weg. Ondertussen komt Grietje met een emmer de trap af en is van plan richting de kast te lopen)"},{"role":"GRIETJE","text":"Wat doet Piet hier op de grond?"},{"role":"SIMONE","text":"Die is in elkaar gezakt en die mevrouw gaat EHBO op hem toepassen."},{"role":"GRIETJE","text":"EHBO? Oh, maar dan moet ze de verbanddoos hebben."},{"role":"EMMA","text":"De verbanddoos? Hebben we die dan?"},{"role":"GRIETJE","text":"Ja, natuurliik is er een verbanddoos! Die staat in de kast! (Grietje wil naar de kast toelopen, maar Simone houdt haar tegen. Piet trekt ondertussen zijn broek weer wat om hoog en biijft daarna weer doodstil liggen)"},{"role":"SIMONE","text":"Is denk ik niet nodig. Mond op mondbeademing is voldoende!"},{"role":"GRIETJE","text":"Oke (Simone laat haar los) dan zet ik de emmer even in de kast. (Grietje zwaait de deur van de kast open en Hans staat even  weer op het podium te worstelen met de kip en verdwijnt snel weer in de kast. Laura ziet er niets van, want die zit inmiddels voorover gebogen bij Piet. Grietje geeft een gil, valt nu echter echt flauw en ligt op het podium)"},{"role":"PIET","text":"(Springt overeind) Grietje! (Laura schrikt zich een hoedje)"},{"role":"EMMA","text":"(Kijkt geirriteerd op van haar blaadje) Wat is dit nu weer? (Op dat  moment gaat het  brandalarm af) Ach ja! Ook nog eens het brandalarm! Kan een mens hier niet eens even rustig de laatste roddels lezen! (Kitty komt uit de keuken) We )"}],"title":"TWEEDE BEDRIJF — Scène 13"},{"title":"TWEEDE BEDRIJF — Scène 14","cards":[{"role":"KITTY","text":"Sorry, sorry, aangebrande kip."},{"role":"PIET","text":"D’r zit nog wel een nieuwe in de kast."},{"role":"KITTY","text":"Ha! Mooi!"},{"role":"LAURA","text":"Een kip in de kast? En die maakt zoveel herrie?"},{"role":"PIET","text":"(Probeert ondertussen Grietje op te tillen) ik breng Grietje even naar boven, kan ze even liggen (Kitty loopt tichting de kast en wil de deur open doen, maar Simone houd haar tegen)"},{"role":"SIMONE","text":"Deze kip moet even wachten."},{"role":"KITTY","text":"(Doet stap naar de deur) Even wachten? Ik moet met het eten beginnen klaar te maken voor vanavond. En zo als je misschien al ruikt, wil het niet zo vlotten... Dus die nieuwe kip kan niet wachten."},{"role":"SIMONE","text":"(Duwt Kitty terug) ik verzeker je, dat kan wel!"},{"role":"KITTY","text":"(Doet’stap naar de deur) Maar ik wil een goede indruk maken op die meneer die het hotel wil kopen."},{"role":"SIMONE","text":"(Duwt Kitty weer terug) Je maakt een betere indruk op hem als je deze kast niet open doet!"},{"role":"LAURA","text":"Mens! Ga eens aan de kant en laat eens zien wat er in die kast zit! Ik geloof er niks van dat daar een kip in zit. Hij maakt zo’n kabaal, dat is eerder een vogel zoals Pino van Sesamstraat! (Dan komt Grietje, in haar bewusteloze toestand van de trap af rollen en valt plat op het podium. Piet komt geschrokken ook via de trap het podium weer op)"},{"role":"PIET","text":"Sorry sorry! (Sjort de broek weer omhoog)"},{"role":"LAURA","text":"Dat is ook geen wonder! Die man kan normaal nog niet eens een paar koffers de trap op krijgen! Koop eens een riem voor die man!"},{"role":"PIET","text":"Ja, die broek is wat te ruim en door dat traplopen val ik alleen maar af, en dan zit hij nog ruimer!"},{"role":"EMMA","text":"Het geld is op, we moeten eerst het hotel verkopen."},{"role":"LAURA","text":"Nou Piccolo, jij pakt haar onder de schouders en dan pak ik haar benen! (Laura en Piet pakken Grietje op en verdwijnen met zin drieén via de trap van het  podium.Via de voordeur, komen meneer Chatea en Nel binnen. Simone heeft dat echter niét door en doet de deur van de kast open)"},{"role":"SIMONE","text":"Ze is weg hoor! (Hans komt wild worstelend met de kip, die hij nu op zijn hoofd heeft en is zo onherkenbaar uit de kast. Verschrikt kijken Nel en meneer Chateau toe)"},{"role":"KITTY","text":"D’r zit nog iemand onder aan die kip vast! Moet ik een mes ophalen?"},{"role":"SIMONE","text":"Nee nee! (Op dat moment ziet Simone Nel en schrikt daarvan  Als reactie duwt zij de spartelende Hans richting de keuken. Simone  tegen Kitty) Je moest die kip toch in de keuken gebruiken? (Hans wordt de keuken ingeduwd, vervolgens duwt Simone Kitty er achteraan) Redt je er maar mee! (Simone gooit de deur dicht en gaat er met de rug tegen\naan staan. Veegt met een hand het weet van het voorhoofd)"}]},{"title":"TWEEDE BEDRIJF — Scène 15","cards":[{"role":"MENEER CHATEAU","text":"Tjonge jonge, wat gaat het er hier aan toe!"},{"role":"EMMA","text":"(Kijkt rustig. op van haar tijdschtiftje) Och, dit is nog niks. Dan moest u er vorige maand zijn geweest toen we die motorbende over de vloer hadden."},{"role":"MENEER CHATEAU","text":"U maakt zich er niet erg druk om allemaal."},{"role":"EMMA","text":"Ach, het zal mijn tijd wel duren. Volgend jaar krijg ik al AOW en dan hoef ik niets meer te doen... Eigenlijk veranderd er dan dus niet echt zoveel."},{"role":"NEL","text":"Ik zou zweren dat dat Hans was."},{"role":"SIMONE","text":"Hans wie? Ik ken geen Hans."},{"role":"NEL","text":"De man van mijn vriendin Laura!"},{"role":"EMMA","text":"Ach mevrouw, u ziet spoken. Wat u nodig heeft is een lekker bakje koffie! Simone, haal eens een bakje koffie voor mevrouw."},{"role":"SIMONE","text":"Ja, nu even niet hoor. Ik neem eerst maar eens een stevige borrel! (Simone loopt naar de bar en schenkt zich een borrel in)"},{"role":"MENEER CHATEAU","text":"Drinken onder werktijd?"},{"role":"SIMONE","text":"Dat ziet u goed! Een borrel is goed voor hart en bloedvaten (slaat de borrel achterover), en dan hopelijk vooral voor het hart (legt hand op haar hart), want die heeft het op dit moment hard te verduren. (Gooit nog een borrel achterover)"},{"role":"MENEER CHATEAU","text":"Nou, tussen het drinkende personeel hoef ik mij niet te vertoeven. Ik trek mij terug op mijn kamer."},{"role":"NEL","text":"Ja, ik ook. Kan ik mooi even de kleurplaat van Joco’s Kinderpannenkoekenpaleis inkleuren. (Meneer Chateau en Nel lopen samen de trap op)"},{"role":"SIMONE","text":"Ik hoop maar dat die man snel dit hotel koopt! Dit hou ik niet nog jaren vo!! EMMA: Ik ook niet! Maar die man koopt dit nooit, naar alles wat er is gebeurd. Dan moet ie echt wel gek zijn!"},{"role":"SIMONE","text":"Dan hebben we wel een probleem..."},{"role":"EMMA","text":"Aangevallen door kippen, opgesloten in de kast en ga maar door... zucht... Nou, ik zal even mijn blaadje uitlezen."},{"role":"SIMONE","text":"Tuurlijk, dat is ook erg belangrijk! ,"},{"role":"EMMA","text":"Een mens moet wel op de hoogte blijven. (De deur van de keuken gaat open en Hans komt binnen waggelen. Zijn haar zit alle kanten op, zijn kleding schots en scheef en zit onder de kippenveren) ."},{"role":"HANS","text":"(Verwart brabbelend tegen Simone) We moeten maar eens even om de tafel."},{"role":"EMMA","text":"Nou, bij nader inzien lijkt ie wel wat gek."},{"role":"SIMONE","text":"Ja... eh... dat is goed. Kom je er ook even bij Emma?"},{"role":"EMMA","text":"Maar mijn blaadje..."},{"role":"SIMONE","text":"Emma! (Het driétal gaat in de zithoek zitten)"},{"role":"HANS","text":"Ik heb het hier eens allemaal goed bestudeerd..."},{"role":"EMMA","text":"Ja, ik heb mijn best gedaan en Simone ook wel wat, maar ja, alles liep nu éénmaal in het honderd."},{"role":"HANS","text":"...en ik ben tot de conclusie gekomen dat..."},{"role":"SIMONE","text":"Tja, het is niet anders. We begrijpen dat de koop niet doorgaat."},{"role":"HANS","text":"...dat dit ideaal voor mij is!"},{"role":"SIMONE EN EMMA","text":"Hu?! Wat!!"},{"role":"HANS","text":"Ik koop het! Ik heb zelfs al hier een koopcontract bij mij. (Hans pakt een aantal papieren uit zijn binnenzak van het colbert. Simone en Emma kijken elkaar stomverbaasd aan)"},{"role":"SIMONE","text":"Maar het is hier een zootje!"},{"role":"EMMA","text":"Dit koop je toch niet? Wil je snel van je geld af?"},{"role":"SIMONE","text":"Moet je niet eerst even wat bijkomen?"},{"role":"HANS","text":"Dit past mij precies. Kijk, alles staat in de papieren, zelfs het bedrag wat we hebben afgesproken."},{"role":"EMMA","text":"Hadden we dat afgesproken, wat veel zeg."},{"role":"SIMONE","text":"Ach ja, ik had een hoge prijs maar genoemd, dan konden we altijd nog zakken. EMMA: O, Simone! Het geluk lacht ons toe! Heerlijk met pensioen!"},{"role":"HANS","text":"Dan zou ik van beiden wel even een krabbeltje hier en hier willen."},{"role":"SIMONE","text":"Natuurlijk! Kom maar op!"},{"role":"EMMA","text":"voor die prijs krabbelen we die hele papieren er onder! Waar moet ie"},{"role":"SIMONE","text":"Zet hier maar een kruisje."},{"role":"EMMA","text":"Ik doe dit keer twee kruisjes en een hartje. (Simone en Emma tekenen snel de Papieren):"},{"role":"HANS","text":"Zo, dat is dan ook klaar."},{"role":"SIMONE","text":"Gefeliciteerd met uw aankoop!"},{"role":"EMMA","text":"Champagne! Champagne! Wacht, ik roep het personeel. (Emma rent naar de balie en  geeft een flinke stoot op de luchthoorn en roept alle namen van het personeel... Ondertussen pakt ze een fles champagne achter de bar weg)"}]},{"title":"TWEEDE BEDRIJF — Scène 16","cards":[{"role":"SIMONE","text":"Tjonge, Zo actief heb ik haar in jaren niet gezien! (Hans stopt de papieren weer in de binnenzak en gaat alvast staan. Van alle kanten komt het personeel aangestroomd. Grietje wordt ondersteund door Piet van dé trap afgeleid) ."},{"role":"GRIETJE","text":"Ja, ik viel flauw, maar zo hard ben ik toch ook niet gevallen. Maar ik zit nu onder de blauwe plekken."},{"role":"PIET","text":"Ja, vreemd. Geen idee hoe dat kan!"},{"role":"SIMONE","text":"Dag jongens, Emma en ik hebben een belangrijke mededeling! (Emma deelt ondertussen glazen,champagne uit)"},{"role":"FRITS","text":"Gaat het over de Kerstpakketten?"},{"role":"EMMA","text":"Hou op over die Kerstpakketten!"},{"role":"SIMONE","text":"Emma en ik hebben zojuist het hotel verkocht aan meneer Groothof! Emma en ik gaan van ons pensioen genieten en wij geloven dat we het hotel en jullie als personeel in goede handen hebben overgedragen bij meneer Gtoothof."},{"role":"EMMA","text":"En daar proosten we op! (ledereen heft het glas)"},{"role":"HANS","text":"Ikdenk dat u iets niet helemaal begrijpt."},{"role":"SIMONE","text":"Ja hoor, u heeft het hotel gekocht."},{"role":"EMMA","text":"En ook niet voor een beetje! Ik heb twee mooie kruisjes en een hartje op dat papier gezet, dus..."},{"role":"HANS","text":"Ik heb inderdaad het hotel gekocht, maar slechts alleen het gebouw."},{"role":"EMMA","text":"Tuurlijk, een hotel is een gebouw, dus?"},{"role":"SIMONE","text":"En hotel is een hotel toch?"},{"role":"HANS","text":"Nee, ik heb uw hotel-bedrijf niet gekocht. Alleen dus het pandje en de omliggende gronden. U moet uw personeel maar ontslag geven. Ze zijn gewoon nog bij u in dienst. Waarschijnlijk bent u dan wel meer dan het verkoopbedrag kwijt aan ontslagvergoeding, maar ja, dat is uw probleem."},{"role":"EMMA","text":"Ja, maar... en ons pensioen dan?"},{"role":"GRIETJE","text":"Maar wat gaat u dan doen met dit hotel."},{"role":"HANS","text":"Nou, dat zal ik u vertellen. Dit hele zootje gaat plat! En hier komt een nieuwe kerncentrale op!"},{"role":"IEDEREEN","text":"KERNCENTRALE?"},{"role":"HANS","text":"Ja, ideale locatie!"},{"role":"PIET","text":"Daar zakt me de broek van af. (Piet zijn broek zakt inderdaad af )\nGORDIJNEN SLUITEN"}]},{"title":"DERDE BEDRIJF — Scène 17","cards":[{"role":"GERRIE","text":"Je neemt me in de maling! Verkocht?"},{"role":"SIMONE","text":"Ja, verkocht! Gisteren."},{"role":"GERRIE","text":"Gisteren verkocht? Haha, wie is daar in getrapt?"},{"role":"SIMONE","text":"Meneer Groothof héeft hét gekocht. Die logeert hier op dit moment."},{"role":"GERRIE","text":"O ja, die zat met dat jonge ding toen ook daar in hét restaurant te eten. Nou, wat mogen jullie in de handen knijpen zeg, dat jullie deze ouwe troep hébben weten te verkopen!"},{"role":"SIMONE","text":"Nou, dat doen we dus niet echt."},{"role":"SIMONE","text":"Dat weet ik zo net nog wel niet..."},{"role":"GERRIE","text":"Tuurlijk, kan nooit erger."},{"role":"SIMONE","text":"Tja, als je een kerncentrale als buren beter vindt dan dit hotel..."},{"role":"GERRIE","text":"Dit is zo’n zooitje... (Dan dringen de woorden eindelijk tot haar door.) kerncentrale!!"},{"role":"SIMONE","text":"Dat héb je goed gehoord. (Ondertussen komt Frits sip kijkend via de voordeur binnen.)"},{"role":"GERRIE","text":"(Tegen Frits) Het hotel gaat plat!"},{"role":"FRITS","text":"Ja, ook nog."},{"role":"SIMONE","text":"Ook nog? Hoezo? Wat bedoel je?"},{"role":"FRITS","text":"’t Is wel erg natuurlijk, maar dat is niet hét ergste."},{"role":"GERRIE","text":"Niet hét ergste?"},{"role":"FRITS","text":"Nee natuurlijk niet, hét ergste is nog wel dat ik nu geen kerstpakket krijg!"},{"role":"SIMONE","text":"Och, jij met je kerstpakketten! (Hans en Lola komen samen de trap af.)"},{"role":"LOLA","text":"Nou schat, je hébt vannacht niet bewezen hoor. Het was maar een slap gedoe, met de nadruk op slap! Ik ben wel erg aan hét twijfelen of mijn goddelijke lichaam jou nog wel langer bekoort, of dat je toch meer ziet in kerels."},{"role":"HANS","text":"Maar schatje, ik kwam letterlijk gisteren uit de kast, maar figuurlijk hoor! En hét was ook geen wonder dat ik vannacht niks presteerde. Dat kwam door al die stress, dat mijn vrouw hier is en zo."},{"role":"LOLA","text":"Eigenlijk komt hét wel goed uit dat ze hier is. Nu kun je haar mooi vertellen dat je bij haar weg gaat en met mij verder wilt!"},{"role":"HANS","text":"Eh... Ik denk dat hét niet zo’n geschikt moment nu is."},{"role":"SIMONE","text":"Kijk, dat is je nieuwe buurman. (Wijst naar Hans.)"},{"role":"GERRIE","text":"Dat is die vervelende man van de kerncentrale?"},{"role":"SIMONE","text":"Inderdaad."},{"role":"GERRIE","text":"’t Is wel een leuke makker, misschien moet ik die kerncentrale maar voor lief nemen..."},{"role":"SIMONE","text":"Denk je nu echt dat zij in een kerncentrale gaan wonen?"},{"role":"GERRIE","text":"Eh... nee natuurlijk niet. (Slaat als een blad aan de boom om.) Meneer, u kunt rekenen op een grote schadeclaim!"},{"role":"HANS","text":"(Richting Simone) Is dit die vervelende buurvrouw, waar jij hét over had?"},{"role":"GERRIE","text":"Praat je zo over mij? Ik eis een..."},{"role":"SIMONE","text":"Schadevergoeding, nou, hier is ie alweer. (Zet Gerrie een borrel voor.)"},{"role":"FRITS","text":"Bij zo’n kerncentrale moet toch ook hét grasgemaaid worden?"},{"role":"HANS","text":"Heb je wel papieren?"},{"role":"FRITS","text":"Papieren? Ja... ik héb vast nog wel ergens een notitieblok of..."},{"role":"HANS","text":"Nee man, diploma’s!"},{"role":"FRITS","text":"O, zeg dat dan! Ik héb een diploma van de landbouwschool. Erg mijn best gedaan. Zo zelfs dat ik elk jaar 2 keer héb gedaan! Dus ik héb er wel werk van gemaakt. Maar ik hoef niet per se gras te maaien hoor. Ik wil ook wel een ander baantje hoor, bij haar op hét kantoor zitten of zo! (Kijkt verlekkerd naar Lola.)"},{"role":"LOLA","text":"Ja doei! (Kijkt dan naar Hans.) Maar Hans, iemand om hét gras te maaien? Rondom die andere kerncentrale wil ook al niks meer groeien. Dus hier groeit straks toch ook niets meer?"},{"role":"GERRIE","text":"Ik zeg hét niet graag Simone, maar ik denk dat ik jullie met jullie rare hotel nog liever naast me héb dan die kerncentrale! Doe er wat aan man!"},{"role":"FRITS","text":"Mag ik trouwens de grasmachine houden? Als hier straks toch niets meer groeit... Je gaat je héchten aan zo’n ding hè. (Ondertussen is Frits naar de voordeur gelopen en gaat daar via af.)"},{"role":"SIMONE","text":"Wat moet ik er aan doen, buurman. Ik wil ook graag hét hotel weer terug! Maar we hébben hét doodsvonnis zelf getekend! We hébben geen poot om op te staan, we hébben al de handtekening gezet!"},{"role":"HANS","text":"Je wilt hét hotel weer terug? Hahaha!"},{"role":"SIMONE","text":"Ik kan toch al mijn werknemers niet op straat zetten en ik ben gehécht aan dit gebouw, hét breekt mijn hart als hét plat gaat."},{"role":"HANS","text":"Hahaha, man, dit is een verlopen en vervallen hotel met een ongeregeld zootje als personeel."},{"role":"GERRIE","text":"Ja, daar héb je wel weer gelijk in. En laten we eerlijk zijn, die vrouw van jou bakt er ook niet veel van."},{"role":"SIMONE","text":"Mijn mensen hébben allemaal hun kwaliteiten! Zelfs mijn vrouw... denk ik..."},{"role":"GERRIE","text":"Nou, die tonen ze dan nooit. En ik kan hét weten, want ik kom hier geregeld voor mijn schadevergoedingen. (Toost met hét glas.) Had ik nog niet wat schadevergoeding tegoed?"},{"role":"HANS","text":"Kom op zeg. Een kok die niet kan koken, een piccolo die te slap is om nog de koffers naar boven te krijgen, een onnozele als tuinman die een boom voor peterselie aanziet en een kamermeisje die alles in hét honderd laat lopen. En jij gelooft dat je met die mensen een hotel perfect kan runnen?"},{"role":"GERRIE","text":"Helemaal eens met die man, ook al is hét een vieze gluiperd, hij héeft hélemaal gelijk."},{"role":"SIMONE","text":"Buurman, hou je er nu even buiten! (Dan tegen Hans.) Ik geloof in mijn mensen."},{"role":"HANS","text":"Man, dat lukt je nog geen dag om hét hier perfect en normaal te laten verlopen, zoals dat in een hotel hoort! Daar durf ik mijn geld wel op te zetten, haha!"},{"role":"SIMONE","text":"Je geld of hét hotel?"},{"role":"HANS","text":"Eh... kijk dat wordt een beetje moeilijk hè. Ik héb natuurlijk wel plannen."},{"role":"SIMONE","text":"Je zei net nog dat je je geld er wel op in wilde zetten."},{"role":"LOLA","text":"Ach, hij is een echte draaikont!"},{"role":"HANS","text":"Ik een draaikont?"},{"role":"LOLA","text":"Ja, dan val je op vrouwen, dan op mannen en dan ineens wel weer op vrouwen, maar bak je er niks van. En dat je al tijden tegen je vrouw zou zeggen dat je bij haar weg zou gaan en met mij verder zou gaan. Maar elke keer stel je hét weer uit! Je bent een vent zonder ruggengraat. Een draaikont!"},{"role":"HANS","text":"Dat ben ik zeker niet!!"},{"role":"LOLA","text":"Tuurlijk wel. Je durft niet eens zo’n weddenschapje aan. Temeer weer een bewijs van wat voor een zielig ventje je bent! En zo’n vent hoef ik niet!"},{"role":"HANS","text":"O, dus ik ben een zielig ventje?"},{"role":"LOLA","text":"Ja! Een héeeeel zielig ventje!"},{"role":"HANS","text":"En ik durf die weddenschap niet aan?"},{"role":"LOLA","text":"Nee! Een laf kereltje ben jij!"},{"role":"HANS","text":"Ach, ik win toch gegarandeerd! Maar dan moet hij ook wat inzetten natuurlijk."},{"role":"GERRIE","text":"Ja Simone, zo hoort dat bij een weddenschap hè. Of ben je nu ineens niet meer zo zeker van je zaak?"},{"role":"HANS","text":"Wat dacht je ervan samen met je vrouw de komende 10 jaar in de nieuwe kerncentrale te werken?"},{"role":"GERRIE","text":"Werken? Dat moet zijn vrouw nog leren."},{"role":"SIMONE","text":"10 jaar? Eh... we zouden eigenlijk met pensioen..."},{"role":"HANS","text":"Helemaal geen raar werk trouwens, en hét héeft ook zo zijn voordelen."},{"role":"SIMONE","text":"Voordelen? Welke dan?"},{"role":"HANS","text":"Nou, als je ’s avonds op bed nog even een boek wilt lezen, hoef je geen leeslampje aan te doen, omdat je zelf al oplicht."},{"role":"SIMONE","text":"Wij gaan dit winnen!"},{"role":"GERRIE","text":"Oeps, ben bang van niet!"},{"role":"HANS","text":"Haha, dus je neemt de weddenschap aan? Goed, dan gaat hij nu in! (Steekt zijn hand uit.) Kijk eens Lola, niks geen zielig ventje!"},{"role":"SIMONE","text":"(Geven elkaar een hand.) Aangenomen!"},{"role":"LOLA","text":"O Hans, wat stoer van je! Ik neem mijn woorden terug! Je bent een echte kerel! Een machoman!"},{"role":"HANS","text":"(Glundert.) Ja poppetje, hier staat een echte alfa-man die niet bang is voor een wedje! Sterker nog, die nergens bang voor is! (Er klinkt wat gerommel van de zijkant van de trap. Hans reageert angstig en wil haastig wegduiken.) Komt mijn vrouw daar aan?"},{"role":"LOLA","text":"(Kijkt ook om.) Nee schat, daar is niks."},{"role":"HANS","text":"(Herstelt zich.) Maar geen trucs met nieuw personeel en weet ik veel wat voor trucs meer hè! Je moet hét gewoon doen met dit team!"},{"role":"SIMONE","text":"Ja, geen probleem! Geen trucs."},{"role":"HANS","text":"(Sarcastisch) Dan wens ik je veel succes, hahaha. Kom Lola, dan gaan wij even naar de stad te shoppen en als we terug komen, komen we terecht in een perfect en normaal hotel! Haha, niet dus."},{"role":"LOLA","text":"Ja, even shoppen. Ik moet nog een mobieltje kopen. Die ik nu héb, daar is de accu van leeg."},{"role":"GERRIE","text":"(Tegen Simone) Bij haar is wel meer leeg. (Tikt tegen haar hoofd.) Maar daar héb ik nooit problemen mee... ’t Is vaak eerder een pluspunt. (Hans en Lola gaan via de voordeur af. Emma komt via hét restaurant op.) Nou, ik wens jou en je vrouw succes met jullie verplichte baan voor de komende 10 jaar in de kerncentrale!"}]},{"title":"DERDE BEDRIJF — Scène 18","cards":[{"role":"EMMA","text":"10 jaar in de kerncentrale? Waar héeft hij hét over, Simone!?"},{"role":"GERRIE","text":"Hij héeft een briljante weddenschap afgesloten! En die gaat ie verliezen en dan moeten jullie beiden 10 jaar werken in de kerncentrale hier!"},{"role":"EMMA","text":"Waarom moeten wij 10 jaar werken in een kerncentrale!!"},{"role":"SIMONE","text":"Tja, ik héb een weddenschap met meneer Groothof afgesloten."},{"role":"EMMA","text":"Een weddenschap?!"},{"role":"SIMONE","text":"Ja, als wij een dag lang dit hotel zo kunnen laten draaien als een normaal hotel draait, verschéurt hij hét koopcontract. En als hét... niet... lukt..."},{"role":"GERRIE","text":"Dan ben je veroordeeld tot 10 jaar slavenarbeid in een kerncentrale!!"},{"role":"SIMONE","text":"Maar hét had ook voordelen, zei meneer Groothof. Als je dan op bed ligt... ach laat maar..."},{"role":"EMMA","text":"Ben je hélemaal gek geworden Simone!!"},{"role":"GERRIE","text":"Nee, dat was ie al."},{"role":"SIMONE","text":"Buurman, moet je niet eens naar huis?"},{"role":"GERRIE","text":"Nee, hoe kom je daar bij?"},{"role":"SIMONE","text":"Volgens mij wel! (Simone pakt Gerrie in de arm en sleept haar mee naar de voordeur.)"},{"role":"GERRIE","text":"Ik héb mijn schadevergoeding nog niet op! (Simone duwt Gerrie de voordeur uit en gaat er zelf ook achteraan. Ondertussen is meneer Chateau van de trap afgekomen.)"},{"role":"MENEER CHATEAU","text":"Hallo, zeg wat hoorde ik nu? Het kamermeisje vertelde dat hét hotel gaat sluiten?"},{"role":"EMMA","text":"Ja, sterker nog, hét héle hotel gaat plat en al hét personeel komt op straat te staan!"},{"role":"MENEER CHATEAU","text":"Oh, en is daar hélemaal niets meer aan te doen?"},{"role":"EMMA","text":"Denk hét niet. Of we zouden wonder boven wonder die belachélijke weddenschap van mijn man moeten winnen."},{"role":"MENEER CHATEAU","text":"Weddenschap? Hoe bedoelt u?"},{"role":"EMMA","text":"Die weddenschap is waarschijnlijk nog de enige kans om onze domme fout weer goed te maken. We zouden de weddenschap kunnen winnen als we de rest van de dag laten zien dat we toch een goed hotel zijn. Mijn man ook altijd met zijn belachélijke ideeën!"},{"role":"MENEER CHATEAU","text":"Zo, nou, dat is bij voorbaat al verloren. Wat ik, ondanks dat ik dit een vreselijk hotel vind, wel erg jammer vind. Het doet mij, als hotelliefhébber, altijd pijn aan hét hart als een hotel verdwijnt. Ja, en dat ik dan voor niets mijn stukje aan hét schrijven ben natuurlijk."},{"role":"EMMA","text":"Kunt u ons dan niet hélpen? U met al uw hotelervaring? En dan is hét stukje schrijven ook niet voor niets geweest!"},{"role":"MENEER CHATEAU","text":"Het is een idee. Ik zal eens mijn gedachten erover laten gaan."},{"role":"EMMA","text":"Ik vermoed dat u wel de nodige horeca-ervaring héeft."},{"role":"MENEER CHATEAU","text":"Ach, ik héb meerdere hotels tot grote hoogte gestuwd."},{"role":"EMMA","text":"Precies, en dan is hét toch een peulenschilletje om van dit hotel weer iets te maken? Zo’n man als u..."},{"role":"MENEER CHATEAU","text":"Nou... (Begint te glimmen van trots.) Misschien kan ik u inderdaad hélpen... (Denkt na.) Altijd alleen maar stukjes schrijven wordt ook maar saai."},{"role":"EMMA","text":"Precies! En dan is dit natuurlijk de uitdaging bij uitstek!"},{"role":"MENEER CHATEAU","text":"Hmm, misschien moeten we hét maar proberen. Maar ik denk dat ik dan eerst maar eens een gesprek met uw personeel moet aangaan."},{"role":"EMMA","text":"Als u hét wilt kan ik ze meteen bij elkaar roepen."},{"role":"MENEER CHATEAU","text":"Dat lijkt mij een uitstekend idee. (Emma loopt achter de balie en pakt de luchthoorn en geeft een stoot.)"},{"role":"EMMA","text":"VERGADERING!!!"},{"role":"MENEER CHATEAU","text":"Hmm, dit is misschien direct al een eerste puntje wat voor verbetering vatbaar is."},{"role":"EMMA","text":"Zou hét?"}]},{"title":"DERDE BEDRIJF — Scène 19","cards":[{"role":"FRITS","text":"((Simone, Piet, Grietje, Frits en Kitty komen van alle kanten op.)) De kerstpakketten?"},{"role":"EMMA","text":"Nee, ik héb voor een andere reden iedereen bij elkaar geroepen. Misschien hébben jullie hét al van Simone gehoord, maar we hébben dus nog één kans om hét hotel te behouden."},{"role":"SIMONE","text":"Ja, nog één kans."},{"role":"EMMA","text":"Precies. We mogen hét hotel houden als we de rest van de dag dit hotel perfect draaiende weten te houden. Dus door de rest van de dag geen enkele fout te maken!"},{"role":"SIMONE","text":"Ja, hét hotel is de inzet van een weddenschap met meneer Groothof. (Iedereen mompelt dat ze dat wel kunnen, vergeten e.d.)"},{"role":"EMMA","text":"En als hét ons niet lukt, staat niet alleen iedereen op straat, maar moet Simone ook nog eens 20 jaar in de kerncentrale werken!"},{"role":"EMMA","text":"Ja, jij doet die 10 jaar van mij er ook maar mooi bij, met je belachélijke weddenschappen!"},{"role":"FRITS","text":"Heb je mooi wel 20 jaar lang nog een kerstpakket."},{"role":"EMMA","text":"Maar misschien hébben we nog een kansje. Ik héb meneer Chateau gevraagd om ons te hélpen. Met zijn staat van dienst weet hij precies hoe je succesvol een hotel moet runnen."},{"role":"MENEER CHATEAU","text":"Tja... ja... Ik wil daarvoor mijn best wel doen, maar weet niet of hét allemaal in één keer lukt. Maar ik héb misschien een paar goeie ideeën, die ook nog wel eens zouden kunnen werken. Laten we met z’n allen in hét restaurant gaan zitten en kijken hoe we hét gaan regelen. (Iedereen gaat hét restaurant in. Tegelijk komen Laura en Nel de trap af. Nel loopt naar de balie en drukt op hét belletje. De deur van hét restaurant gaat open en Emma steekt haar hoofd om de hoek.)"},{"role":"EMMA","text":"Nu even niet!! (En gooit de deur weer dicht.)"},{"role":"NEL","text":"Nou zeg."},{"role":"LAURA","text":"Ik begin dit een steeds raarder hotel te vinden."},{"role":"NEL","text":"Och, ik vind hét wel leuk. Alleen dat we een badkamer hébben met bruin water uit de kraan is wat minder, maar hét gehéel héeft wel zijn charmes. Heeft mij ook altijd al leuk geleken, zo’n hotel."},{"role":"LAURA","text":"Dan moet je maar snel die meneer Chateau aan de haak slaan, die héeft er tenminste verstand van."},{"role":"NEL","text":"En hét lijkt hém ook leuk om weer een hotelletje te gaan runnen."},{"role":"LAURA","text":"Tja, maar hét schijnt al verkocht te zijn."},{"role":"NEL","text":"Nu we hét toch over kopen hébben, kom we gaan naar de stad te shoppen! (Gerrie is ondertussen binnengekomen.)"},{"role":"GERRIE","text":"Shoppen? Jullie ook al?"},{"role":"NEL","text":"Hoe bedoelt u?"},{"role":"GERRIE","text":"Dat andere stel dat hier in hét hotel overnacht, die willen ook net weg te shoppen in de stad. Maar hét schiet nog niet...\nZe staan wat klef te doen daar bij de auto. Die kerel héeft trouwens dit hotel gekocht."},{"role":"LAURA","text":"Misschien kunnen we wel even meerijden!"},{"role":"NEL","text":"Met zo’n klef stel?"},{"role":"LAURA","text":"Ja joh, zal tijdens hét rijden wel meevallen toch? (De deur van hét restaurant gaat open en Piet komt in een hémd voorbij lopen. Niet hérkenbaar, met de koksjas en muts van Kitty onder de arm. Hij verdwijnt in de keuken. Nel en Laura kijken verschrikt toe.) Is toch een raar hotel!"},{"role":"GERRIE","text":"Nou, beter een raar hotel, dan een kerncentrale."},{"role":"LAURA","text":"kerncentrale?"},{"role":"GERRIE","text":"Ja, maar ik ga er weer eens vandoor, ik zie Simone niet, dus kan ik ook geen schadevergoeding eisen voor wat dan ook. (Gerrie loopt via de voordeur af.)"},{"role":"NEL","text":"Hoe komt die man er nu bij dat dit beter is dan een kerncentrale?"},{"role":"LAURA","text":"Ja... (Dan gaat de deur van hét restaurant open en komt Kitty in hémd hét podium op. Onder haar arm, onhérkenbaar, de piccolokleding.)"},{"role":"KITTY","text":"Dag dames. (De dames kijken stomverbaasd en Kitty verdwijnt via de trap.)"},{"role":"NEL","text":"Inderdaad, een raar hotel."},{"role":"LAURA","text":"Nou ja, entertainment genoeg, zullen we maar zeggen. Kom Nel, we gaan eens achter dat kleffe stel aan! (Nel en Laura gaan via de voordeur af. Grietje en Emma komen uit hét restaurant.)"},{"role":"GRIETJE","text":"Hup hup, naar boven!"},{"role":"EMMA","text":"Nou, ja zeg!"},{"role":"GRIETJE","text":"Ja, toe maar even. Zo’n tempo is dat lichaam niet meer gewend hè! (Grietje en Emma verdwijnen via de trap. Meneer Chateau en Simone komen uit hét restaurant.)"},{"role":"MENEER CHATEAU","text":"Ik zal eens in de keuken zien om te kijken wat daar nog te redden valt."},{"role":"SIMONE","text":"Ik wil u alvast hartelijk bedanken voor uw hulp."}]},{"title":"DERDE BEDRIJF — Scène 20","cards":[{"role":"MENEER CHATEAU","text":"Juich maar niet te vroeg! (Meneer Chateau verdwijnt in de keuken en Simone gaat achter de balie staan. Hans en Lola komen via de voordeur binnen en hébben een koffer mee genomen. Ze zitten onder de blaadjes en takjes. Ze lopen naar de balie.)"},{"role":"LOLA","text":"Maar Hans, we zouden gaan shoppen."},{"role":"HANS","text":"Ja, maar je hoorde toch wat die buurvrouw zei! Dat die twee dames met ons meewilden rijden naar de stad! Dat is wel mijn vrouw en haar vriendin hoor!"},{"role":"LOLA","text":"We zouden shoppen! En nu bedenkt je je weer! Wat is dat met jou! En dan moesten we ons nog in de bosjes verstoppen!"},{"role":"HANS","text":"Ja, we waren gelukkig net op tijd! Maar gelukkig namen ze hun eigen auto! We kunnen er nu beter even voor zorgen dat ik de weddenschap win. Immers mijn vrouw en haar vriendin zijn nu weg, dus we hébben nu even hét rijk alleen!"},{"role":"LOLA","text":"Nou zeg, je hébt wel wat goed te maken straks!"},{"role":"HANS","text":"Dat komt wel goed. Nu gaan we lachén, die weddenschap héeft hij direct verloren! (Tegen Simone) Zou uw Piccolo deze koffer naar boven kunnen brengen? (Tegen Lola) Die afschuwelijke luchthoorn, haha! (Simone drukt op hét belletje en vervolgens komt Kitty in een piccolopak op. Hans en Lola kijken verbaasd.)"},{"role":"KITTY","text":"(Tegen Simone) U had geroepen meneer?"},{"role":"SIMONE","text":"Inderdaad, zou u de koffer van deze gasten even naar boven kunnen brengen?"},{"role":"KITTY","text":"Natuurlijk, met genoegen meneer. (Kitty pakt de koffer aan.)"},{"role":"HANS","text":"Ben jij nu ineens de Piccolo?"},{"role":"KITTY","text":"Dat is correct meneer. Wij hébben zojuist een functioneringsgesprek gehad, gevolgd door een reorganisatie. (Kitty loopt behéndig de trap op met de koffer.)"},{"role":"LOLA","text":"Functioneringsgesprek en reorganisatie?"},{"role":"SIMONE","text":"Inderdaad. Kitty gaf aan dat hij het werk in de keuken saai en eenzaam vond. Hij wilde veel liever met mensen werken, vandaar dat hij nu Piccolo is."},{"role":"HANS","text":"Hmm, (dan tegen Lola) dan pakken we ze wel op het restaurant. Ze hebben immers nu geen kok! Haha. (tegen Simone) Wij zouden graag straks willen dineren in het restaurant, weer zo’n overheerlijke lopend kipbuffet!"},{"role":"SIMONE","text":"Helaas serveren wij vanavond geen lopend kipbuffet."},{"role":"HANS","text":"Ha! Nu heb ik je."},{"role":"SIMONE","text":"Ik zal de kok voor u halen, dan kan hij u vertellen waar u uit kunt kiezen vanavond. (Simone loopt naar de keukendeur en doet die open) Meneer de Chef, zou u even willen komen? (Vervolgens komt Piet via de keukendeur het podium op) Zou u meneer en juffrouw op de hoogte willen stellen van het menu?"},{"role":"PIET","text":"Natuurlijk. Vanavond hebben wij als voorgerecht keuze uit Gebonden Champignonsoep of Tomatencremesoep met verse room. Als hoofdgerecht kunt u kiezen uit Varkenshaas met peppersaus of gegrilde vis met pestoboter. Als nagerecht hebben wij dan weer als keuze roomijs met flensjes en rum of een heerlijk desserttaartje met vruchten."},{"role":"LOLA","text":"O, dat klinkt niet verkeerd Hans!"},{"role":"HANS","text":"Dat klinkt heel verkeerd Lola!"},{"role":"PIET","text":"Hopelijk mag ik u straks verwelkomen in het restaurant. (Piet draait zich om en gaat de keuken weer in)"},{"role":"HANS","text":"Hoe kan hij dan nu ineens de kok zijn?"},{"role":"SIMONE","text":"Hij kon het werk van Piccolo, met al die koffers de trap op, niet meer aan, maar toen bleek ineens dat hij thuis altijd het heerlijk vindt om voor familie en vrienden te koken. En een mooie bijkomstigheid, deze broek past hem ook beter!"},{"role":"HANS","text":"Ha, maar wat voor functie heeft die tuinman dan nu! (tegen Lola) Wat die ook doet, die blundert toch alles bij elkaar! Die weddenschap winnen is een makkie!"},{"role":"SIMONE","text":"Frits is nog gewoon tuinman."},{"role":"HANS","text":"Ha, dan zal ik die eens opzoeken, hè hè!"},{"role":"SIMONE","text":"Dat zal helaas even niet gaan, die is niet aanwezig."},{"role":"HANS","text":"Ja, hallo, zo werkt dat niet. Je kunt niet zomaar je personeel vrij geven om te voorkomen dat ze hier alles in de war sturen!"},{"role":"SIMONE","text":"O, maar die is ook niet vrij. Die is inkopen aan het doen."},{"role":"LOLA","text":"Inkopen?"},{"role":"SIMONE","text":"Ja, voor de Kerstpakketten."},{"role":"HANS","text":"Nou, dan blijft er waarschijnlijk nog één probleem over en dat is dat kamermeisje wat half overspannen hier rond loopt! Haha, we zullen eens even zien hoe die er in om blundert!"},{"role":"SIMONE","text":"O, maar wij hebben het probleem van haar opgelost. Zij heeft een extra hulp onder zich gekregen."},{"role":"HANS","text":"Ha, dat mag natuurlijk niet! Extra personeel erbij halen is niet eerlijk?"},{"role":"SIMONE","text":"Extra personeel?... (Op dat moment komen Grietje en Emma van de trap; beiden in dezelfde kamermeisjespakjes, met Grietje voorop.)"},{"role":"GRIETJE","text":"(Tegen Emma) En dan gaan we nu het restaurant op orde maken en daarna kun je de wasmachine uitladen en de nieuwe was er in stoppen. (Emma zucht zwaar, maar loopt gewillig achter Grietje aan en beiden verdwijnen in het restaurant.)"},{"role":"HANS","text":"Kom Lola, we gaan naar onze kamer. (Tegen Simone) Maar wij vinden wel wat hoor! Zo gemakkelijk geef ik mij niet gewonnen! (Hans en Lola gaan de trap op naar boven.)\n(Meneer Chateau komt via de deur van de keuken het toneel op en gaat aan de bar zitten.)"}]},{"title":"DERDE BEDRIJF — Scène 21","cards":[{"role":"MENEER CHATEAU","text":"En hoe gaat het tot nu toe?"},{"role":"SIMONE","text":"Op rolletjes!"},{"role":"MENEER CHATEAU","text":"Zo’n gesprek levert altijd wat op. En met een paar kleine veranderingen, kan het hotel hopelijk gered worden! (Frits komt met een navigatiesysteem via de voordeur binnen.)"},{"role":"SIMONE","text":"(Lichtelijk paniek) Wat moet jij hier!"},{"role":"FRITS","text":"Die Tomtom van jou deugt niet. Zo vind ik nooit de weg."},{"role":"SIMONE","text":"Wat is er dan mee?"},{"role":"FRITS","text":"Nou kijk, dan zegt die vrouw: Links afslaan! En dan wijst de pijl naar rechts! (Simone, meneer Chateau en Piet staan aandachtig het navigatiesysteem te bekijken. Simone pakt het navigatiesysteem uit Frits zijn handen en draait hem om.)"},{"role":"SIMONE","text":"Zo, en nu snel weg. Je hebt een belangrijke opdracht!"},{"role":"FRITS","text":"Ja! Kerstpakketten! (Frits gaat via de voordeur weer af.)"},{"role":"MENEER CHATEAU","text":"Dat viel gelukkig mee."},{"role":"SIMONE","text":"Inderdaad, Frits had het anders vast in het honderd laten lopen. (Een geluid van een startende auto met veel te veel gas klinkt.)"},{"role":"MENEER CHATEAU","text":"Nou, die heeft er zin in! Heeft hij wel een rijbewijs?"},{"role":"SIMONE","text":"Hmm, dat is een goeie vraag."},{"role":"MENEER CHATEAU","text":"Eh... (kijkt uit het raam) sturen kan hij in ieder geval niet..."},{"role":"SIMONE","text":"(kijkt nu ook) O nee, de begonia’s van de buurman! (Een geluid van piepende remmen van een auto klinkt, gevolgd door een harde knal.)"},{"role":"MENEER CHATEAU","text":"O jee, hij heeft zijn auto in de prak gereden!"},{"role":"SIMONE","text":"O nee, was het maar zo. Hij rijdt altijd brommer. Ik had hem mijn eigen auto meegegeven! (Piet komt gehaast uit de keuken gerend.)"},{"role":"PIET","text":"Er staat een auto midden in de keuken!"},{"role":"SIMONE","text":"Midden in de keuken!"},{"role":"PIET","text":"Dwars door het keukenblok! Hoe moet ik nu koken?"},{"role":"MENEER CHATEAU","text":"Dan moet ik vanavond maar weer naar Joco’s Kinderpannenkoekenpaleis. (Frits komt met zwarte vegen op zijn gezicht en verfrommelde kleding op via de keukendeur. Met in beide handen houdt hij een stuur vast.)"},{"role":"FRITS","text":"Ben ik hier bij de winkel voor Kerstpakketten? (Buurvrouw Gerrie komt woest via de voordeur binnen.)"},{"role":"GERRIE","text":"Dit wordt een gigantische claim! Die gek heeft mijn hele tuin omgeploegd met die auto!"},{"role":"MENEER CHATEAU","text":"(Wijst naar de trap) Volgens mij komt die Groothof daar de trap af! Volgens mij komt die..."},{"role":"SIMONE","text":"Hier is de schadevergoeding! (Reikt buurvrouw Gerrie een fles aan.)"},{"role":"GERRIE","text":"Nou mannetje, daar kom je niet zo gemakkelijk vanaf! (Simone stopt buurvrouw Gerrie nog een fles toe.) Hm, zo wel."},{"role":"SIMONE","text":"(tegen Piet) Hij (Frits) moet hier ook weg. (Simone duwt Gerrie de voordeur uit en Piet neemt Frits mee. Ondertussen komen eerst Lola en dan Hans via de trap op.)"},{"role":"LOLA","text":"Ja schat, ik hoorde echt een harde knal."},{"role":"HANS","text":"We zullen wel eens zien wat er allemaal mis is, haha!"},{"role":"SIMONE","text":"Hier is niets aan de hand hoor."},{"role":"HANS","text":"Hmm, dat zal wel. (Kijkt aandachtig rond.)"},{"role":"LOLA","text":"Wij wilden eigenlijk wel graag reserveren voor vanavond in het restaurant. Dat menu lijkt me wel wat."},{"role":"SIMONE","text":"Tja, het menu..."},{"role":"MENEER CHATEAU","text":"Ik hoorde net van de kok dat hij er aan zit te denken om het menu iets aan te passen. Houdt u van pannenkoeken?"},{"role":"HANS","text":"Pannenkoeken!"},{"role":"LOLA","text":"O ja! Pannenkoeken! Daar ben ik gek op!"},{"role":"HANS","text":"Dan maar pannenkoeken. Zullen wij weer even naar onze kamer Lola?"},{"role":"LOLA","text":"O ja, je was net bezig om me wat te overtuigen hè."},{"role":"HANS","text":"Jaja... (Hans en Lola gaan de trap weer op.)"},{"role":"MENEER CHATEAU","text":"Het probleem met de keuken is weer opgelost. Je belt straks hun bestelling door naar Joco’s Kinderpannenkoekenpaleis en haalt het daar weg, en zet het je gasten weer voor!"},{"role":"SIMONE","text":"Ik heb geen auto meer... maar daar vinden we wel wat op. ’t Is alleen jammer dat zijn vrouw er niet is."},{"role":"MENEER CHATEAU","text":"Hoezo?"},{"role":"SIMONE","text":"Hoe meer die hier rond loopt, des te meer kans dat hij naar zijn kamer of in die kast zit en dan gebeuren er weer van die dingen die misgaan."},{"role":"MENEER CHATEAU","text":"Tja, maar..."},{"role":"SIMONE","text":"Hmm, wacht
